w.cet-taiwan.org/story/202103/3917", "date": "2021/03/02"}], "examples": [{"title": "高雄30年城市轉型，犧牲帶消失了嗎？公民力量決定下一步", "url": "https://www.cet-taiwan.org/story/202609/100147", "date": "2026/09/04", "html": "\u003cp>\u003cimg alt=\"20260904-001.webp\" height=\"100%\" loading=\"lazy\" src=\"https://www.cet-taiwan.org/sites/default/files/u355/20260904-001.webp\" width=\"100%\"/> \u003cspan>從柴山往北遠眺半屏山的高雄地景，2015與2025年的對比，除了新建大樓之外，可見半屏山西側的中油高雄廠煙囟已消失，換成了台積電。 (李根政攝影)\u003c/span>\u003c/p>\u003cp>【編按】\u003c/p>\u003cp>高雄，過去依賴重工業作為發展基礎，嫌惡與工業設施北至楠梓、南至小港，圍繞著臨海地區與城市邊緣運作，進而產生許多城市犧牲帶；時至今日，民間聲音對美好生活與發展空間的渴望，迎來半導體產業與城市觀光地景帶來的都市轉型，讓亞洲新灣區、駁二成為如同鑽石的存在，讓此座工業城市逐步走向閃亮的樣貌。\u003c/p>", "role": "", "exampleNote": ""}, {"title": "看懂馬太鞍溪｜復原沒有同一個時鐘", "url": "https://www.cet-taiwan.org/story/202608/4892", "date": "2026/08/14", "html": "\u003cp>\u003cimg alt=\"\" height=\"1500\" loading=\"lazy\" src=\"https://www.cet-taiwan.org/sites/cet-taiwan.org/files/u146/20260814-2.jpg\" width=\"2000\"/>\u003c/p>\u003cp>農會超市終於重開幕了，更棒的是有咖啡雅座，許多居民無論購物與否，都約在窗明几淨的超市裡相聚。\u003cbr/>\u003cbr/>整修 8 個月，光豐農會超市才復原。它的復業比其他店家晚上許多，統冠災後約 1 個月就營業，全聯閉門 95 天，趕在去年底前重新開幕。光復的傳統市場（第一市場），今年 4 月 70 個攤商才熱鬧開張。\u003cbr/>\u003cbr/>這些時間點提供你一個理解光復的入口。災後復原不是一條所有人一起走的路，而是不同生活系統、以不同速度返回。超市、農田、住宅、道路與河川，各自有不同的損壞方式，也就有不同的修復時間。\u003c/p>\u003ch2>有些走得快，有些走得慢\u003c/h2>", "role": "", "exampleNote": ""}, {"title": "台灣如何從「與河爭地」走向「還地於河」？ 極端氣候下，從水泥工程、自然解方到馬太鞍溪的「還地於河」難題", "url": "https://www.cet-taiwan.org/story/202608/4891", "date": "2026/08/14", "html": "\u003cp>\u003cimg alt=\"20260814_001.png\" height=\"750\" loading=\"lazy\" src=\"https://www.cet-taiwan.org/sites/cet-taiwan.org/files/u353/20260814_001.png\" width=\"1200\"/> \u003cspan>蘇格蘭以自然式洪水管理 (Natural flood management) 實踐自然解方，推動還地於河、河道重新蜿蜒、恢復與洪泛平原的連結，在降低下游洪水壓力之餘，創造多樣化棲地環境。（照片來源：廖桂賢 攝）\u003c/span>\u003c/p>\u003cblockquote>\u003ch3>【編按】\u003c/h3> \u003cp>由超過10個環保團體攜手發起的「台灣氣候行動週」，在6月20日至7月5日間串聯全台7縣市舉辦超過20場跨界活動，討論能源轉型、氣候調適與青年未來等議題，其中地球公民基金會與台灣河溪網協會舉辦「氣候變遷調適：災害治理自然解方 (NbS) 的實踐與思辨」論壇，分享「自然解方 (NbS)」理念帶領民眾重新思考災害治理。\u003c/p> \u003cp>當千億治水與水泥工程在極端氣候下逐漸失靈，台灣的災害治理正迎來從「與河爭地」到「還地於河」的典範轉移。本文由學者、民間團體研究員引言帶領讀者深入思辨國際倡議的「自然解方（NbS）」反思如何跳脫水泥工程有所極限的治水輪迴 。並正視花蓮馬太鞍溪最真實的治理困局——當治水學理碰上錯綜複雜的原住民保留地歷史創傷時，「還地於河」的挑戰往往不在自然，而在人與制度。這絕非單純的防洪工程，而是一場修補社會裂痕、重新學習如何與河流共同安身立命的浩大社會溝通。\u003c/p> \u003c/blockquote>\u003ch3>【編按】\u003c/h3>", "role": "", "exampleNote": ""}]}, {"id": "empty", "name": "用空白 p 或 &nbsp; 拉開間距", "note": "空段落會多出一塊間距，貼到別的編輯器時常常變成多餘空行。", "promptHint": "段落之間插入空白 p（或只含空白的 p）來增加間距。", "articles": [{"title": "新材料循環產業園區會讓高雄大林蒲雪上加霜嗎？", "url": "https://www.cet-taiwan.org/story/202604/4831", "date": "2026/04/13"}, {"title": "戒嚴時代的核電廠，民主時代如何重新授權？核三再運轉計畫前的三個制度問題：核安、核廢與共識", "url": "https://www.cet-taiwan.org/story/202603/4808", "date": "2026/03/02"}, {"title": "【講座紀錄】能源轉型與空間規劃的挑戰：一場關於淨零與在地共榮的深度對話", "url": "https://www.cet-taiwan.org/story/202511/4778", "date": "2025/11/02"}, {"title": "那一夜，台灣差點發生核災", "url": "https://www.cet-taiwan.org/story/202508/3272", "date": "2025/08/30"}, {"title": "核三都蓋了，繼續用不好嗎？ ——4個核三重啟Q&A", "url": "https://www.cet-taiwan.org/story/202507/4459", "date": "2025/07/03"}, {"title": "SMR、核融合發展到哪了？支持核電前，你該知道 6 件事", "url": "https://www.cet-taiwan.org/story/202504/4622", "date": "2025/04/01"}, {"title": "守護健康，霧霾別再來！ 5 招改善台灣空氣污染", "url": "https://www.cet-taiwan.org/story/202502/4603", "date": "2025/02/05"}, {"title": "空污健康危害超過你想像，教你正確挑口罩、看空品指標", "url": "https://www.cet-taiwan.org/story/202412/4586", "date": "2024/12/30"}, {"title": "Is TSMC an effective environmental steward for Taiwan?", "url": "https://www.cet-taiwan.org/story/202412/4575", "date": "2024/12/05"}, {"title": "國土計畫上路後，我家的農地一輩子不能變更？國土計畫十萬個為什麼", "url": "https://www.cet-taiwan.org/story/202411/4566", "date": "2024/11/08"}, {"title": "我與地球公民基金會的NGO專業交流—Sarah Berg｜Pure Earth", "url": "https://www.cet-taiwan.org/story/202408/4540", "date": "2024/08/19"}, {"title": "台灣的核廢料何處去？現在已經可以處理了嗎？", "url": "https://www.cet-taiwan.org/story/202406/4507", "date": "2024/06/07"}, {"title": "愛地球也能賺錢：3 個住家屋頂光電國內外案例", "url": "https://www.cet- 12"}], "examples": [{"title": "新材料循環產業園區會讓高雄大林蒲雪上加霜嗎？", "url": "https://www.cet-taiwan.org/story/202604/4831", "date": "2026/04/13", "html": "\u003cp>表一、高雄市新增污染源排放量比較表（公噸）\u003c/p>\u003cp> \u003c/p>\u003cp>總懸浮微粒\u003c/p>", "role": "", "exampleNote": ""}, {"title": "戒嚴時代的核電廠，民主時代如何重新授權？核三再運轉計畫前的三個制度問題：核安、核廢與共識", "url": "https://www.cet-taiwan.org/story/202603/4808", "date": "2026/03/02", "html": "\u003cp>\u003cimg alt=\"20260303-006.jpg\" src=\"https://www.cet-taiwan.org/sites/cet-taiwan.org/files/u400/20260303-006.jpg\"/>\u003cbr/> \u003cspan>2014年4月26日，林義雄先生禁食要求「停建核四、還權於民」行動邁入第五天，五萬群眾聚集凱道要求「終結核電、還權於民」。(地球公民基金會志工提供)\u003c/span>\u003c/p>\u003cp> \u003c/p>\u003cp> \u003c/p>", "role": "", "exampleNote": ""}, {"title": "【講座紀錄】能源轉型與空間規劃的挑戰：一場關於淨零與在地共榮的深度對話", "url": "https://www.cet-taiwan.org/story/202511/4778", "date": "2025/11/02", "html": "\u003cp dir=\"ltr\">這場深入的對話清楚指出，能源轉型不僅是工程技術問題，更是空間正義與社會治理的挑戰。唯有透過中央與地方的互惠協作、差異化治理，並讓在地民眾真正參與決策，才能克服轉型陣痛，邁向淨零目標。\u003c/p>\u003cp dir=\"ltr\"> \u003c/p>\u003cp dir=\"ltr\"> \u003c/p>", "role": "", "exampleNote": ""}]}, {"id": "br", "name": "p 裡面用 br 換行", "note": "同一段裡換行，行距比段落緊。適合地址或清單項目內換行，不適合拿來切換正文段落。", "promptHint": "同一段裡要換行時使用 br，不要為了換行而新開一個 p。", "articles": [{"title": "走進森林的霧裡，看見台灣山林的多重歷史 | 高雄場《變更之地》Ｘ《複層之森》映後座談", "url": "https://www.cet-taiwan.org/story/202607/4873", "date": "2026/07/20"}, {"title": "有一種倡議叫做前仆後繼-中油高廠關廠十周年感恩茶會側記", "url": "https://www.cet-taiwan.org/story/202606/4866", "date": "2026/06/16"}, {"title": "交通三案基本資訊", "url": "https://www.cet-taiwan.org/story/202405/4502", "date": "2024/05/27"}, {"title": "儘速終結高市鋼鐵業寬鬆的空污標準！", "url": "https://www.cet-taiwan.org/story/202112/4069", "date": "2021/12/09"}, {"title": "林務局屏東林管處回應講座中民眾的提問", "url": "https://www.cet-taiwan.org/story/202108/4045", "date": "2021/08/20"}, {"title": "【講座紀錄】4/23《煙囪下的天空》高雄石化空污講座", "url": "https://www.cet-taiwan.org/story/202105/3953", "date": "2021/05/10"}], "examples": [{"title": "走進森林的霧裡，看見台灣山林的多重歷史 | 高雄場《變更之地》Ｘ《複層之森》映後座談", "url": "https://www.cet-taiwan.org/story/202607/4873", "date": "2026/07/20", "html": "\u003cp>《變更之地》聚焦於雙流地區作為第一期林相變更實施區域的歷史。所謂「林相變更」，是戰後台灣林業政策的重要工程之一。當時林業單位認為許多天然林、草生地蓄積量偏低，無法有效生產木材，因此透過大規模伐除天然植被，改種光臘樹、相思樹等經濟樹種，希望打造更具生產價值的森林。\u003cbr/>\u003cbr/>片中多位曾參與林班工作的受訪者回憶，1960至1970年代是造林工作的高峰期。有人小學畢業便投入林班，有人從伐木轉做造林，也有人在苗圃工作。雙流地區的林班工作最盛時期甚至有上千名工人共同生活、工作。\u003cbr/>\u003cbr/>現在的森林遊樂區步道，多是昔日運送木材的林道；如今遊客漫步其中，很難想像腳下曾是伐木與造林的現場。\u003cbr/>\u003cbr/>影片中曾參與林業工作的受訪者認為，每個時代都有不同的背景與價值判斷。當年的林業人員相信自己正在打造更理想的森林，而今日的台灣則更重視生態保育與自然復育。究竟林相變更是成功還是失敗，或許仍需要更長的時間來回答。\u003c/p>", "role": "", "exampleNote": ""}, {"title": "有一種倡議叫做前仆後繼-中油高廠關廠十周年感恩茶會側記", "url": "https://www.cet-taiwan.org/story/202606/4866", "date": "2026/06/16", "html": "\u003cp>註1：\u003ca href=\"https://www.cet-taiwan.org/info/news/1669\">2013年後勁社會福利基金會、地球公民基金會、高雄後勁中油遷廠促進會、煉油廠轉型生態公園促進會催生後勁生態公園，辦理全國競圖比賽\u003c/a>。\u003cbr/>註2：\u003ca href=\"https://www.twreporter.org/a/refinery-close-up-3years-01\">2007年中油規劃投資興建加氫脫硫工場，遭遇後勁社區抗爭，最終沒有蓋成。\u003c/a>\u003cbr/>註3：\u003ca href=\"https://zh.wikipedia.org/zh-tw/%E7%B6%A0%E8%89%B2%E5%B0%8F%E7%B5%84\">綠色小組為記錄社運活動的攝影團體，由王智章、李三沖、傅島和林信誼等人組成。\u003c/a>\u003cbr/>註4：茶會與會者中，戲稱中油燃燒塔是光明燈，一年三百六十五天都亮著，搭車時只要聞到氣味，就知道高雄楠梓到了。\u003cbr/>註5：美國環保署將褐地其定義為棄置、廢棄或未達充分利用的土地，因受污染導致土地本身無法再開發利用。褐地再利用是新的都市土地開發策略，不僅可以舒緩城市發展壓力，促進國土永續利用，並且提升經濟之發展。（資料來源：\u003ca href=\"https://www.npf.org.tw/3/12562\">國家政策研究基金會\u003c/a>）\u003c/p>", "role": "", "exampleNote": ""}, {"title": "交通三案基本資訊", "url": "https://www.cet-taiwan.org/story/202405/4502", "date": "2024/05/27", "html": "\u003ch2>交通三案的重點為何\u003c/h2>\u003cp dir=\"ltr\">在立法院第11屆第一個會期，分別有國民黨黨團委員提案連署，在程序委員會保留條文，其中環島高鐵與花東快的送出程序委員會，原定排入5月17日院會議程，但立法院長建議待新任交通部長上任再行討論，雖然沒有做成明確協商結論，但也沒有進入實質審議。目前交通三案的可行性評估皆未完成，貿然透過立法權狹持行政機關在可行性、預算、使用需求、效益、工程技術、環境保護等不確定性仍然存在的情境下限時完成建設，更顯得提案的荒謬性。\u003c/p>\u003cul> \u003cli dir=\"ltr\"> \u003cp dir=\"ltr\">花東快工程的簡介\u003cbr/> 起點新城，銜接未來蘇花安，終點台東卑南，全長173.7公里，沿線設置17處交流道，2020年重啟可行性評估，交通部預計今年底前完成評估，規劃預算2555億。除了市區路段採取高架，多數路段以路堤為主，將切穿許多部落土地以及平地森林，更與嶺頂斷層、奇美斷層、玉里斷層、池上斷層、鹿野斷層、利吉斷層等斷層交會或是平行。\u003c/p> \u003c/li> \u003cli dir=\"ltr\"> \u003cp dir=\"ltr\">國道六工程的簡介\u003cbr/> 自埔里延伸現有國道六號，途經霧社、廬山、能高山、銅門於吉安與花東快（高）銜接，延伸路線總長90公里，其中約50公里為隧道，根據交通部2021年的評估，每公里估計平均造價89億元，總價約8000億元。國道六號東延打通能高山需要面對數千公尺厚的地層岩覆所帶來地熱、岩爆、湧水，還有沿途許多的地質破碎帶（包含斷層），更會穿越丹大野生動物保護區。\u003c/p> \u003c/li> \u003cli dir=\"ltr\"> \u003cp dir=\"ltr\">環島高鐵工程的簡介\u003cbr/> 預計分別自宜蘭與屏東高鐵延伸計畫端點串連花蓮與台東地區，但目前尚缺乏評估資料，興建時程、計劃路廊、預定站位、運量評估目前皆無資訊可參考。目前可知的主要瓶頸有蘇花路段缺乏路廊需要大量的隧道穿越，花東路段需要面對許多斷層通過路線，南迴路廊除了與蘇花一樣需要大量隧道，若採取最短距離方案也會遭遇通過自然保留區的課題。\u003c/p> \u003c/li> \u003c/ul>", "role": "", "exampleNote": ""}]}]}, {"id": "heading", "name": "內文小標", "field": "#body", "exclusive": false, "summary": "同一篇可以同時有 h2 和 h3，所以篇數加總會超過 180。這裡比的是小標用真的標題標籤，還是用加粗段落、【】段落來假裝標題。", "official": "範本依序使用 h2、h3、h4。它明確不建議為了做小標去改字級、字色或字體。", "officialHtml": "\u003ch2>標題2\u003c/h2>\u003cp>這是段落文字。我們認為新媒體/資訊傳播科技（New Media/Information Communication Technology）除了為大眾帶來更好、更酷的生活之外，還能夠促成社會變革，影響文化、政治、環境等公共議題。這是註解範例。我們的願景是促成一般網路使用者、非營利組織工作者、商業經營者，皆能善用資訊傳播科技、採取行動，改變自己與世界！\u003c/p>", "variants": [{"id": "h2", "name": "h2", "note": "內文大標。官方範本的第一層就是 h2。有的稿 h2 包了好幾層 span，那是編輯器留下的，不是另一種標題。", "promptHint": "內文章節使用 h2。不要在標題裡疊 span，也不要用加粗段落代替 h2。", "articles": [{"title": "高雄30年城市轉型，犧牲帶消失了嗎？公民力量決定下一步", "url": "https://www.cet-taiwan.org/story/202609/100147", "date": "2026/09/04"}, {"title": "看懂馬太鞍溪｜復原沒有同一個時鐘", "url": "https://www.cet-taiwan.org/story/202608/4892", "date": "2026/08/14"}, {"title": "看懂馬太鞍溪｜紊亂中，如何成為地方的眼睛", "url": "https://www.cet-taiwan.org/story/202607/4879", "date": "2026/07/28"}, {"title": "看懂馬太鞍溪｜面對堰塞湖，我們如何從災民變回公民", "url": "https://www.cet-taiwan.org/story/202607/4874", "date": "2026/07/22"}, {"title": "走進森林的霧裡，看見台灣山林的多重歷史 | 高雄場《變更之地》Ｘ《複層之森》映後座談", "url": "https://www.cet-taiwan.org/story/202607/4873", "date": "2026/07/20"}, {"title": "【講座紀錄】能源轉型與空間規劃的挑戰：一場關於淨零與在地共榮的深度對話", "url": "https://www.cet-taiwan.org/story/202511/4778", "date": "2025/11/02"}, {"title": "那一夜，台灣差點發生核災", "url": "https://www.cet-taiwan.org/story/202508/3272", "date": "2025/08/30"}, {"title": "核三下方有活動斷層？ 02/4115", "date": "2022/02/23"}, {"title": "好好去旅行：我們期待的觀光發展", "url": "https://www.cet-taiwan.org/story/202109/4032", "date": "2021/09/24"}, {"title": "百年大旱救高雄的伏流水，二峰圳顛覆的取水思維", "url": "https://www.cet-taiwan.org/story/202109/4007", "date": "2021/09/01"}, {"title": "遺忘海洋的島國：國土計畫之海洋資源區", "url": "https://www.cet-taiwan.org/story/202107/3991", "date": "2021/07/06"}], "examples": [{"title": "福島核災後15年，日本與台灣核電的抉擇與風險", "url": "https://www.cet-taiwan.org/story/202603/4821", "date": "2026/03/11", "html": "\u003cul> \u003cli>第一階段為現況評估與自主安全檢查，目前已由台電與經濟部啟動。\u003c/li> \u003cli>第二階段為技術審查，包括老化評估、耐震分析與輻射影響評估等，由核安會與國際專家進行審查。\u003c/li> \u003cli>第三階段才是政治決策，包括是否提出再運轉申請、核安會是否核發執照，以及是否需要環評等問題。\u003c/li> \u003c/ul>", "role": "一般條列", "exampleNote": ""}, {"title": "交通三案基本資訊", "url": "https://www.cet-taiwan.org/story/202405/4502", "date": "2024/05/27", "html": "\u003cul> \u003cli dir=\"ltr\"> \u003cp dir=\"ltr\">花東快工程的簡介\u003cbr/> 起點新城，銜接未來蘇花安，終點台東卑南，全長173.7公里，沿線設置17處交流道，2020年重啟可行性評估，交通部預計今年底前完成評估，規劃預算2555億。除了市區路段採取高架，多數路段以路堤為主，將切穿許多部落土地以及平地森林，更與嶺頂斷層、奇美斷層、玉里斷層、池上斷層、鹿野斷層、利吉斷層等斷層交會或是平行。\u003c/p> \u003c/li> \u003cli dir=\"ltr\"> \u003cp dir=\"ltr\">國道六工程的簡介\u003cbr/> 自埔里延伸現有國道六號，途經霧社、廬山、能高山、銅門於吉安與花東快（高）銜接，延伸路線總長90公里，其中約50公里為隧道，根據交通部2021年的評估，每公里估計平均造價89億元，總價約8000億元。國道六號東延打通能高山需要面對數千公尺厚的地層岩覆所帶來地熱、岩爆、湧水，還有沿途許多的地質破碎帶（包含斷層），更會穿越丹大野生動物保護區。\u003c/p> \u003c/li> \u003cli dir=\"ltr\"> \u003cp dir=\"ltr\">環島高鐵工程的簡介\u003cbr/> 預計分別自宜蘭與屏東高鐵延伸計畫端點串連花蓮與台東地區，但目前尚缺乏評估資料，興建時程、計劃路廊、預定站位、運量評估目前皆無資訊可參考。目前可知的主要瓶頸有蘇花路段缺乏路廊需要大量的隧道穿越，花東路段需要面對許多斷層通過路線，南迴路廊除了與蘇花一樣需要大量隧道，若採取最短距離方案也會遭遇通過自然保留區的課題。\u003c/p> \u003c/li> \u003c/ul>", "role": "一般條列", "exampleNote": "這仍是 ul。br 在 li 裡面，用來換行，不是拿來取代清單。"}, {"title": "森林有碳匯，但不只是碳匯--讓森林碳匯提昇台灣森林的多元功能", "url": "https://www.cet-taiwan.org/story/202211/4210", "date": "2022/11/16", "html": "\u003cul> \u003cli>環境保護（E，environment）： 溫室氣體排放、水及汙水管理、生物多樣性等環境汙染防治與控制。\u003c/li> \u003cli>社會責任（S，social）： 客戶福利、勞工關係、多樣化與共融等售產業影響之利害關係人等面向。\u003c/li> \u003cli>公司治理（G，governance）： 商業倫理、競爭行為、供應鏈管理等與公司穩定度及聲譽相關。\u003c/li> \u003c/ul>", "role": "表格裡的清單", "exampleNote": ""}]}, {"id": "ol", "name": "ol 編號清單", "note": "需要順序或編號時用 ol。有的編號清單出現在表格裡，有的在內文。", "promptHint": "有順序的多筆資料使用 ol > li。不要自己在 p 開頭打 1. 2. 3.。", "articles": [{"title": "土地會說話，植物有靈魂：看見原住民族的山林哲學 《有靈 • 原民植物智慧》講座談起", "url": "https://www.cet-taiwan.org/story/202508/4736", "date": "2025/08/29"}, {"title": "農地治理新藍圖：從國土計畫到農政資源的永續規劃", "url": "https://www.cet-taiwan.org/story/202412/4581", "date": "2024/12/26"}, {"title": "展覽中的使用的材料—從減塑到無塑展覽的可能性", "url": "https://www.cet-taiwan.org/story/202407/4526", "date": "2024/07/16"}, {"title": "摸索台灣山林保育與產業衝突的調解路徑：安朔殼斗科森林的危機與解方", "url": "https://www.cet-taiwan.org/story/202405/4496", "date": "2024/05/27"}, {"title": "水文與氣候科學在法庭匯流──豐坪溪水力開發的環境影響辯證", "url": "https://www.cet-taiwan.org/story/202405/4492", "date": "2024/05/20"}, {"title": "鎮西堡，與森林共存的原住民部落", "url": "https://www.cet-taiwan.org/story/202303/4258", "date": "2023/03/06"}, {"title": "淨零12項關鍵戰略社會溝通會議--能源系統去碳化", "url": "https://www.cet-taiwan.org/story/202212/4234", "date": "2022/12/18"}, {"title": "淨零12項關鍵戰略「節能」社會溝通延續會議--商業節能", "url": "https://www.cet-taiwan.org/story/202211/4246", "date": "2022/11/21"}, {"title": "淨零12項關鍵戰略社會溝通會議--自然碳匯", "url": "https://www.cet-taiwan.org/story/202211/4237", "date": "2022/11/19"}, {"title": "【邁向淨零，高雄行不行？】在地淨零論壇--高雄市政府回應參與者提問", "url": "https://www.cet-taiwan.org/story/202210/4212", "date": "2022/10/23"}, {"title": "從「國產材元年」談台灣森林的經營管理－聽眾提問與林務局回應整理紀錄", "url": "https://www.cet-taiwan.org/story/202206/4220", "date": "2022/06/25"}, {"title": "露營場不應無條件合法，應制定彈性且因地制宜的管理辦法", "url": "https://www.cet-taiwan.org/story/202106/3975", "date": "2021/06/28"}], "examples": [{"title": "展覽中的使用的材料—從減塑到無塑展覽的可能性", "url": "https://www.cet-taiwan.org/story/202407/4526", "date": "2024/07/16", "html": "\u003col> \u003cli>作品製作：視各種創作材料及裝裱方式差異，對環境的影響不同。\u003c/li> \u003cli>展品運輸：搬運公司使用氣泡袋等包材，運輸的耗能等。\u003c/li> \u003cli>展覽空間的製作：展櫃展架使用到的木作、油漆等。\u003c/li> \u003cli>展場設施及運作：維護作品環境條件，例如冷氣、燈光、平板電視等耗能。\u003c/li> \u003cli>展覽宣傳及週邊：輸出品（作品說明牌、海報、邀請卡、感謝狀、名牌、展板、回饋單）；文宣品（折頁、DM）；開幕使用的布條、看板花籃；餐點；一次性餐具；大型展覽的籌備過程的印製文件及其他耗材。\u003c/li> \u003cli>撤展後所剩下的廢棄物。\u003c/li> \u003c/ol>", "role": "一般條列", "exampleNote": ""}, {"title": "農地治理新藍圖：從國土計畫到農政資源的永續規劃", "url": "https://www.cet-taiwan.org/story/202412/4581", "date": "2024/12/26", "html": "\u003col> \u003cli>供農作、森林、養殖、畜牧及保育使用者。\u003c/li> \u003cli>供與農業經營不可分離之農舍、畜禽舍、倉儲設備、曬場、集貨場、農路、灌溉、排水及其他農用之土地。\u003c/li> \u003cli>農民團體與合作農場所有直接供農業使用之倉庫、冷凍（藏）庫、農機中心、蠶種製造（繁殖）場、集貨場、檢驗場等用地。\u003c/li> \u003c/ol>", "role": "表格裡的清單", "exampleNote": ""}, {"title": "土地會說話，植物有靈魂：看見原住民族的山林哲學 《有靈 • 原民植物智慧》講座談起", "url": "https://www.cet-taiwan.org/story/202508/4736", "date": "2025/08/29", "html": "\u003col> \u003cli>\u003cstrong>口（吃／說）\u003c/strong>\u003cbr/>從餐桌開始，你學會開口說話、學會進食，也在與長輩同桌的日常裡，學禮貌與規矩：怎麼先向長輩致意、逐漸明白「吃」不只是填飽肚子，更是分享、感恩與連結的開始。\u003c/li> \u003cli>\u003cstrong>足（行走／探索）\u003c/strong>\u003cbr/>會走路後，你用腳去丈量世界，分辨方位、熟悉地形，知道哪裡安全、哪裡需要結伴。感受季節與環境的變化，學會在移動中認識自己與所在之地的關係。\u003c/li> \u003cli>\u003cstrong>手（做／採集）\u003c/strong>\u003cbr/>你開始用手去做事：辨認可食的野菜與有毒的植物，學習採集與處理的方法，懂得工具怎麼拿、火要怎麼生。學習「取用有度」的規矩：只拿需要的、保留再生的空間，把做事的技巧與對土地的敬重結合在一起，慢慢累積起生活與生存的知識。\u003c/li> \u003cli>\u003cstrong>頭（感／想）\u003c/strong>\u003cbr/>有了經驗，你開始提問與思考：為什麼要這樣做？故事或預言背後想提醒的是什麼？你學會把聽來的話與親眼見到的事對照，分辨因果、衡量後果，建立自己的判斷。\u003c/li> \u003cli>\u003cstrong>心（慾／念）\u003c/strong>\u003cbr/>之後你能同理他人的感受，理解人情世故；也學會看見自己心裡的欲望與念頭，知道何時該克制、何時該堅持。你在日常行為裡讀懂文化的意義。做每件事，不只「會做」，而是「懂得為何而做」。\u003c/li> \u003cli>\u003cstrong>靈（智慧／連結）\u003c/strong>\u003cbr/>一路走來，你長出靈性與感謝：會回望自己的來處，串起家族、地名、故事與土地的線索，知道自己是誰、從哪裡來、和什麼相連。你把感恩化為行動回饋、守護、傳承。讓文化繼續流動。\u003c/li> \u003c/ol>", "role": "一般條列", "exampleNote": "這仍是 ol。br 在 li 裡面，用來換行，不是拿來取代清單。"}]}, {"id": "br", "name": "同一個 p，用 br 分行", "note": "標題和每一筆放在同一個 p，中間用 br。視覺上像清單，但沒有清單語意，行距也比 li 更緊、和上下段落黏在一起。", "promptHint": "多筆補充、參考資料或延伸閱讀放在同一個 p，每一筆之間用 br。", "articles": [{"title": "有一種倡議叫做前仆後繼-中油高廠關廠十周年感恩茶會側記", "url": "https://www.cet-taiwan.org/story/202606/4866", "date": "2026/06/16"}, {"title": "那一夜，台灣差點發生核災", "url": "https://www.cet-taiwan.org/story/202508/3272", "date": "2025/08/30"}, {"title": "持續改善空污，毋須核電作解方", "url": "https://www.cet-taiwan.org/story/202508/4726", "date": "2025/08/07"}, {"title": "核三都蓋了，繼續用不好嗎？ ——4個核三重啟Q&A", "url": "https://www.cet-taiwan.org/story/202507/4459", "date": "2025/07/03"}, {"title": "SMR、核融合發展到哪了？支持核電前，你該知道 6 件事", "url": "https://www.cet-taiwan.org/story/202504/4622", "date": "2025/04/01"}, {"title": "守護健康，霧霾別再來！ 5 招改善台灣空氣污染", "url": "https://www.cet-taiwan.org/story/202502/4603", "date": "2025/02/05"}, {"title": "空污健康危害超過你想像，教你正確挑口罩、看空品指標", "url": "https://www.cet-taiwan.org/story/202412/4586", "date": "2024/12/30"}, {"title": "台灣的核廢料何處去？現在已經可以處理了嗎？", "url": "https://www.cet-taiwan.org/story/202406/4507", "date": "2024/06/07"}, {"title": "水文與氣候科學在法庭匯流──豐坪溪水力開發的環境影響辯證", "url": "https://www.cet-taiwan.org/story/202405/4492", "date": "2024/05/20"}, {"title": "台灣電價一直漲，合理嗎？", "url": "https://www.cet-taiwan.org/story/202405/4487", "date": "2024/05/14"}, {"title": "儘速終結高市鋼鐵業寬鬆的空污標準！", "url": "https://www.cet-taiwan.org/story/202112/4069", "date": "2021/12/09"}, {"title": "林務局屏東林管處回應講座中民眾的提問", "url": "https://www.cet-taiwan.org/story/202108/4045", "date": "2021/08/20"}], "examples": [{"title": "有一種倡議叫做前仆後繼-中油高廠關廠十周年感恩茶會側記", "url": "https://www.cet-taiwan.org/story/202606/4866", "date": "2026/06/16", "html": "\u003cp>參考資料：\u003cbr/>1.堅持-後勁反五輕的未竟之路，地球公民基金會、透南風工作室，2015年10月\u003cbr/>2.\u003ca href=\"https://www.city.yokkaichi.mie.jp/yokkaichikougai-kankyoumiraikan/\">日本四日市「公害與未來館」\u003c/a>\u003c/p>", "role": "一般條列", "exampleNote": ""}, {"title": "核三都蓋了，繼續用不好嗎？ ——4個核三重啟Q&A", "url": "https://www.cet-taiwan.org/story/202507/4459", "date": "2025/07/03", "html": "\u003cp>延伸閱讀：\u003cbr/>\u003ca href=\"https://www.cet-taiwan.org/node/4621\">〈台灣續用核電，必須要面對這 5 個問題？〉\u003c/a>\u003cbr/>\u003ca href=\"https://www.cet-taiwan.org/node/4622\">〈SMR、核融合發展到哪了？支持核電前，你該知道 6 件事〉\u003c/a>\u003cbr/>\u003ca href=\"https://www.cet-taiwan.org/node/4507\">〈台灣的核廢料何處去？現在已經可以處理了嗎？〉\u003c/a>\u003c/p>", "role": "延伸閱讀", "exampleNote": ""}, {"title": "SMR、核融合發展到哪了？支持核電前，你該知道 6 件事", "url": "https://www.cet-taiwan.org/story/202504/4622", "date": "2025/04/01", "html": "\u003cp>延伸閱讀：\u003ca href=\"https://www.cet-taiwan.org/node/4621\">台灣續用核電，必須要面對這 4 個問題？\u003c/a>\u003c/p>\u003cp>\u003cstrong>如果想了解更多核電與能源資訊，歡迎訂閱「核不延役」電子報：\u003c/strong>\u003c/p>\u003cp>\u003ca id=\"[1]\" name=\"[1]\">\u003c/a> 註1：Sovacool, B. K. (2008). \"Valuing the greenhouse gas emissions from nuclear power: A critical survey.\" Energy Policy 36(8): 2950-2963.\u003cbr/> \u003ca id=\"[2]\" name=\"[2]\">\u003c/a> 註2：目前台灣用以支應核電廠除役所需經費之核後端基金，2017 年評估核電廠除役經費需要 4729 億，但目前核後端基金尚不足 1700 億元。\u003cbr/> \u003ca id=\"[3]\" name=\"[3]\">\u003c/a> 註3：由美國核能管理委員會的前主席、美國國家工程院院士與史丹佛大學博士後研究員共同在《美國國家科學院院刊》發表的\u003ca href=\"https://www.pnas.org/doi/full/10.1073/pnas.2111833119\">研究\u003c/a>\u003cbr/> \u003ca id=\"[4]\" name=\"[4]\">\u003c/a> 註4：傳言的「核能三倍」非官方決議，此消息僅是會外 28 國的倡議活動。\u003cbr/> \u003ca id=\"[5]\" name=\"[5]\">\u003c/a> 註5：目前支持核電延役的討論大部分集中在核二與核三，其中又以核三最常見。核三一年最多能發約 160 億度電。假設 2030 年開始延役續用，按照經濟部推估的用電成長，從 2024 年到 2030 年約成長 12%-13%，2024 年總用電量為 2833.5*1.12=3174 億度。因此核三延役能為台灣帶來的電力貢獻佔比約為 5%(160/3174）。\u003c/p>", "role": "延伸閱讀", "exampleNote": ""}]}, {"id": "multi-p", "name": "每一筆各一個 p", "note": "每一筆都是獨立段落。段距會比清單開，也比較像正文，而不是一組附屬資料。", "promptHint": "每一筆補充、參考或延伸資料各寫成一個 p。", "articles": [{"title": "新材料循環產業園區會讓高雄大林蒲雪上加霜嗎？", "url": "https://www.cet-taiwan.org/story/202604/4831", "date": "2026/04/13"}, {"title": "【講座紀錄】能源轉型與空間規劃的挑戰：一場關於淨零與在地共榮的深度對話", "url": "https://www.cet-taiwan.org/story/202511/4778", "date": "2025/11/02"}, {"title": "從1985年的火災，看見核三40年的風險與責任", "url": "https://www.cet-taiwan.org/story/202508/4731", "date": "2025/08/22"}, {"title": "持續改善空污，毋須核電作解方", "url": "https://www.cet-taiwan.org/story/202508/4726", "date": "2025/08/07"}, {"title": "核三都蓋了，繼續用不好嗎？ ——4個核三重啟Q&A", "url": "https://www.cet-taiwan.org/story/202507/4459", "date": "2025/07/03"}, {"title": "SMR、核融合發展到哪了？支持核電前，你該知道 6 件事", "url": "https://www.cet-taiwan.org/story/202504/4622", "date": "2025/04/01"}, {"title": "台灣續用核電，必須要面對這 5 個問題？", "url": "https://www.cet-taiwan.org/story/202504/4621", "date": "2025/04/01"}, {"title": "空污健康危害超過你想像，教你正確挑口罩、看空品指標", "url": "https://www.cet-taiwan.org/story/202412/4586", "date": "2024/12/30"}, {"title": "水文與氣候科學在法庭匯流──豐坪溪水力開發的環境影響辯證", "url": "https://www.cet-taiwan.org/story/202405/4492", "date": "2024/05/20"}, {"title": "光電先蓋小屋頂，太陽能躉購費率6元起--小市民要發電—全民能源參與之路", "url": "https://www.cet-taiwan.org/story/202311/4393", "date": "2023/11/13"}, {"title": "【講座側記】7/15擺脫行人地獄，打造永續健康的交通環境", "url": "https://www.cet-taiwan.org/story/202307/4341", "date": "2023/07/15"}, {"title": "地球公民針對性騷事件的後續處理措施", "url": "https://www.cet-taiwan.org/story/202306/4328", "date": "2023/06/12"}, {"title": "5/26【講座側記】農地工廠收納術（精要版）", "url": "https://www.cet-taiwan.org/story/202305/4403", "date": "2023/05/26"}, {"title": "環境部不應只有升格和升官，卻沒有改造", "url": "https://www.cet-taiwan.org/story/202303/4257", "date": "2023/03/02"}, {"title": "淨零12項關鍵戰略社會溝通會議--淨零綠生活", "url": "https://www.cet-taiwan.org/story/202211/4228", "date": "2022/11/24"}, {"title": "淨零12項關鍵戰略「節能」社會溝通延續會議--工業節能", "url": "https://www.cet-taiwan.org/story/202211/4248", "date": "2022/11/23"}, {"title": "淨零12項關鍵戰略「節能」社會溝通延續會議--商業節能", "url": "https://www.cet-taiwan.org/story/202211/4246", "date": "2022/11/21"}, {"title": "【講座側記】6/28汽機車大國，公共運輸如何可能？", "url": "https://www.cet-taiwan.org/story/202207/4161", "date": "2022/07/18"}, {"title": "面對大旱，啟動東港溪污染整治", "url": "https://www.cet-taiwan.org/story/202106/3965", "date": "2021/06/01"}], "examples": [{"title": "【講座紀錄】能源轉型與空間規劃的挑戰：一場關於淨零與在地共榮的深度對話", "url": "https://www.cet-taiwan.org/story/202511/4778", "date": "2025/11/02", "html": "\u003cp dir=\"ltr\">\u003cstrong>1. 整體性框架建構：\u003c/strong>建立部門別的空間規劃 當前政府缺乏光電發展的整體圖像，實務上多由資本市場自行媒合運作，但推動方式仍沿用傳統由上而下的政策路徑。在政府角色缺席的情況下，卻引入電力開發商主導開發，導致農漁民在缺乏可信任對象下，被動面對零散、遍地開花的案場開發。因此，首要之務是建立光電發展的整體策略架構，並將其落實為具體的規模型案場開發程序與管理制度。\u003c/p>\u003cp> \u003cstrong>2. 部門合作治理：\u003c/strong>推動跨部會的政策協調 雖然農業部門與能源部門皆表示支持再生能源發展，但實際政策取向與執行方式卻存在明顯落差。為化解部門間的斷裂，必須推動應用型光電的普及與共享機制，使能源設施不再僅是單一目的的土地使用，而能促進土地複合利用與環境共榮發展。\u003c/p>\u003cp> \u003cstrong>3. 結合地方永續發展：\u003c/strong>發展跨域夥伴關係 在現行制度下，中央政府作為「第三端」的介入，反而成為開發不確定性的來源。再生能源發展必須回到地方層級，讓基層民眾能實質參與決策，並將空間規劃與治理責任落實到地方政府。唯有透過跨域夥伴關係的建立，促進光電發展與地方共榮，並結合民眾參與及公正轉型，才能回應地方永續發展的需求。\u003c/p>", "role": "一般條列", "exampleNote": ""}, {"title": "SMR、核融合發展到哪了？支持核電前，你該知道 6 件事", "url": "https://www.cet-taiwan.org/story/202504/4622", "date": "2025/04/01", "html": "\u003cp>延伸閱讀：\u003ca href=\"https://www.reccessary.com/zh-tw/news/world-market/nuclear-energy-can%E2%80%99t-solve-the-climate-crisis\">核綠共存可行嗎？7個核能無法成為氣候危機解方的關鍵\u003c/a>\u003c/p>\u003cp>\u003cimg alt=\"20231011-001_0.jpg\" src=\"https://www.cet-taiwan.org/sites/cet-taiwan.org/files/u400/20231011-001_0.jpg\"/>\u003cspan>圖：地球公民基金會 素材：photo by Doreen Chen on Pexels, vector by Freepik\u003c/span>\u003c/p>", "role": "延伸閱讀", "exampleNote": ""}, {"title": "SMR、核融合發展到哪了？支持核電前，你該知道 6 件事", "url": "https://www.cet-taiwan.org/story/202504/4622", "date": "2025/04/01", "html": "\u003cp>延伸閱讀：\u003c/p>\u003cp>\u003cu>〈\u003c/u>\u003ca href=\"https://www.cet-taiwan.org/node/4507\">台灣的核廢料何處去？現在已經可以處理了嗎？\u003c/a>〉\u003c/p>\u003cp dir=\"ltr\">泛科學影片〈\u003ca href=\"https://www.youtube.com/watch?app=desktop&amp;v=oqnDV07yxTM\">核電跟天然氣是綠能你信嗎？歐盟是為了淨零排放還是政治考量？這能源真的乾淨嗎？\u003c/a>〉\u003c/p>", "role": "延伸閱讀", "exampleNote": ""}]}, {"id": "heading", "name": "h2 或 h3 當區標，下面再接內容", "note": "「延伸閱讀」「參考資料」做成真的小標，下面才是連結或段落。區標和內文分開。", "promptHint": "補充、參考或延伸閱讀若獨立成區，區名使用 h3，下面的多筆資料再用本文件選定的清單寫法。", "articles": [{"title": "台灣如何從「與河爭地」走向「還地於河」？ 極端氣候下，從水泥工程、自然解方到馬太鞍溪的「還地於河」難題", "url": "https://www.cet-taiwan.org/story/202608/4891", "date": "2026/08/14"}, {"title": "藍綠立委停止踐踏國土秩序 國土計畫不該因少數3縣市延宕上路", "url": "https://www.cet-taiwan.org/story/202412/4582", "date": "2024/12/31"}, {"title": "5/26【講座側記】農地工廠收納術（精要版）", "url": "https://www.cet-taiwan.org/story/202305/4403", "date": "2023/05/26"}], "examples": [{"title": "5/26【講座側記】農地工廠收納術（精要版）", "url": "https://www.cet 施運轉歷史及曾發生之重大事件與其影響〉及馬非白，〈核三廠的冤魂──核電政策下的犧牲者〉（製表：地球公民基金會）\u003c/p>", "role": "參考資料", "exampleNote": ""}]}]}, {"id": "editor", "name": "編按", "field": "#body", "exclusive": false, "summary": "編按不是系列類型，它在內文開頭。差在【編按】是獨立一段、加粗、做成小標，還是和整段說明黏在一起。", "official": "範本沒有編按元件。若要保留編按，建議把它從章節標題裡分開，避免占用 h2、h3。", "officialHtml": "", "variants": [{"id": "p-bracket", "name": "獨立一段【編按】", "note": "【編按】單獨一個 p，說明放在後面的段落。編按和正文的段距相同。", "promptHint": "編按使用獨立段落，內容為【編按】三個字。說明從下一個 p 開始，不要和【編按】寫在同一個 p。", "articles": [{"title": "高雄30年城市轉型，犧牲帶消失了嗎？公民力量決定下一步", "url": "https://www.cet-taiwan.org/story/202609/100147", "date": "2026/09/04"}, {"title": "福島核災後15年，日本與台灣核電的抉擇與風險", "url": "https://www.cet-taiwan.org/story/202603/4821", "date": "2026/03/11"}, {"title": "戒嚴時代的核電廠，民主時代如何重新授權？核三再運轉計畫前的三個制度問題：核安、核廢與共識", "url": "https://www.cet-taiwan.org/story/202603/4808", "date": "2026/03/02"}, {"title": "思索於《此岸與彼岸》：撿拾炮彈碎片的環境運動者", "url": "https://www.cet-taiwan.org/story/202601/4785", "date": "2026/01/12"}, {"title": "從1985年的火災，看見核三40年的風險與責任", "url": "https://www.cet-taiwan.org/story/202508/4731", "date": "2025/08/22"}, {"title": "「綠能發展區」引發農地轉用疑慮，光電選址需兼顧國土計畫", "url": "https://www.cet-taiwan.org/story/202309/4362", "date": "2023/09/07"}], "examples": [{"title": "高雄30年城市轉型，犧牲帶消失了嗎？公民力量決定下一步", "url": "https://www.cet-taiwan.org/story/202609/100147", "date": "2026/09/04", "html": "\u003cp>【編按】\u003c/p>\u003cp>高雄，過去依賴重工業作為發展基礎，嫌惡與工業設施北至楠梓、南至小港，圍繞著臨海地區與城市邊緣運作，進而產生許多城市犧牲帶；時至今日，民間聲音對美好生活與發展空間的渴望，迎來半導體產業與城市觀光地景帶來的都市轉型，讓亞洲新灣區、駁二成為如同鑽石的存在，讓此座工業城市逐步走向閃亮的樣貌。\u003c/p>\u003cp>今年7月，地球公民基金會舉辦【鑽石與犧牲帶——高雄三十年城市轉型的華麗背後活動論壇】，由地球公民基金會董事長李根政主持與引言、執行長王敏玲，高雄市野鳥學會總幹事林昆海擔任主講人，邀請國立中山大學社會學系副教授邱花妹擔任與談，而打狗文史再興會社常務理事陳坤毅、台灣森林城市協會理事長莊傑任、台灣濕地保護聯盟理事長康敏捷分享「橋頭新市鎮計畫三期VS.橋頭糖廠」、「洲仔重要濕地-國家級」案例，共同探討高雄工業與城市轉型所面臨的多重挑戰。\u003c/p>", "role": "編按", "exampleNote": ""}, {"title": "思索於《此岸與彼岸》：撿拾炮彈碎片的環境運動者", "url": "https://www.cet-taiwan.org/story/202601/4785", "date": "2026/01/12", "html": "\u003cdiv>【編按】\u003c/div>\u003cp>本文為\u003ca href=\"https://www.cet-taiwan.org/civicrm/contribute/transact?reset=1&amp;id=46\">《此岸與彼岸：一個社會運動者的身心之旅》\u003c/a>書摘，作者為地球公民基金會創辦人李根政，本書記錄他從金門農家子弟、小學美術老師，到落腳南臺灣成為環境運動者的歷程及反思。戰火連天的金門是他成長的根，生機蓬勃的南臺灣是他運動的啟蒙，在「兩岸」間來回思考，養成他獨特的環境視野與運動實踐。「此岸」與「彼岸」，象徵著在金門與臺灣之間，藝術與社會運動之間，運動者志業與日常生活追尋之間，來來回回的多重對話。\u003c/p>", "role": "編按", "exampleNote": ""}, {"title": "戒嚴時代的核電廠，民主時代如何重新授權？核三再運轉計畫前的三個制度問題：核安、核廢與共識", "url": "https://www.cet-taiwan.org/story/202603/4808", "date": "2026/03/02", "html": "\u003cp>【編按】\u003c/p>\u003cp>目前政府表示，核電重啟須以「核安無虞」、「核廢有解」及「社會共識」三原則為前提。然而，這三項原則若缺乏具體標準與制度條件，便難以成為可被檢驗的公共承諾。核電是否重啟，以及在什麼條件下重啟，不僅是行政機關的判斷，也涉及公民社會對風險承擔、制度責任與民主程序的共同理解。本文以公民視角出發，具體檢視在現階段的三原則之下，仍有哪些制度與民主條件需要補足。三原則若要成立，需要政府與社會之間更充分的對話與共同建構，使核電重啟的前提進一步在民主程序中被共同確認。\u003c/p>", "role": "編按", "exampleNote": ""}]}, {"id": "strong", "name": "p 裡的 strong【編按】", "note": "【編按】加粗，仍獨立成一段，說明在後面的 p。和上一種的差別主要是粗體。", "promptHint": "【編按】放在獨立的 p 裡，並用 strong。說明從下一個 p 開始。", "articles": [{"title": "黑熊成了鄰居，我們準備好了嗎？", "url": "https://www.cet-taiwan.org/story/202601/4788", "date": "2026/01/16"}, {"title": "身為 NGO 社群編輯：當理想未盡時，我怎麼做群眾溝通？相信世界會更好？", "url": "https://www.cet-taiwan.org/story/202508/4733", "date": "2025/08/25"}, {"title": "從半屏山野望護國神山(三)：高雄科技產業的黎明之光，在後勁探照過去", "url": "https://www.cet-taiwan.org/story/202411/4564", "date": "2024/11/14"}, {"title": "從半屏山野望護國神山(二)：日落太陽升，經濟奇蹟下的「黑」幕", "url": "https://www.cet-taiwan.org/story/202411/4563", "date": "2024/11/14"}, {"title": "從半屏山野望護國神山(一)：太陽旗下的護國工業", "url": "https://www.cet-taiwan.org/story/202411/4562", "date": "2024/11/14"}], "examples": [{"title": "從半屏山野望護國神山(三)：高雄科技產業的黎明之光，在後勁探照過去", "url": "https://www.cet-taiwan.org/story/202411/4564", "date": "2024/11/14", "html": "\u003cp>\u003cstrong>【編按】\u003c/strong>\u003c/p>\u003cp dir=\"ltr\">台灣積體電路製造公司（以下簡稱台積電）第一座高雄廠即將完工，預計今年（2024）年底進行設備裝機。但繼8月底在整地時挖掘到日治時期美軍空襲的未爆彈，\u003ca href=\"https://www.cna.com.tw/news/asoc/202411110056.aspx\">11月又發現一顆生鏽未爆彈\u003c/a>。台積電高雄廠現址前身是「中油高雄煉油廠」，但在日治時期，這塊地是什麼用途？為何是美軍轟炸焦點？恐怕鮮少人知道。\u003c/p>\u003cp dir=\"ltr\">「從半屏山野望護國神山」此文，嘗試回溯從日治時期高雄的軍事戰略定位，國府治台以來的經濟布局，加上\u003ca href=\"https://zh.wikipedia.org/zh-tw/%E5%8F%8D%E4%BA%94%E8%BC%95%E9%81%8B%E5%8B%95\">後勁反五輕\u003c/a>，到目前的台積電設廠觸及的高雄城市轉型課題，以歷史回望視角，讓我們一起來思考什麼是城市的永續發展？\u003c/p>", "role": "編按", "exampleNote": ""}, {"title": "身為 NGO 社群編輯：當理想未盡時，我怎麼做群眾溝通？相信世界會更好？", "url": "https://www.cet-taiwan.org/story/202508/4733", "date": "2025/08/25", "html": "\u003cp>\u003cstrong>編按：\u003c/strong>本文由李宇恩撰寫，原文刊載於地球公民基金會，本篇為精簡過後的版本。\u003c/p>\u003cp>李宇恩是地球公民基金會的社群媒體編輯，負責組織的「農地違章工廠倡議」社群行銷，擁有豐富的社群溝通經驗。在這篇文章裡，他透過自己的真實經驗，細緻的與讀者分享做為社群編輯，在議題倡議上的角色和心法。\u003c/p>\u003cp>包括，當倡議未能達成目標的時候、面對群眾失落的時候，在社群上可以做什麼？他也分享社群溝通心法，帶讀者一起思考怎麼將困難的資訊，轉化為群眾理解的事情？作者期待讓組織社群編輯們能夠互相學習和交流，也希望讓關心不同公共議題的工作者、民眾，都能在挫敗和艱難中不放棄希望。\u003c/p>", "role": "編按", "exampleNote": ""}, {"title": "黑熊成了鄰居，我們準備好了嗎？", "url": "https://www.cet-taiwan.org/story/202601/4788", "date": "2026/01/16", "html": "\u003cp>\u003cstrong>編按\u003c/strong>\u003c/p>\u003cp>近期新聞接連報導，從嘉義阿里山的達觀部落到花蓮卓溪的山里部落，台灣黑熊的身影不再僅限於遙遠的山林傳說，而是不請自來，真實地闖入工寮、在養禽場內翻找雞隻、覓食。這篇文章從野放個體「阿里曼．西肯」的長征軌跡與「衝突熊」標籤的形成，到日本的「熊出沒」管理方式，帶領讀者探尋：在恐懼與浪漫的想像之外，我們該如何放下身段、走進部落的文化脈絡，在信任與尊重的地基上，重構一套屬於台灣的人熊共處方案。\u003c/p>", "role": "編按", "exampleNote": ""}]}, {"id": "heading", "name": "用 h2 或 h3 寫編按", "note": "編按被當成小標。層級會跟文章其他 h2、h3 排在一起。", "promptHint": "編按使用 h2 或 h3，說明放在後面的段落。", "articles": [{"title": "台灣如何從「與河爭地」走向「還地於河」？ 極端氣候下，從水泥工程、自然解方到馬太鞍溪的「還地於河」難題", "url": "https://www.cet-taiwan.org/story/202608/4891", "date": "2026/08/14"}, {"title": "【以農為本的綠能三】「農業、光電並非一拍即合」學者籲給農電更多磨合時間", "url": "https://www.cet-taiwan.org/story/202408/4538", "date": "2024/08/12"}, {"title": "【以農為本的綠能二】 關鍵都在細節裡——農業綠能需要新的開發管理機制", "url": "https://www.cet-taiwan.org/story/202408/4537", "date": "2024/08/12"}, {"title": "光電選址與生態衝突，過往經驗與各部會未來責任", "url": "https://www.cet-taiwan.org/story/202311/4409", "date": "2023/11/30"}], "examples": [{"title": "【以農為本的綠能三】「農業、光電並非一拍即合」學者籲給農電更多磨合時間", "url": "https://www.cet-taiwan.org/story/202408/4538", "date": "2024/08/12", "html": "\u003ch3>編按\u003c/h3>\u003cblockquote>\u003cp>為銜接國土計畫體系並說明未來光電發展政策，能源署於8月6日公告「\u003ca href=\"https://www.moeaea.gov.tw/ecw/populace/news/Board.aspx?kind=3&amp;menu_id=57&amp;news_id=33833\">能源用地白皮書（光電篇）1.0\u003c/a>」，點出光電政策與農業政策尚需整合。政府自2016年開始推動再生能源至今，農業綠能因為政策欠缺足夠的社會溝通，導致與農爭地、排擠糧食生產爭議不斷。\u003c/p> \u003cp>為突破糧食自給率與能源自給率低落的困境，主婦聯盟環境保護基金會、台灣主婦聯盟生活消費合作社、地球公民基金會於今年6/21舉辦「農業綠能總體檢—如何發展以農為本的能源轉型論壇」，邀請了農業部、經濟部、內政部一同對話，以糧食生產、農業為主體的角度出發，探討綠能如何成為農業的助力，讓以農為本的農業綠能真正落地。\u003c/p> \u003cp>本系列報導延續論壇「以農為本的綠能」論述，期待有助於社會進一步討論能源、農業與土地的課題。\u003c/p> \u003c/blockquote>", "role": "編按", "exampleNote": ""}, {"title": "光電選址與生態衝突，過往經驗與各部會未來責任", "url": "https://www.cet-taiwan.org/story/202311/4409", "date": "2023/11/30", "html": "\u003ch2>\u003cspan>【編按】\u003c/span>\u003c/h2>\u003cp>地球公民基金會於2023年8月24日舉辦「地面光電發展需要的生態資訊與保育機制--共享日光」系列座談之二，我們邀請專家學者與主管機關，針對再生發展能源的重大課題 — 光電與生態衝突進行討論。\u003c/p>\u003cp>主管農地與生態保育業務的農業部該如何扛起相關業務？農業部過去多在農地變更或容許審查時發揮把關功能，但未來如何調解光電發展與生態環境的衝突，當前的機制還不夠完備；此外，如何辨識生態課題，相關圖資與基礎資訊仍需要更多資源投入整合研究；而能源署雖然有「環境與社會檢核」的經驗，但如何將相關機制應用於農地的環境有待討論。期待政府機關能夠與學術界、民間一同合作，整合相關的生態調查資訊與發展研究計畫，讓光電選址迴避生態敏感區域，也讓爭議發生時，有科學數據與資訊能夠成為不同觀點的人對話的基礎。\u003c/p>", "role": "編按", "exampleNote": ""}, {"title": "台灣如何從「與河爭地」走向「還地於河」？ 極端氣候下，從水泥工程、自然解方到馬太鞍溪的「還地於河」難題", "url": "https://www.cet-taiwan.org/story/202608/4891", "date": "2026/08/14", "html": "\u003ch3>【編按】\u003c/h3>\u003cp>由超過10個環保團體攜手發起的「台灣氣候行動週」，在6月20日至7月5日間串聯全台7縣市舉辦超過20場跨界活動，討論能源轉型、氣候調適與青年未來等議題，其中地球公民基金會與台灣河溪網協會舉辦「氣候變遷調適：災害治理自然解方 (NbS) 的實踐與思辨」論壇，分享「自然解方 (NbS)」理念帶領民眾重新思考災害治理。\u003c/p>\u003cp>當千億治水與水泥工程在極端氣候下逐漸失靈，台灣的災害治理正迎來從「與河爭地」到「還地於河」的典範轉移。本文由學者、民間團體研究員引言帶領讀者深入思辨國際倡議的「自然解方（NbS）」反思如何跳脫水泥工程有所極限的治水輪迴 。並正視花蓮馬太鞍溪最真實的治理困局——當治水學理碰上錯綜複雜的原住民保留地歷史創傷時，「還地於河」的挑戰往往不在自然，而在人與制度。這絕非單純的防洪工程，而是一場修補社會裂痕、重新學習如何與河流共同安身立命的浩大社會溝通。\u003c/p>", "role": "編按", "exampleNote": ""}]}, {"id": "inline", "name": "整段編按包在同一個標籤", "note": "【編按】和整段說明在同一個 em、p 或 div，中間沒有拆開。", "promptHint": "【編按】和整段說明寫在同一個標籤裡。", "articles": [{"title": "新材料循環產業園區會讓高雄大林蒲雪上加霜嗎？", "url": "https://www.cet-taiwan.org/story/202604/4831", "date": "2026/04/13"}, {"title": "土地會說話，植物有靈魂：看見原住民族的山林哲學 《有靈 • 原民植物智慧》講座談起", "url": "https://www.cet-taiwan.org/story/202508/4736", "date": "2025/08/29"}], "examples": [{"title": "新材料循環產業園區會讓高雄大林蒲雪上加霜嗎？", "url": "https://www.cet-taiwan.org/story/202604/4831", "date": "2026/04/13", "html": "\u003cem>【編按】長年受到重工業包圍的大林蒲社區，4月3日下午又發生嚴重工安事故，鄰近的居民處境堪憂。儘管2016年政府曾向居民道歉並承諾遷村，10年過去了，目前居民還住在那裏，而「新材料循環產業園區」的開發案環評進行中，未來進駐的會不會又是高污染、高碳排產業? 在高雄淨零及產業轉型願景下，300公頃的園區開發能否符合循環經濟原則並走向綠色經濟，需要社會更多關注。\u003c/em>", "role": "編按", "exampleNote": ""}, {"title": "土地會說話，植物有靈魂：看見原住民族的山林哲學 《有靈 • 原民植物智慧》講座談起", "url": "https://www.cet-taiwan.org/story/202508/4736", "date": "2025/08/29", "html": "\u003cp>編按：地球公民基金會於 7 月 15 日舉辦「《有靈．原民植物智慧》— 從森林到部落的文化探索」講座，帶領群眾從原住民族神話、飲食與禁忌中，一窺別具一格的森林哲學。透過講者鄭漢文校長在部落教學的經驗，讓人體會生物多樣性如何深植於日常生活與教育現場之中期望透過在地社區的真實經驗，讓大眾理解森林保育的多元面向，從原住民族的世界觀出發，看見知識的來源並非單一，而是交織於文化、土地與生命之間，展現出更多元且深層的觀點。\u003c/p>", "role": "編按", "exampleNote": ""}]}]}, {"id": "caption", "name": "圖片與圖說", "field": "#body", "exclusive": false, "summary": "圖說最常見的兩種是：br 後面接 span，以及圖片旁邊沒有圖說。另一批是 span 直接接在圖後面，或 br 後面接一般文字。figure 很少。預覽會把圖片高度改成自動，避免原稿 height=\"100%\" 把版面撐壞；圖和圖說的標籤關係仍是原稿。", "official": "範本用「圖說：」文字放在圖片下方，並提醒文繞圖不要黏住段落。範本沒有使用 figcaption。", "officialHtml": "", "variants": [{"id": "br", "name": "圖在 p 裡，br 之後寫圖說", "note": "圖片和圖說在同一個 p，中間一個 br。圖說是一般文字，不是 span。這是有圖文章裡最多的寫法。", "promptHint": "圖片與圖說放在同一個 p：img 後面加 br，再寫圖說。圖說不要另開一個 p。", "articles": [{"title": "看懂馬太鞍溪｜復原沒有同一個時鐘", "url": "https://www.cet-taiwan.org/story/202608/4892", "date": "2026/08/14"}, {"title": "看懂馬太鞍溪｜面對堰塞湖，我們如何從災民變回公民", "url": "https://www.cet-taiwan.org/story/202607/4874", "date": "2026/07/22"}, {"title": "走進森林的霧裡，看見台灣山林的多重歷史 | 高雄場《變更之地》Ｘ《複層之森》映後座談", "url": "https://www.cet-taiwan.org/story/202607/4873", "date": "2026/07/20"}, {"title": "思索於《此岸與彼岸》：撿拾炮彈碎片的環境運動者", "url": "https://www.cet-taiwan.org/story/202601/4785", "date": "2026/01/12"}, {"title": "大停電與核能神話：西班牙經驗給台灣的能源抉擇啟示", "url": "https://www.cet-taiwan.org/story/202508/4730", "date": "2025/08/19"}, {"title": "忽視地方需求、草率送審環評的土地炒作遊戲——都蘭ATT渡假村開發 : "https://www.cet-taiwan.org/story/202407/4527", "date": "2024/07/18", "html": "\u003ctable> \u003ctbody> \u003ctr> \u003cth>註一｜\u003c/th> \u003ctd>台灣每年二氧化碳的移除量2,185萬公噸乃是採用\u003ca href=\"https://www.cca.gov.tw/information-service/publications/national-ghg-inventory-report/1851.html\">《2023年國家溫室氣體排放清冊報告》\u003c/a>中2021年的數據，森林碳匯的計算方法仍有許多修正空間與缺口，並不能完全代表台灣自然碳匯移除二氧化碳之量體。但無論如何，台灣目前人為溫室氣體排放量，遠遠大於自然可以吸收的量，是無庸置疑的事實。\u003c/td> \u003c/tr> \u003ctr> \u003cth>註二｜\u003c/th> \u003ctd>根據環境部氣候變遷署事業溫室氣體排放平台2021年碳盤查登錄資料，台灣積體電路公司年碳排放(範疇一及範疇二合計)約為10.12MtCO2e(占全台3.4%)，台塑集團旗下台塑石化、台塑工業、台化及南亞公司共計約50.07MtCO2e(占全台16.9%)，中國鋼鐵公司則約為22.33 MtCO2e(占全台7.5%)，共計貢獻全台27.8%的碳排放。\u003c/td> \u003c/tr> \u003ctr> \u003cth>註三｜\u003c/th> \u003ctd>\u003ca href=\"https://pr.tsmc.com/chinese/news/2801\">台積公司啟動植樹薪傳計畫 攜手桃園、新竹、台中、台南四地市政府共同推動都市與社區綠化。\u003c/a>台灣積體電路製造股份有限公司，2021/03/12。\u003c/td> \u003c/tr> \u003ctr> \u003cth>註四｜\u003c/th> \u003ctd>李根政，2021。\u003ca href=\"https://www.twreporter.org/a/opinion-taipei-biennial-afforestation-dispute\">〈北美館碳中和展覽走味的美意：大崙尾山伐木造林，為何爭議？〉\u003c/a>\u003c/td> \u003c/tr> \u003ctr> \u003cth>註五｜\u003c/th> \u003ctd>\u003ca href=\"https://www.agriharvest.tw/archives/114554\">〈\u003c/a>\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>", "role": "表格", "exampleNote": ""}]}, {"id": "no-th", "name": "沒有 th", "note": "整張表都是 td。畫面上可能仍有框線，但表頭沒有表頭語意。有的還在編輯器設了 border=0、1 或 2。", "promptHint": "表格全部使用 td，不設 th。框線沿用編輯器現況，不要另外改成另一種表頭結構。", "articles": [{"title": "731高雄石化氣爆十二年：高雄工業管線遷改，如何增進公共安全與社區知情權？", "url": "https://www.cet-taiwan.org/story/202607/4878", "date": "2026/07/31"}, {"title": "新材料循環產業園區會讓高雄大林蒲雪上加霜嗎？", "url": "https://www.cet-taiwan.org/story/202604/4831", "date": "2026/04/13"}, {"title": "身為 NGO 社群編輯：當理想未盡時，我怎麼做群眾溝通？相信世界會更好？", "url": "https://www.cet-taiwan.org/story/202508/4733", "date": "2025/08/25"}, {"title": "從1985年的火災，看見核三40年的風險與責任", "url": "https://www.cet-taiwan.org/story/202508/4731", "date": "2025/08/22"}, {"title": "大停電與核能神話：西班牙經驗給台灣的能源抉擇啟示", "url": "https://www.cet-taiwan.org/sto ode/1458\">大林蒲求生記-污染大事記\u003c/a>\u003cbr/> 註三：\u003ca href=\"https://e-info.org.tw/node/201295\">政府對不起大林蒲！…", "role": "分隔線", "exampleNote": ""}, {"title": "福島核災後15年，日本與台灣核電的抉擇與風險", "url": "https://www.cet-taiwan.org/story/202603/4821", "date": "2026/03/11", "html": "\u003cp>在福島核災15週年之際，屏東縣屏北區社區大學、社團法人屏東縣愛鄉協會、地球公民基金會舉辦「福島核災後15年，日本與台灣核電的抉擇與風險—核三再運轉申請前的地方對話」講座，邀請屏東大學社會發展學系副教授林育諄主持，並由研究日本與台灣反核運動的日本一橋大學社會學博士陳威志、地球公民基金會董事長李根政與在地居民對話，從日本災後現況出發，討論屏東的在地議題，並… \u003chr> \u003ch3>從福島到今天——核災如何改變日本社會與核電政策\u003c/h3>", "role": "分隔線", "exampleNote": ""}]}, {"id": "credit", "name": "hr 後面是出處或轉載", "note": "線後面是「本文為……投書」這類出處。", "promptHint": "轉載或出處放在文末，前面加一條 hr。", "articles": [{"title": "高雄30年城市轉型，犧牲帶消失了嗎？公民力量決定下一步", "url": "https://www.cet-taiwan.org/story/202609/100147", "date": "2026/09/04"}, {"title": "持續改善空污，毋須核電作解方", "url": "https://www.cet-taiwan.org/story/202508/4726", "date": "2025/08/07"}, {"title": "農地治理新藍圖：從國土計畫到農政資源的永續規劃", "url": "https://www.cet-taiwan.org/story/202412/4581", "date": "2024/12/26"}, {"title": "創造森林與碳匯的多重紅利", "url": "https://www.cet-taiwan.org/story/202407/4527", "date": "2024/07/18"}, {"title": "摸索台灣山林保育與產業衝突的調解路徑：安朔殼斗科森林的危機與解方", "url": "https://www.cet-taiwan.org/story/202405/4496", "date": "2024/05/27"}, {"title": "礦業修法成敗就看經濟部、環保署和原民會的作為", "url": "https://www.cet-taiwan.org/story/202212/4230", "date": "2022/12/26"}, {"title": "違章工廠門神賣田求榮，民進黨勿棄守23萬公頃優良農地", "url": "https://www.cet-taiwan.org/story/202202/4102", "date": "2022/02/25"}, {"title": "三接遷離大潭藻礁公投，地球公民基金會的觀點和建議", "url": "https://www.cet-taiwan.org/story/202111/4062", "date": "2021/11/29"}, {"title": "核電不是綠電！破除政治謠言，台灣能源轉型之路不能等", "url": "https://www.cet-taiwan.org/story/202111/4052", "date": "2021/11/18"}, {"title": "露營場不應無條件合法，應制定彈性且因地制宜的管理辦法", "url": "https://www.cet-taiwan.org/story/202106/3975", "date": "2021/06/28"}, {"title": "國土計畫下，山還能被挖成一座魚池嗎?", "url": "https://www.cet-taiwan.org/story/202105/3951", "date": "2021/05/04"}, {"title": "農地違章工廠續命仙丹如何架空國土計畫？", "url": "https://www.cet-taiwan.org/sto 市轉型與公民參與開展熱烈討論，包含橋頭糖廠等文化遺產是否仿效公園管理，納入民間組織參與治理、公民如何凝聚更多力量表達意見？如何展現民間力量的動能?在在展現高雄民間力量對於城市轉型的積極參與及熱切關注。\u003c/p>…", "role": "引言", "exampleNote": ""}, {"title": "台灣如何從「與河爭地」走向「還地於河」？ 極端氣候下，從水泥工程、自然解方到馬太鞍溪的「還地於河」難題", "url": "https://www.cet-taiwan.org/story/202608/4891", "date": "2026/08/14", "html": "\u003cblockquote>\u003ch3>【編按】\u003c/h3> \u003cp>由超過10個環保團體攜手發起的「台灣氣候行動週」，在6月20日至7月5日間串聯全台7縣市舉辦超過20場跨界活動，討論能源轉型、氣候調適與青年未來等議題，其中地球公民基金會與台灣河溪網協會舉辦「氣候變遷調適：災害治理自然解方 (NbS) 的實踐與思辨」論壇，分享「自然解方 (NbS)」理念帶領民眾重新思考災害治理。\u003c/p> \u003cp>當千億治水與水泥工程在極端氣候下逐漸失靈，台灣的災害治理正迎來從「與河爭地」到「還地於河」的典範轉移。本文由學者、民間團體研究員引言帶領讀者深入思辨國際倡議的「自然解方（NbS）」反思如何跳脫水泥工程有所極限的治水輪迴 。並正視花蓮馬太鞍溪最真實的治理困局——當治水學理碰上錯綜複雜的原住民保留地歷史創傷時，「還地於河」的挑戰往往不在自然，而在人與制度。這絕非單純的防洪工程，而是一場修補社會裂痕、重新學習如何與河流共同安身立命的浩大社會溝通。\u003c/p> \u003c/blockquote>", "role": "引言", "exampleNote": ""}, {"title": "黑熊成了鄰居，我們準備好了嗎？", "url": "https://www.cet-taiwan.org/story/202601/4788", "date": "2026/01/16", "html": "\u003cblockquote>\u003cp>\u003cstrong>編按\u003c/strong>\u003c/p> \u003cp>近期新聞接連報導，從嘉義阿里山的達觀部落到花蓮卓溪的山里部落，台灣黑熊的身影不再僅限於遙遠的山林傳說，而是不請自來，真實地闖入工寮、在養禽場內翻找雞隻、覓食。這篇文章從野放個體「阿里曼．西肯」的長征軌跡與「衝突熊」標籤的形成，到日本的「熊出沒」管理方式，帶領讀者探尋：在恐懼與浪漫的想像之外，我們該如何放下身段、走進部落的文化脈絡，在信任與尊重的地基上，重構一套屬於台灣的人熊共處方案。\u003c/p> \u003c/blockquote>", "role": "引言", "exampleNote": ""}]}, {"id": "none", "name": "沒有引言框", "note": "這篇沒有 blockquote。", "promptHint": "一般段落不要改包 blockquote。", "articles": [{"title": "看懂馬太鞍溪｜復原沒有同一個時鐘", "url": "https://www.cet-taiwan.org/story/202608/4892", "date": "2026/08/14"}, {"title": "【講座側記】當太魯閣不只是風景：沿著遷徙記憶，尋找回家的路｜裂縫中的尋路 ：太魯閣族的遷徙記憶與家的山林", "url": "https://www.cet-taiwan.org/story/202608/4889", "date": "2026/08/10"}, {"title": "731高雄石化氣爆十二年：高雄工業管線遷改，如何增進公共安全與社區知情權？", "url": "https://www.cet-taiwan.org/story/202607/4878", "date": "2026/07/31"}, {"title": "農地上的違章工廠，如何從末端圍堵走向制度治理——地球公民十年的倡議啟示", "url": "https://www.cet-taiwan.org/story/202607/4881", "date": "2026/07/29"}, {"title": "看懂馬太鞍溪｜紊亂中，如何成為地方的眼睛", "url": "https://www.cet-taiwan.org/story/202607/4879", "date": "2026/07/28"}, {"title": "看懂 \u003c/a>〉\u003c/p>", "role": "底線", "exampleNote": ""}, {"title": "藍綠立委停止踐踏國土秩序 國土計畫不該因少數3縣市延宕上路", "url": "https://www.cet-taiwan.org/story/202412/4582", "date": "2024/12/31", "html": "\u003cp>\u003cu>環境權保障基金會研究員\u003cstrong>湯琳翔\u003c/strong>\u003c/u>強調，《國土計畫法》的土地使用管制原則，明確規範保障既有合法權利及允許土地使用。各界關注的農舍議題，只要屬《區域計畫法》中的農牧用地、養殖用地及鹽業用地等，未來仍可依《農業發展條例》申請興建農舍。而這次最重要的調整在於取消個案變更機制，但這才是《國土計畫法》重點中的重點。換言之，《國土計畫法》全面上路後，並不影響農地的買賣、移轉、變更及使用，只是讓超級企業跟特權無法隨意變更土地炒地皮。\u003c/p>", "role": "底線", "exampleNote": ""}]}, {"id": "long", "name": "底線畫整句", "note": "一整句話放在 u 裡。", "promptHint": "不要把整句加底線。", "articles": [{"title": "農地治理新藍圖：從國土計畫到農政資源的永續規劃", "url": "https://www.cet-taiwan.org/story/202412/4581", "date": "2024/12/26"}, {"title": "光電先蓋小屋頂，太陽能躉購費率6元起--小市民要發電—全民能源參與之路", "url": "https://www.cet-taiwan.org/story/202311/4393", "date": "2023/11/13"}], "examples": [{"title": "農地治理新藍圖：從國土計畫到農政資源的永續規劃", "url": "https://www.cet-taiwan.org/story/202412/4581", "date": "2024/12/26", "html": "\u003cp>臺灣國土長期以來分為受《都市計畫法》所管的「都市土地」及現依《區域計畫法》所管的「非都市土地」。「都市土地」從日治時期就有市區改正、《臺灣都市計畫令》，並持續沿用至1964年公布《都市計畫法》，用以改善居民生活環境、促進\u003cu>有計畫的\u003c/u>均衡發展。而佔全國土地8成的「非都市土地」則缺乏完善法制基礎的管理，並在戰後「以農養工」發展基調下，導致農業/農地成了產業發展結構下「被榨取的資源」外，亦使農工爭地情況加劇、農地快速流失且難以恢復。\u003c/p>", "role": "底線", "exampleNote": ""}, {"title": "光電先蓋小屋頂，太陽能躉購費率6元起--小市民要發電—全民能源參與之路", "url": "https://www.cet-taiwan.org/story/202311/4393", "date": "2023/11/13", "html": "\u003cp>\u003cu>\u003cstrong>地球公民基金會專員鄭泰鈞\u003c/strong>\u003c/u>表示，日前再生能源發展條例第12-1條的子法草案，雖預計1,000平方公尺以上的新建、增建、改建建物，需強制加裝一定比例的太陽光電，然而根據內政部近五年核發使照的資料，1,000平方公尺以上的建物僅佔全國建物總數約6%，300平方公尺以下（約90坪）等家戶型建物卻佔約82%，為因應未來屋頂光電的趨勢，避免地面光電爭議，政府應多費心思，尤其在8成民意支持能源轉型的前提下，更該重視小型屋頂向民間普及再生能源的機會。\u003c/p>", "role": "底線", "exampleNote": ""}]}, {"id": "none", "name": "沒有底線", "note": "內文沒有 u。", "promptHint": "強調改用既定的小標或 strong，不要加底線。", "articles": [{"title": "看懂馬太鞍溪｜復原沒有同一個時鐘", "url": "https://www.cet-taiwan.org/story/202608/4892", "date": "2026/08/14"}, {"title": "台灣如何從「與河爭地」走向「還地於河」？ 極端氣候下，從水泥工程、自然解方到馬太鞍溪的「還地於河」難題", "url": "https://w te": "2024/05/27"}, {"title": "9微克，護健康！環境部應加嚴空氣品質標準、修改AQI", "url": "https://www.cet-taiwan.org/news/202405/4495", "date": "2024/05/23"}, {"title": "法規漏洞財團鑽，環評失靈沒把關", "url": "https://www.cet-taiwan.org/news/202405/4488", "date": "2024/05/16"}, {"title": "【聯合聲明】碳費二折大拍賣，企業無憂爽爽排", "url": "https://www.cet-taiwan.org/news/202404/4483", "date": "2024/04/30"}, {"title": "記取明揚大火悲劇，隱匿危物應納刑責", "url": "https://www.cet-taiwan.org/news/202404/4481", "date": "2024/04/23"}, {"title": "政治操作別過頭，危險核電不可取-427上街反對核電延役", "url": "https://www.cet-taiwan.org/news/202404/4480", "date": "2024/04/23"}, {"title": "【聯合聲明】碳費訂定不延宕，減碳決心才夠強", "url": "https://www.cet-taiwan.org/news/202404/4479", "date": "2024/04/22"}, {"title": "老舊環評當令箭，殭屍開發炒土地，寶盛財團滾出去", "url": "https://www.cet-taiwan.org/news/202404/4465", "date": "2024/04/15"}, {"title": "滿地富地方說明會如同走形式 關鍵問題毫無回應", "url": "https://www.cet-taiwan.org/news/202404/4464", "date": "2024/04/15"}, {"title": "國土計畫的困境，一延再延不是解方", "url": "https://www.cet-taiwan.org/news/202403/4455", "date": "2024/03/29"}, {"title": "斷層核廢不處理，核三延役沒道理--正視核安，停止惡鬥", "url": "https://www.cet-taiwan.org/news/202403/4454", "date": "2024/03/28"}, {"title": "因應氣候緊急，電價應合理調整，強化配套措施降低民生衝擊", "url": "https://www.cet-taiwan.org/news/202403/4452", "date": "2024/03/21"}, {"title": "核電除役不可逆、新北市民才平安", "url": "https://www.cet-taiwan.org/news/202403/4451", "date": "2024/03/19"}], "examples": [{"title": "核三再運轉計畫審查完成不等於安全無虞　 34團體籲擴大專業、公開資訊、落實民主參與", "url": "https://www.cet-taiwan.org/news/202609/100176", "date": "2026/09/29", "html": "\u003cp>\u003cimg alt=\"20260929-000.jpg\" height=\"100%\" loading=\"lazy\" src=\"https://www.cet-taiwan.org/sites/default/files/u355/20260929-000.jpg\" width=\"100%\"/> \u003cspan>核三廠兩座反應爐位於恆春半島，與周邊聚落及生活地景相鄰。（圖／地球公民基金會）\u003c/span>\u003c/p>\u003cp>核能安全委員會於2026年9月24日公布核三再運轉計畫審查完成。從核三所在地恆春、屏東、高雄一路到台北，共34個民間團體、工會、企業及民意代表服務處共同發表聲明，強調核三是否重啟不只是核工技術問題，後續審查與決策必須納入地質、氣候、複合式災害等跨領域專業，也應讓可能承擔事故風險地區的居民實質參與。全國廢核行動平台另針對核安會的資訊發布方式提出質疑，指出核安會選在9/24四天連假前夕晚間18時19分發布消息，難免引發閃避新聞與社會監督的疑慮，應公開說明。\u003c/p>\u003cp>核三廠再運轉計畫審查完成後，台電將據此展開後續人員訓練與補充、設備檢查測試，並針對核三廠重要結構、系統與組件進行自主安全檢查；另須辦理整體老化評估、老化管理計畫、時限老化分析、輻射相關議題查核、耐震安全評估，以及終期安全分析報告與運轉技術規範增修等技術工作。\u003c/p>", "role": "", "exampleNote": ""}, {"title": "廢核平台成立公投反方辦事處　電視辯論破解核電謠言", "url": "https://www.cet-taiwan.org/news/202609/100175", "date": "2026/09/24", "html": "\u003cp>\u003cimg alt=\"20260924-002_0.webp\" height=\"100%\" loading=\"lazy\" src=\"https://www.cet-taiwan.org/sites/default/files/u355/20260924-002_0.webp\" width=\"100%\"/> \u003cspan>全國廢核行動平台於「不實核電謠言」布條打上紅色叉叉，宣示將參與公投電視辯論迎戰謠言。（圖／地球公民基金會）\u003c/span>\u003c/p>\u003cp>立法院在野黨在 8 年內發動第 4 次核能公投，即第 22 號公投：「你是否支持政府使用『核電』振興經濟，以廢除『非核家園』的能源政策？」以「核電振興經濟」等空洞口號操作選戰，將能源議題再次拉入政治對決的泥淖。全國廢核行動平台今宣布將成立第 22 號公投之「反方辦事處」，力拚於 9 月 30 日前募得 1,200 份連署書，推派專業代表站上電視辯論台正面迎戰不實的核電謠言，並回應近期在野黨陣營不實的核電言論，防堵錯誤資訊誤導大眾。\u003c/p>\u003cp>記者會上，全國廢核行動平台於「不實核電謠言」的布條上打上巨大的紅色叉叉，宣示將參與公投電視辯論迎戰謠言，以嚴謹的事實查核與科學數據守護台灣能源未來的決心，邀請全國人民參與「反方辦事處」連署支持。\u003c/p>", "role": "", "exampleNote": ""}, {"title": "落實三零「零排放、零廢棄、零事故」，新材料循環產業園區應建立工業新典範", "url": "https://www.cet-taiwan.org/news/202609/100174", "date": "2026/09/24", "html": "\u003cp>\u003cimg alt=\"20260924-001_0.webp\" height=\"100%\" loading=\"lazy\" src=\"https://www.cet-taiwan.org/sites/default/files/u355/20260924-002.webp\" width=\"100%\"/>\u003cspan>大林蒲社區被煙囪包圍，承受鄰近工業區長年帶來的環境污染。（圖／地球公民基金會）\u003c/span>\u003c/p>\u003cp>今日（9月23日）環境部召開環境影響評估審查委員會第55次會議，審查「新材料循環產業園區」開發案，本園區近260公頃，開發所在地大林蒲（沿海六里社區--鳳源里、鳳興里、鳳林里、鳳森里、龍鳳里、鳳鳴里）。地球公民基金會呼籲，既然本園區從一開始就標榜循環經濟，便應該秉持「零排放、零廢棄、零事故」原則，建立循環園區的工業新典範，嚴格篩選、審查園區進駐之產業與廠商，周全規劃廠區物質流的循環，讓污染、碳排、廢棄物等降至最低，並有充分的資訊揭露及社會參與，如此，才符合高雄市政府早先的承諾，同時不枉大林蒲居民的犧牲。\u003c/p>\u003cp>\u003cimg alt=\"20260924-001_0.webp\" height=\"100%\" loading=\"lazy\" src=\"https://www.cet-taiwan.org/sites/default/files/u355/20260924-004.webp\" width=\"100%\"/>\u003cspan>高雄小港大林蒲聚落周邊示意圖。（圖／地球公民基金會）\u003c/span>\u003c/p>", "role": "", "exampleNote": ""}]}, {"id": "empty", "name": "用空白 p 拉開間距", "note": "空段落會多出一塊間距，貼到別的編輯器時常變成多餘空行。", "promptHint": "段落之間插入空白 p 來增加間距。", "articles": [{"title": "全球淨零交作業 台灣三項不及格─台灣NDC3.0民間檢核記者會", "url": "https://www.cet-taiwan.org/news/202509/4744", "date": "2025/09/09"}, {"title": "反對重啟核電 全國廢核行動平台送交連署書--呼籲經濟部長審慎回應勿背離非核政策", "url": "https://www.cet-taiwan.org/news/202505/4669", "date": "2025/05/16"}, {"title": "「反對核電重啟，拒絕草率修法」晚會", "url": "https://www.cet-taiwan.org/news/202505/4642", "date": "2025/05/13"}, {"title": "民團嚴正抗議立委不應草率修法讓核電延役--國民黨放水核安、核災風險由全民承擔？", "url": "https://www.cet-taiwan.org/news/202504/4619", "date": "2025/04/01"}, {"title": "電價合理調整，能源轉型才走得遠", "url": "https://www.cet-taiwan.org/news/202503/4618", "date": "2025/03/28"}, {"title": "節能減碳不該成為政治鬥爭犧牲品！抗議國民黨提案刪除家電節能補助與屋頂光電補助、損害全民利益", "url": "https://www.cet-taiwan.org/news/202501/4600", "date": "2025/01/17"}, {"title": "碳費不比茶葉蛋，環保團體強烈遺憾！優惠費率寵壞排碳巨嬰", "url": "https://www.cet-taiwan.org/news/202410/4553", "date": "2024/10/07"}, {"title": "空品標準加嚴不到位 全民呼吸好空氣再拖四年", "url": "https://www.cet-taiwan.org/news/202407/4529", "date": "2024/07/23"}, {"title": "國民黨應撤回延役草案 優先面對核廢處置", "url": "https://www.cet-taiwan.org/news/202407/4521", "date": "2024/07/10"}, {"title": "呼籲農業部開啟社會對話，建立以農民為主體的農業綠能", "url": "https://www.cet-taiwan.org/news/202406/4533", "date": "2024/06/21"}, {"title": "滿口環境保護，卻將山林開膛破肚？——嚴正呼籲立即撤回三項草案", "url": "https://www.cet-taiwan.org/news/202405/4493", "date": "2024/05/20"}, {"title": "民主是環境保護的基石，不容開倒車！", "url": "https://www.cet-taiwan.org/news/202405/4491", "date": "2024/05/19"}], "examples": [{"title": "全球淨零交作業 台灣三項不及格─台灣NDC3.0民間檢核記者會", "url": "https://www.cet-taiwan.org/news/202509/4744", "date": "2025/09/09", "html": "\u003cp>\u003cu>\u003cstrong>環境權保障基金會研究員湯琳翔\u003c/strong>\u003c/u>認為，NDC3.0應對2035年的碳定價做出更具體的調升承諾，以對國內外展現減碳決心。台灣已於今年實施碳費制度，未來也在規劃實施總量管制碳交易，但目前碳費一般費率僅收一公噸300元，再加上優惠費率、免徵額度、高碳洩漏風險等制度七折八扣，加速淨零轉型的推力有限。根據綠色金融體系網絡（Network for Greening the Financial System, NGFS）所做評估，要達成2050淨零排放，2035年的碳價須達到每噸300美金(約9000元台幣)，而國內學者王寶貫、蕭代基等於2023年所作預估，也建議2035年的台灣碳價應達到每噸4576元。而新加坡於NDC中具體承諾在2026年將碳稅從目前每噸25新幣調升到45元新幣，並預計在2030年調升至50到80元新幣，成為亞洲最高水準的碳稅，展現其減碳決心，故建議台灣的NDC也應該具體對2035年的碳定價提出調升承諾，加速推動產業減碳。\u003c/p>\u003cp> \u003c/p>\u003cp>\u003cimg alt=\"20250909-006.jpg\" src=\"https://www.cet-taiwan.org/sites/cet-taiwan.org/files/u400/20250909-006.jpg\"/>\u003cspan>環境權保障基金會研究員湯琳翔 (圖/ 台灣行動氣候聯盟)\u003c/span>\u003c/p>", "role": "", "exampleNote": ""}, {"title": "反對重啟核電 全國廢核行動平台送交連署書--呼籲經濟部長審慎回應勿背離非核政策", "url": "https://www.cet-taiwan.org/news/202505/4669", "date": "2025/05/16", "html": "\u003cp>此外，全國廢核行動也呼籲經濟部應聚焦於核電除役後的安全管理、核廢料處置與能源轉型等當務之急。重啟老舊核電將使社會再次陷入核電爭議與對立，虛擲時間，耽誤能源轉型進度，當前全球已進入再生能源加速發展的關鍵階段，台灣不應落後，更應強化電網韌性與節能技術，才能真正實現永續、安全、民主的未來。\u003c/p>\u003cp> \u003c/p>\u003cp>為何反對危險老舊核電延役？老舊核電有以下風險：\u003c/p>", "role": "", "exampleNote": ""}, {"title": "「反對核電重啟，拒絕草率修法」晚會", "url": "https://www.cet-taiwan.org/news/202505/4642", "date": "2025/05/13", "html": "\u003cp>此外，中國已具備導彈精準打擊能力，如東風-17導彈誤差僅10公尺，足以直接摧毀反應器設施。若發生核災，中共可能犧牲屏東南部，換取佔領台灣其他地區的戰略利益。賴中強痛批中華民國核能學會刻意誤導公眾、淡化風險，呼籲政府及立委應堅守核三廠如期除役，避免國安成為核電延役的犧牲品。\u003c/p>\u003cp> \u003c/p>\u003cp>晚會出席名單：媽媽氣候行動聯盟楊順美秘書長、音樂人楊舒雅、立法委員陳培瑜、立法委員郭昱晴、立法委員林宜瑾、立法委員伍麗華、立法委員范雲、台北市議員苗博雅、雙和罷團代表Kevin、反核青年李若慈、本全法律事務所長詹順貴律師、台灣環境保護聯盟謝志誠會長、野薑花公民協會理事王守誠、音樂人吳志寧、主婦聯盟環境保護基金會董事長林玉珮、經濟民主連合智庫召集人賴中強等人。\u003c/p>", "role": "", "exampleNote": ""}]}, {"id": "br", "name": "p 裡面用 br 換行", "note": "同一段裡換行，行距比段落緊。適合地址或項目內換行，不適合拿來切換正文段落。", "promptHint": "同一段裡要換行時使用 br，不要為了換行而新開一個 p。", "articles": [{"title": "別讓海審會淪為空轉程序！呼籲依法不予許可滿地富開發　守護比西里岸、珊瑚礁與海岸永續", "url": "https://www.cet-taiwan.org/news/202607/4876", "date": "2026/07/24"}, {"title": "後勁反五輕運動40年音樂晚會--後勁堅持反五輕，為高雄帶來好空氣、產業轉型", "url": "https://www.cet-taiwan.org/news/202606/4859", "date": "2026/06/01"}, {"title": "11/1「為氣候而走  打造韌性台灣」遊行開跑記者會", "url": "https://www.cet-taiwan.org/news/202510/4751", "date": "2025/10/13"}, {"title": "空污資訊公開、強化法制，守護校園空氣品質", "url": "https://www.cet-taiwan.org/news/202509/4745", "date": "2025/09/11"}, {"title": "核三重啟公投「不同意」屏東晚會", "url": "https://www.cet-taiwan.org/news/202508/4728", "date": "2025/08/16"}, {"title": "老舊核三重啟公投，屏東人不同意！", "url": "https://www.cet-taiwan.org/news/202507/4707", "date": "2025/07/03"}, {"title": "氣候績效死當，股東權益完蛋—台塑石化氣候績效評估報告發布", "url": "https://www.cet-taiwan.org/news/202505/4679", "date": "2025/05/29"}, {"title": "草率修法毀核安，藍白亂搞全民擔——全民風險成政客籌碼？民團譴責在野黨無視核安", "url": "https://www.cet-taiwan.org/news/202505/4668", "date": "2025/05/08"}, {"title": "美顏濾鏡關掉了!站站達標才及格", "url": "https://www.cet-taiwan.org/news/202502/4601", "date": "2025/02/06"}, {"title": "核三如期除役 保障人民安全—老舊核電風險 延役不切實際", "url": "https://www.cet-taiwan.org/news/202407/4531", "date": "2024/07/26"}, {"title": "​​427反核佔領行動十週年，為反核電延役再上街頭怒吼​", "url": "https://www.cet-taiwan.org/news/202404/4482", "date": "2024/04/29"}, {"title": "反對危險老舊核電延役  427反核佔領十週年再上街頭", "url": "https://www.cet-taiwan.org/news/202404/4461", "date": "2024/04/10"}], "examples": [{"title": "別讓海審會淪為空轉程序！呼籲依法不予許可滿地富開發　守護比西里岸、珊瑚礁與海岸永續", "url": "https://www.cet-taiwan.org/news/202607/4876", "date": "2026/07/24", "html": "\u003cp>\u003cimg alt=\"20260724_001.jpg\" src=\"https://www.cet-taiwan.org/sites/cet-taiwan.org/files/u353/20260724_001.jpg\"/>\u003cbr/> \u003cspan>2022年8月滿地富召開部落說明會，部落居民、聲援原民組織及環團則在現場表達意見訴求，最後部落青年高舉標語並大喊「Palasawaden！滿地富，撤回！」。（邱佳旻攝）\u003c/span>\u003c/p>\u003cp>滿地富國際開發股份有限公司（以下簡稱滿地富公司）成立至今30年（請參閱附件一、大事記），從來沒為台東、比西里岸部落帶來任何發展機會，卻已造成部落對立。自2021年起已經連續6年將「滿地富遊樂區開發計畫」（以下簡稱滿地富）送入內政部海岸管理審議會（以下簡稱海審會）審查企圖闖關，但不變的是開發單位維持高達10.5公頃的開發面積，預計興建200間房間，並以歧視在地族群文化與發展的計畫書件，更沒有迴避敏感的珊瑚礁與海洋生態系。\u003c/p>\u003cp>由於書件品質低落、滿地富公司未依《公司法》運作以及海審制度缺乏明確性，導致滿地富一審再審，本次審查已是海審會第6次審議本案，期間海審委員已經更換3屆、也安排2次現勘，滿地富宛如幽魂徘徊在比西里岸土地與內政部國家公園署海審會之上。\u003c/p>", "role": "", "exampleNote": ""}, {"title": "後勁反五輕運動40年音樂晚會--後勁堅持反五輕，為高雄帶來好空氣、產業轉型", "url": "https://www.cet-taiwan.org/news/202606/4859", "date": "2026/06/01", "html": "\u003cp>\u003cimg alt=\"後勁反五輕40年音樂晚會於5_30登場(何俊彥攝)\" src=\"https://www.cet-taiwan.org/sites/cet-taiwan.org/files/u355/20260601-006.webp\"/>\u003cbr/> \u003cspan>後勁反五輕40年音樂晚會於5月30日登場。(何俊彥攝)\u003c/span>\u003c/p>\u003cp>後勁社會福利基金會與後勁廟產管理委員會，於今日（5/30）在鳳屏宮舉辦「反五輕40年紀念音樂晚會」，重現2015年關廠前夕的倒數晚會場景，向後勁反五輕的運動前輩致敬，並感謝社會各界相挺支持。當年的倒數，是對污染工廠的終結期盼；而今日的重現，則在提醒我們，這段由民間發起、為土地而戰的歷程，不該被忘記。 \u003c/p>\u003cp>過去的中油高雄廠，曾是全台面積最大的污染場址，如今在後勁居民的堅持，以及各方的協力下，已成功轉型。除台積電的先進製程廠進駐，高雄市政府亦承諾將規劃生態綠廊，將讓此地成為「生態綠廊內的科學園區」，為在地居民改善居住環境。 \u003c/p>", "role": "", "exampleNote": ""}, {"title": "11/1「為氣候而走  打造韌性台灣」遊行開跑記者會", "url": "https://www.cet-taiwan.org/news/202510/4751", "date": "2025/10/13", "html": "\u003cp>今年台灣首次與國際同步提出2035年氣候承諾，也就是國家自定貢獻目標（NDC3.0），宣示氣候行動成為國家優先政策。然而，當前的減碳目標未符合淨零路徑，也缺乏針對能源、運輸、工業等部門的明確策略與治理機制，都將削弱政策成效與社會信任。\u003cbr/> \u003cbr/> 崔愫欣強調，為了不讓地球透支，將這筆巨大的「碳債」轉嫁給未來世代，因此我們必須團結起來共同呼籲「守護升溫不超過1.5°C的世界」，這不只是技術或數字目標，而是為了確保人類社會與生態安全延續的最低底線。象徵著我們要在本世代積極減碳、淘汰化石燃料、推動公正轉型，確保地球仍是能讓孩子安心成長、萬物共存的家園。\u003c/p>", "role": "", "exampleNote": ""}]}]}, {"id": "heading", "name": "內文小標", "field": "#body", "exclusive": false, "summary": "同一篇可以同時有好幾種小標，所以篇數加總可能超過總篇數。這裡比的是用 h2、h3，還是用加粗段落、【】段落來當小標。", "official": "範本依序使用 h2、h3、h4，不建議為了做小標去改字級、字色或字體。", "officialHtml": "", "variants": [{"id": "h2", "name": "h2", "note": "內文大標。官方範本的第一層是 h2。", "promptHint": "內文章節使用 h2。", "articles": [{"title": "核三再運轉計畫審查完成不等於安全無虞　 34團體籲擴大專業、公開資訊、落實民主參與", "url": "https://www.cet-taiwan.org/news/202609/100176", "date": "2026/09/29"}, {"title": "廢核平台成立公投反方辦事處　電視辯論破解核電謠言", "url": "https://www.cet-taiwan.org/news/202609/100175", "date": "2026/09/24"}, {"title": "落實三零「零排放、零廢棄、零事故」，新材料循環產業園區應建立工業新典範", "url": "https://www.cet-taiwan.org/news/202609/100174", "date": "2026/09/24"}, {"title": "沙崙科園用電直逼整個新北，年吃台灣237億度電", "url": "https://www.cet-taiwan.org/news/202609/100173", "date": "2026/09/17"}, {"title": "八年來第四次核能公投，一投再投夠了沒？", "url": "https://www.cet-taiwan.org/news/202608/100145", "date": "2026/08/28"}, {"title": "呼籲政府屋頂光電新制8月1日應如期上路，勿讓錯誤資訊阻礙能源轉型、削弱能源韌性", "url": "https://www.cet-taiwan.org/news/202607/4869", "date": "2026/07/06"}], "examples": [{"title": "核三再運轉計畫審查完成不等於安全無虞　 34團體籲擴大專業、公開資訊、落實民主參與", "url": "https://www.cet-taiwan.org/news/202609/100176", "date": "2026/09/29", "html": "\u003ch2>資訊尚未完整 核安審查不能以公投取代\u003c/h2>", "role": "", "exampleNote": ""}, {"title": 層級、事證與法規依據，並交代是否依法重新預告，避免少數利益黑箱左右公共政策。\u003c/li> \u003cli>全面公開各類建築光電潛能，建立客觀對話基礎：政府應主動揭露本標準適用範圍內，A類至H類建築之光電潛力占比及相關資訊，建構各縣市屋頂光電典範案例，促進全民參與公民電廠機制。 \u003c/li> \u003cli>充實配套機制，建立中央與地方協調平台：中央應主動建構與地方政府之溝通協調平台，針對產權釐清、維護管理及地方法規競合等議題，展開實質研商與法規調和，完備屋光新制配套措施，早日落實政策。\u003c/li> \u003c/ol>", "role": "一般條列", "exampleNote": ""}, {"title": "台積恐耗全台２成電　應與民間共築「減碳協作平台」", "url": "https://www.cet-taiwan.org/news/202605/4856", "date": "2026/05/27", "html": "\u003col> \u003cli>再生能源承諾：南科管理局及主要進駐廠商台積電應於本案落實科學園區政策環評對再生能源之承諾，即「積體電路先進製程廠商於自建廠房量產後，每年取得前一年度實際用電量之25%再生能源、2040年取得45%再生能源及2050年取得100%再生能源」。該承諾實已大幅落後於台積電於永續報告書具體承諾之「2030年全公司生產營運據點60%用電量為再生能源」，但本案環說書仍僅有提及2050年取得100%實際用電量的再生能源，其他政策環評提及的階段性再生能源目標全被忽略。台積電已達成國外廠區使用100%再生能源，但國內廠區目前僅使用6.2%，應更積極協助台灣再生能源發展，我們認為本案最少應承諾達成政策環評低標用電量25%之目標，為台灣增加至少56.75億度再生能源，方能符合台積電去年宣布將依科學基礎減量目標倡議（The Science Based Targets Initiative, SBTi）實踐的減量路徑。\u003cbr/> \u003c/li> \u003cli>能源效率承諾：台積電於永續報告書中訂定2030年提升能源使用效率目標，包括「相同製程技術量產5年後，生產能效提升1倍」。本案環說書卻對於能源使用效率毫無要求，我們呼籲台積電應參考自己於永續報告書提出的目標，具體於環評承諾中加入提升能源使用效率之目標。\u003cbr/> \u003c/li> \u003cli>建立溫室氣體減量協作平台：根據環評書件推估，本案營運期間總溫室氣體排放量高達每年 2,139 萬噸二氧化碳當量（CO2e），其中製程直接排放（範疇一）為 1,322 萬噸，外購電力間接排放（範疇二）為 817 萬噸。面對如此驚人的溫室氣體與碳排增量，若電力供應不儘速邁向減碳、減污，將衝擊區域環境與居民健康。\u003c/li> \u003c/ol>", "role": "一般條列", "exampleNote": ""}]}, {"id": "br", "name": "同一個 p，用 br 分行", "note": "多筆內容放在同一個 p，中間用 br。視覺像清單，但沒有清單語意。", "promptHint": "多筆資料放在同一個 p，每一筆之間用 br。", "articles": [{"title": "老舊核三不延役，反對藍白亂修法", "url": "https://www.cet-taiwan.org/news/202504/4630", "date": "2025/04/23"}, {"title": "反對立院不顧老舊核電風險 草率修法為核電延役解套", "url": "https://www.cet-taiwan.org/news/202407/4520", "date": "2024/07/09"}, {"title": "9微克，護健康！環境部應加嚴空氣品質標準、修改AQI", "url": "https://www.cet-taiwan.org/news/202405/4495", "date": "2024/05/23"}, {"title": "民主是環境保護的基石，不容開倒車！", "url": "https://www.cet-taiwan.org/news/202405/4491", "date": "2024/05/19"}], "examples": [{"title": "民主是環境保護的基石，不容開倒車！", "url": "https://www.cet-taiwan.org/news/202405/4491", "date": "2024/05/19", "html": "\u003cp>在5月17日立法院院會審議的過程中， 檢討輔導失靈，公開「雙金」收支", "url": "https://www.cet-taiwan.org/news/202607/4882", "date": "2026/07/30"}, {"title": "反對核電重啟：核廢要放哪？政府請回答！", "url": "https://www.cet-taiwan.org/news/202603/4828", "date": "2026/03/26"}, {"title": "《建物光電設備標準》已公告，施行與配套不應再延宕", "url": "https://www.cet-taiwan.org/news/202601/4790", "date": "2026/01/20"}, {"title": "核災風險全民擔？ 拒絕危險再運轉", "url": "https://www.cet-taiwan.org/news/202512/4776", "date": "2025/12/11"}, {"title": "地面型光電怎麼做，才能兼顧生態、農漁村？", "url": "https://www.cet-taiwan.org/news/202512/4771", "date": "2025/12/03"}, {"title": "守護台灣永續未來-公民團體聯合呼籲 核三公投不同意", "url": "https://www.cet-taiwan.org/news/202508/4735", "date": "2025/08/21"}, {"title": "反對重啟核電 全國廢核行動平台送交連署書--呼籲經濟部長審慎回應勿背離非核政策", "url": "https://www.cet-taiwan.org/news/202505/4669", "date": "2025/05/16"}, {"title": "電價合理調整，能源轉型才走得遠", "url": "https://www.cet-taiwan.org/news/202503/4618", "date": "2025/03/28"}, {"title": "福島核災14周年記者會--勿忘核災教訓  要核電不顧核安？", "url": "https://www.cet-taiwan.org/news/202503/4614", "date": "2025/03/11"}, {"title": "空品標準加嚴不到位 全民呼吸好空氣再拖四年", "url": "https://www.cet-taiwan.org/news/202407/4529", "date": "2024/07/23"}, {"title": "屋頂光電普及民間，都市永續兼顧美感", "url": "https://www.cet-taiwan.org/news/202407/4524", "date": "2024/07/15"}, {"title": "防堵漏洞，加速轉型——臺灣碳費制度設計十大建議", "url": "https://www.cet-taiwan.org/news/202407/4523", "date": "2024/07/12"}, {"title": "國土計畫的困境，一延再延不是解方", "url": "https://www.cet-taiwan.org/news/202403/4455", "date": "2024/03/29"}], "examples": [{"title": "核三再運轉計畫審查完成不等於安全無虞　 34團體籲擴大專業、公開資訊、落實民主參與", "url": "https://www.cet-taiwan.org/news/202609/100176", "date": "2026/09/29", "html": "\u003cp>\u003cstrong>一、擴大核三後續審查的專業組成，並完整公開審查資訊\u003c/strong>\u003cbr/>後續安全審查應納入的地質、地震、氣候、複合式災害、緊急醫療、交通、公共衛生與地方公共安全專業，避免核安重大決策侷限於既有核能與工程專業。並應公開審查委員及專家的完整名單、專業背景、遴選方式與利益迴避資訊，使社會得以檢驗審查專業是否完整且具獨立性。\u003c/p>\u003cp>\u003cstrong>二、建立跨部會及地方政府共同參與的決策機制\u003c/strong>\u003cbr/>核三重啟涉及環境、能源、消防、災害應變、交通及地方治理，環境部、經濟部（含能源署、地礦中心）、內政部（含消防署）、交通部（含公路局、中央氣象署）、衛福部，以及可能受事故影響的地方政府，都應正式納入風險評估與決策程序，並對其決策負起相應責任。\u003c/p>\u003cp>\u003cstrong>三、未取得完整資訊公開，不應以全國公投作為核三重啟之政治授權\u003c/strong>\u003cbr/>地質、老化、耐震、經濟成本、核廢料、環境影響及事故應變等資訊尚未完整以前，年底核能公投不得被解讀為核三安全無虞或重啟核三的社會共識，更不得成為推進核三廠再運轉執照核發的政治壓力。政府亦不應預設核三必然重啟，或以既定政治時程影響安全審查。\u003c/p>", "role": "一般條列", "exampleNote": ""}, {"title": "空品標準加嚴不到位 全民呼吸好空氣再拖四年", "url": "https://www.cet-taiwan.org/news/202407/4529", "date": "2024/07/23", "html": "\u003cp>（資料來源：環境部，地球公民基金會製表）\u003c/p>\u003cp>國衛院依多年實證研究結果，早在2018年建議PM2.5年平均值標準訂為10μg/m3、24小時值標準25μg/m3；近一年歐洲議會及美國也啟動標準，或未來改善目標的修訂，其中美國參考了許多公衛研究及科學證據加嚴PM2.5年平均值標準為9μg/m3，PM2.5對台灣人的健康傷害不會比較輕，我們認為環境部對於PM2.5年平均值標準之修正應比照美國。此外PM2.524小時值標準自2012年訂定以來從未調整，於本次修正應參考WHO過度4目標（表二）及國衛院建議，加嚴為25μg/m3。\u003c/p>", "role": "參考資料", "exampleNote": ""}]}, {"id": "heading", "name": "h2 或 h3 當區標", "note": "區名做成真的小標，下面才是內容。", "promptHint": "區名使用 h3，下面的多筆資料再用選定的清單寫法。", "articles": [{"title": "部分立委停止帶頭踐踏國土秩序　國土計畫不該因少數縣市延宕上路", "url": "https://www.cet-taiwan.org/news/202411/4571", "date": "2024/11/21"}], "examples": [{"title": "部分立委停止帶頭踐踏國土秩序　國土計畫不該因少數縣市延宕上路", "url": "https://www.cet-taiwan.org/news/202411/4571", "date": "2024/11/21", "html": "\u003ch3>【備註】各縣市報部進度\u003c/h3>\u003ctable> \u003ctbody> \u003ctr> \u003ctd>\u003cstrong>已報內政部 (14)\u003c/strong>\u003c/td> \u003ctd>臺北市、臺南市、高雄市、宜蘭縣、新竹縣、嘉義縣、屏東縣、基隆市、澎湖縣、金門縣、花蓮縣、嘉義市、新竹市、連江縣\u003c/td> \u003c/tr> \u003ctr> \u003ctd>\u003cstrong>有計畫報內政部 (6)\u003c/strong>\u003c/td> \u003ctd>新北市、臺中市、苗栗縣、彰化縣、台東縣、桃園市\u003c/td> \u003c/tr> \u003ctr> \u003ctd>\u003cstrong>政治力持續拖延 (2)\u003c/strong>\u003c/td> \u003ctd>雲林縣、南投縣\u003c/td> \u003c/tr> \u003c/tbody> \u003c/table>\u003cp>\u003cimg alt=\"20241121_001.jpg\" src=\"https://www.cet-taiwan.org/sites/cet-taiwan.org/files/u353/20241121_001.jpg\"/>\u003cbr/> \u003cspan>全台僅剩2縣市「國土功能分區圖草案」拖延不繳交（地球公民基金會 製圖）\u003c/span>\u003c/p>", "role": "註釋", "exampleNote": ""}]}, {"id": "same-line", "name": "標籤和內容寫在同一行", "note": "只有一筆時，標籤後面直接接內容。", "promptHint": "只有一筆時寫成一個 p，標籤後面直接接內容。多筆不要沿用這種寫法。", "articles": [{"title": "反對核電重啟：核廢要放哪？政府請回答！", "url": "https://www.cet-taiwan.org/ 契機。\u003c/p>", "role": "", "exampleNote": ""}, {"title": "地球公民的山林行動如何轉變：從守護天然林到社區保育行動", "url": "https://www.cet-taiwan.org/events/202609/100150", "date": "", "html": "\u003cp>\u003cimg height=\"1005\" loading=\"lazy\" src=\"https://www.cet-taiwan.org/sites/default/files/u448/0916_%E9%AB%98%E9%9B%84%E5%BF%97%E5%B7%A5%E8%81%9A%E6%9C%83_%E5%AE%98%E7%B6%B2_1.png\" width=\"1920\"/> \u003c/p>\u003cp>在你心裡，地球公民的「山林行動」是什麼樣子？\u003cbr/>\u003cbr/>長期以來我們為天然林發聲、關注不當開發、監督山林政策；也許曾經你也是參與森林講座、小旅行或志工的一員，和我們一起理解台灣森林的處境與未來。\u003cbr/>\u003cbr/>今年，我們走進嘉義中埔的淺山地區，看到曾是一片廢棄的檳榔園，經過十五年的人為管理與自然演替後，出現豐富的植物樣貌，而且出現麝香貓、穿山甲等野生動物的蹤跡，成為非保護區且擁有生物多樣性的「檳榔森林」。\u003cbr/>\u003cbr/>這場志工聚會，邀請地球公民基金會董事長李根政，從《台灣山林百年紀》的歷史脈絡出發，分享台灣山林政策的演變，以及地球公民過去如何參與山林議題與倡議行動。也透過議題部主任呂翊齊，從近年「社區保育」的趨勢談起，並以中埔山林行動為例，和大家分享人與自然互助的山林行動。\u003cbr/>\u003cbr/>邀請喜愛台灣山林的你，一起認識地球公民從過去到現在的山林行動故事，透過中埔山林行動新開端，探索台灣淺山地區的社區保育實踐。\u003c/p>\u003cp>【活動資訊】\u003c/p>", "role": "", "exampleNote": ""}]}, {"id": "empty", "name": "用空白 p 拉開間距", "note": "空段落會多出一塊間距，貼到別的編輯器時常變成多餘空行。", "promptHint": "段落之間插入空白 p 來增加間距。", "articles": [{"title": "8/19【台北現場】十字路口的抉擇--突破台灣石化轉型困境 論壇", "url": "https://www.cet-taiwan.org/events/202607/4872", "date": ""}, {"title": "7/21 《變更之地》Ｘ《複層之森》電影放映+映後座談", "url": "https://www.cet-taiwan.org/events/202606/4862", "date": ""}, {"title": "【講座紀錄】 高雄場－6/13《變更之地》Ｘ《複層之森》電影放映+映後座談", "url": "https://www.cet-taiwan.org/events/202605/4855", "date": ""}, {"title": "5/21【台北現場】《民主之眼》第三部曲〈重聲〉｜放映+映後座談", "url": "https://www.cet-taiwan.org/events/202605/4845", "date": ""}, {"title": "2/10【花蓮現場】當掩埋場又又又又燃燒：談花蓮的空污科普與防護", "url": "https://www.cet-taiwan.org/events/202601/4787", "date": ""}, {"title": "2/8【台北現場+線上】「作家x倡議工作者」雙重身分的跨世代對談 ft.許恩恩", "url": "https://www.cet-taiwan.org/events/202601/4783", "date": ""}, {"title": "2/8【台北現場】藝術家也能從事社會運動嗎？《此岸與彼岸－一個社會運動者的身心之旅》新書發表會", "url": "https://www.cet-taiwan.org/events/202601/4782", "date": ""}, {"title": "1/31 野蓮田水雉飛舞小旅行--農田、生物多樣性與棲地守護", "url": "https://www.cet-taiwan.org/events/202601/4784", "date": ""}, {"title" "date": ""}, {"title": "【講座紀錄】2023/12/19種下永續未來", "url": "https://www.cet-taiwan.org/events/202311/4396", "date": ""}, {"title": "【講座紀錄】11/18 屋頂光電怎麼蓋？好處 、安全都兼顧！", "url": "https://www.cet-taiwan.org/events/202310/4374", "date": ""}], "examples": [{"title": "8/19【台北現場】十字路口的抉擇--突破台灣石化轉型困境 論壇", "url": "https://www.cet-taiwan.org/events/202607/4872", "date": "", "html": "\u003cp>石化產業影響民生與區域發展，其帶來的環境污染與健康風險更備受關注。從五輕、六輕、國光石化到新三輕的擴建案，石化產業的合理規模與發展方向，一直都是引發社會爭議的焦點。\u003cbr/> .\u003cbr/> 行政院於 2024 年 5 月核定中油的「煉化轉型產業投資升級計畫」，規劃進行四輕更新，將乙烯年產能從 35 萬噸大幅提升至最多 120 萬噸。然而，2025 年台灣乙烯的產能利用率已降到 65%以下，此時大幅擴充產能之必要性如何說服社會？\u003cbr/> .\u003cbr/> 面對 2050 淨零碳排的挑戰及中國石化產能過剩的情勢，鄰近國家如日、韓都已逐漸調整石化產業轉型策略，例如整併乙烯產能、業務重組、轉向高附加價值的特用化學品研發等，部分企業則展開電加熱裂解爐的試驗計畫。 但國內兩大石化龍頭對於原料乙烯生產，台塑未來將改採乙烷進料，而中油則在「減碳旗艦行動計畫」中，以使用再生能源及負碳技術為主。兩大公司的「自主減量計畫」多屬既有製程的改善，未能展現更具前瞻性的轉型策略。 \u003cbr/> .\u003cbr/> 在淨零碳排與國際地緣政治的情勢下，石化產業已走到不得不轉型的十字路口，政府、企業與社會如何面對，是否能化危機為轉機？\u003cbr/> 本場論壇邀請大家共同面對台灣石化產業轉型的各種困境，呼籲各界展開對話並共同尋求出路。 \u003c/p>\u003cp> \u003c/p>\u003cp>\u003cstrong>【講座資訊】\u003c/strong>\u003cbr/> 時間：2026/8/19（三）14:00-17:00\u003cbr/> 地點：臺北市非政府組織（NGO）會館 演講室（臺北市中正區青島東路8號）\u003cbr/> 形式：\u003cspan>\u003cstrong>只有現場\u003c/strong>\u003c/span>\u003cbr/> 主持：\u003c/p>", "role": "", "exampleNote": ""}, {"title": "7/21 《變更之地》Ｘ《複層之森》電影放映+映後座談", "url": "https://www.cet-taiwan.org/events/202606/4862", "date": "", "html": "\u003cp>當不同時代的政策與價值交織，森林的意義也持續被重新定義。透過兩部紀錄片的放映與三場不同觀點的映後座談，我們希望帶大家理解：森林治理牽動的不只是環境，也包含人、歷史與選擇；而在當代，當各種價值再次浮現，我們是否有可能重新思考森林治理的方式？多元視角的交會，正是理解這片森林不可或缺的一部分。\u003c/p>\u003cp> \u003c/p>\u003cp>\u003cspan>此活動將會於 6/13 高雄、7/21 花蓮、11/19 台北放映\u003c/span>\u003cbr/>\u003cspan>剩餘台北場目前尚未開放報名，若有意願參加活動，歡迎先加入行事曆並持續關注\u003c/span>\u003c/p>", "role": "", "exampleNote": ""}]}, {"id": "br", "name": "p 裡面用 br 換行", "note": "同一段裡換行，行距比段落緊。適合地址或項目內換行，不適合拿來切換正文段落。", "promptHint": "同一段裡要換行時使用 br，不要為了換行而新開一個 p。", "articles": [{"title": "7/9【台北現場+線上】從沒有人到每個人：農地違章回報系統 背後的人、關係與行動", "url": "https://www.cet-taiwan.org/events/202606/4864", "date": ""}, {"title": "5/28【花 4/28【花蓮現場志工聚會】那片海，那個村莊，終將成為回憶嗎？出賣牙買加紀錄片放映", "url": "https://www.cet-taiwan.org/events/202504/4629", "date": ""}], "examples": [{"title": "4/28【花蓮現場志工聚會】那片海，那個村莊，終將成為回憶嗎？出賣牙買加紀錄片放映", "url": "https://www.cet-taiwan.org/events/202504/4629", "date": "", "html": "\u003cp>\u003cstrong>\u003cimg alt=\"\" height=\"720\" loading=\"lazy\" src=\"https://www.cet-taiwan.org/sites/cet-taiwan.org/files/u431/0428%E5%BF%97%E5%B7%A5%E8%81%9A%E6%9C%83.png\" width=\"1280\"/>\u003c/strong>\u003cbr/>\u003cstrong>你聽過《出賣牙買加》這部紀錄片嗎？\u003c/strong>\u003cbr/>當一棟棟高級飯店在牙買加海岸邊蓋起來，帶來了看似繁榮的觀光「發展」，但同時也改變牙買加居民的生活、土地使用方式及文化。\u003cbr/>\u003cbr/>\u003cstrong>這聽起來是不是有點熟悉？\u003c/strong>\u003cbr/>花東，因為有山、有海、有風、有光，自然美景吸引無數觀光客抵達此。大型資本的目光也投向這片土地。從七星潭的七家飯店，到台東建和、下檳榔等各式渡假村計劃，這些開發案正悄然改變著我們對於土地的想像。\u003cbr/>\u003cbr/>地震過後觀光人潮雪崩式下滑，部分飯店於國定假日住房率剩至不滿五成。在這樣低迷的觀光現況下，為何仍有業者選擇積極擴張、投資開發新的飯店與度假設施？花蓮真的缺飯店嗎？觀光作為花蓮發展的一條軸線，我們該怎麼想像？\u003c/p>", "role": "圖說", "exampleNote": ""}]}, {"id": "text", "name": "圖後面直接接文字", "note": "沒有 br，也沒有 span，圖說容易和圖片黏在同一行。", "promptHint": "圖說直接接在 img 後面，不加 br，也不要用 span。", "articles": [{"title": "7/21 《變更之地》Ｘ《複層之森》電影放映+映後座談", "url": "https://www.cet-taiwan.org/events/202606/4862", "date": ""}, {"title": "2/10【花蓮現場】當掩埋場又又又又燃燒：談花蓮的空污科普與防護", "url": "https://www.cet-taiwan.org/events/202601/4787", "date": ""}, {"title": "10/18【台北現場+線上】與黑熊為鄰：走進台灣的人熊衝突第一線", "url": "https://www.cet-taiwan.org/events/202509/4746", "date": ""}, {"title": "9/20【台北現場+線上】《浪漫巡山員》— 這份工作才沒那麼浪漫！", "url": "https://www.cet-taiwan.org/events/202506/4683", "date": ""}], "examples": [{"title": "7/21 《變更之地》Ｘ《複層之森》電影放映+映後座談", "url": "https://www.cet-taiwan.org/events/202606/4862", "date": "", "html": "\u003cp>\u003cimg alt=\"\" height=\"1005\" loading=\"lazy\" src=\"https://www.cet-taiwan.org/sites/cet-taiwan.org/files/u426/20260721-1.png\" width=\"1920\"/>如果走進一片森林，你會看到什麼？\u003cbr/>是整齊生長的林木與自然生態，還是能深入看見其中人與土地的關係？\u003c/p>", "role": "圖說", "exampleNote": ""}, {"title": "2/10【花蓮現場】當掩埋場又又又又燃燒：談花蓮的空污科普與防護", "url": "https://www.cet-taiwan.org/ev
