<style>
    /* 蓋過官網 custom.css：992 三欄 1fr、1200 整塊 nowrap、字級 16px，以及 Drupal extlink */
    .sub-footer-offices {
        display: grid;
        grid-template-columns: 1fr;
        gap: 24px;
        box-sizing: border-box;
        width: 100%;
        max-width: 960px;
        min-width: 0;
        margin-inline: auto;
        padding: 16px 15px;

        line-height: 20px;
        overflow-x: clip;
        white-space: normal;
    }
    @media (min-width: 992px) {
        .sub-footer-offices {
            grid-template-columns: repeat(3, auto);
            justify-content: center;
            column-gap: 40px;
            white-space: normal;
        }
    }
    @media (min-width: 1200px) {
        .sub-footer-offices {
            grid-template-columns: repeat(3, auto);

    .sub-footer-offices svg[data-extlink-placement],
