<style>
    /* 蓋過官網 custom.css：992 三欄、字級、Drupal extlink */
    /* 大螢幕對齊 .site-footer-inner.container（padding 24px；992=960、1200+=1008） */
    .contact-email {
        box-sizing: border-box;
        width: 100%;
        max-width: 960px;
        margin-inline: auto;
        padding: 24px 15px 0;
        text-align: center;
        font-family: "Noto Sans TC", sans-serif;
        font-size: 16px;
        line-height: 1.5;
    }
    .contact-email p {
        margin: 0;
        font-family: "Noto Sans TC", sans-serif;
    }
    .sub-footer-offices {
        display: grid;
        grid-template-columns: 1fr;
        gap: 24px;
        box-sizing: border-box;
        width: 100%;
        max-width: 960px;
        min-width: 0;
        margin-inline: auto;
        padding: 8px 15px 24px;
        font-family: "Noto Sans TC", sans-serif;
        font-size: 16px;
        line-height: 1.5;
        overflow-x: clip;
        text-align: center;
        justify-items: center;
    }
    .sub-footer-offices .office {
        min-width: 0;
        max-width: 100%;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 2px;
    }
    .sub-footer-offices .office__name {
        font-weight: 700;
    }
    /* 16px 時地址+電話同行會超出三欄寬 → 改直向：地址↗ / 電話 */
    .sub-footer-offices .office__info {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 2px;
        min-width: 0;
    }
    .sub-footer-offices a.office__map {
        color: inherit;
        text-decoration: none;
        max-width: 100%;
    }
    /* 與活動頁 .views-field-field-venue a::after 同款箭頭；頁尾深底用白版 */
    .sub-footer-offices a.office__map::after {
        content: "";
        display: inline-block;
        width: 16px;
        height: 16px;
        margin-inline-start: 2px;
        vertical-align: -3px;
        background: url("https://www.cet-taiwan.org/themes/custom/cet/css/images/icon-arrow-up-right-wite.svg") no-repeat center / contain;
    }
    .sub-footer-offices .office__tel {
        color: inherit;
        text-decoration: none;
        white-space: nowrap;
    }
    /* .sub-footer-offices a.office__tel:hover, */
    .sub-footer-offices a.office__map:hover {
        text-decoration: underline;
    }
    /* 隱藏 Drupal extlink 自動插入的 SVG，改用上方白箭頭 */
    .sub-footer-offices svg[data-extlink-placement],
    .sub-footer-offices svg.ext,
    .sub-footer-offices svg.tel {
        display: none;
    }
    /* 平板：單欄置中，地址｜電話同一行（寬度夠、不會三欄互擠） */
    @media (min-width: 768px) and (max-width: 991.98px) {
        .sub-footer-offices .office__info {
            flex-direction: row;
            flex-wrap: nowrap;
            align-items: baseline;
            justify-content: center;
            gap: 0;
            white-space: nowrap;
        }
        .sub-footer-offices .office__tel::before {
            content: "｜";
            margin-inline: 4px;
        }
    }
    @media (min-width: 992px) {
        .contact-email,
        .sub-footer-offices {
            max-width: 960px;
            padding-inline: 24px;
            text-align: start;
        }
        .sub-footer-offices {
            grid-template-columns: repeat(3, minmax(0, 1fr));
            justify-content: start;
            justify-items: start;
            column-gap: 32px;
        }
        .sub-footer-offices .office,
        .sub-footer-offices .office__info {
            align-items: flex-start;
        }
    }
    @media (min-width: 1200px) {
        .contact-email,
        .sub-footer-offices {
            max-width: 1008px;
        }
    }
</style>
<div class="contact-email">
    <p style="text-decoration: none;">cet@cet-taiwan.org</p>
</div>
<div class="sub-footer-offices">
    <div class="office">
        <div class="office__name">高雄總部</div>
        <div class="office__info">
            <a class="office__map" href="https://maps.app.goo.gl/aLWKEH9kCHhuFqUS7" target="_blank" rel="noopener noreferrer">
                <span class="office__addr">高雄市前金區中華四路282號5樓</span>
            </a>
            <a class="office__tel" href="tel:072156809">07-2156809</a>
        </div>
    </div>
    <div class="office">
        <div class="office__name">台北辦公室</div>
        <div class="office__info">
            <a class="office__map" href="https://maps.app.goo.gl/ehCbqhxVfBQSahqY8" target="_blank" rel="noopener noreferrer">
                <span class="office__addr">台北市中正區北平東路28號9樓之2</span>
            </a>
            <a class="office__tel" href="tel:0223920371">02-23920371</a>
        </div>
    </div>
    <div class="office">
        <div class="office__name">花東辦公室</div>
        <div class="office__info">
            <a class="office__map" href="https://maps.app.goo.gl/QYL55tFSgTMFDZXA8" target="_blank" rel="noopener noreferrer">
                <span class="office__addr">花蓮縣花蓮市自由街150號6樓之3</span>
            </a>
            <a class="office__tel" href="tel:038310916">03-8310916</a>
        </div>
    </div>
</div>
