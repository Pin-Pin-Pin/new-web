<body>
  <a class="skip-link" href="#compare">跳到樣式比較</a>
  <header class="site-header">
    <div class="container py-4">
      <p class="eyebrow mb-2">地球公民基金會</p>
      <h1 class="h2 mb-3" id="page-title">上稿樣式對照</h1>
      <p class="mb-2" id="page-lede">同一種內容，現稿有好幾種寫法。點類型、再點寫法，看實際排出來的樣子、HTML，以及使用該寫法的原頁。決定後，把下面的 prompt 交給之後上稿的 AI。</p>
      <p class="mb-0 text-secondary" id="scope-line"></p>
    </div>
  </header>

  <main class="container py-4">
    <div class="row g-3 mb-4" id="findings"></div>

    <div class="row g-4">
      <div class="col-lg-3">
        <nav class="type-nav panel p-2" aria-label="內容類型">
          <div class="nav flex-row flex-lg-column flex-nowrap overflow-auto" id="type-nav" role="tablist"></div>
        </nav>
      </div>
      <div class="col-lg-9" id="compare">
        <article class="panel p-3 p-md-4" id="type-panel" aria-live="polite"></article>
      </div>
    </div>

    <section class="panel p-3 p-md-4 mt-4" id="decide">
      <h2 class="h4">決定樣式並產生 prompt</h2>
      <p>在上方某個寫法按「採用這個寫法」。每一種類型選一個。產生的文字可以直接貼給之後負責上稿的 AI。</p>
      <div id="decision-list" class="mb-3"></div>
      <label for="decision-note" class="form-label">想另外交代的話</label>
      <textarea id="decision-note" class="form-control mb-3" rows="3" placeholder="例如：系列名統一放副標，講座側記才使用【】。"></textarea>
      <div class="d-flex flex-wrap gap-2 mb-3">
        <button type="button" class="btn btn-success" id="copy-prompt">複製 prompt</button>
        <a class="btn btn-outline-secondary" href="#decide">回到這個區塊</a>
      </div>
      <label for="prompt-box" class="form-label">給 AI 的統一上稿 prompt</label>
      <textarea id="prompt-box" class="form-control prompt-box" readonly></textarea>
      <p id="copy-status" class="mt-2 mb-0 text-secondary" role="status"></p>
    </section>
  </main>

  <footer class="container py-4 text-secondary">
    <p class="mb-0">預覽使用 Noto Sans TC，並把段落、清單、換行的間距拉開，方便比較 br、p、ul 的差別。正式站的 CSS 不會完全一樣，請用「打開原頁」看上線效果。</p>
  </footer>

1-1.png\" width=\"1920\"/> \u003c/p>\u003cp>\u003cspan>咦？天空怎麼灰灰的？！\u003c/span>\u003c/p>\u003cp>我們發現有一隻叫做「空污貓貓」的灰灰怪獸，最喜歡躲在看不見的空氣裡。牠平常小到看不見，卻會悄悄聚集在車流繁忙、工廠林立，或燃燒產生煙霧的地方，讓天空變得灰濛濛，也影響我們每天呼吸的空氣。\u003c/p>", "role": "", "exampleNote": ""}, {"title": "當碳匯走進原鄉－看見森林碳匯的治理新課題", "url": "https://www.cet-taiwan.org/events/202609/100155", "date": "", "html": "\u003cp>\u003cimg height=\"1005\" loading=\"lazy\" src=\"https://www.cet-taiwan.org/sites/default/files/u426/%EF%BC%9923_0.png\" width=\"1920\"/>\u003c/p>\u003cp>氣候變遷與淨零轉型正在悄悄改變我們與森林的關係。\u003c/p>\u003cp>為了實現 2050 淨零排放，森林碳匯被寄予厚望。對擁有大片森林的原鄉地區來說，碳匯可能帶來新的資源，也可能成為重新思考森林經營與地方產業的契機。\u003c/p>", "role": "", "exampleNote": ""}, {"title": "地球公民的山林行動如何轉變：從守護天然林到社區保育行動", "url": "https://www.cet-taiwan.org/events/202609/100150", "date": "", "html": "\u003cp>\u003cimg height=\"1005\" loading=\"lazy\" src=\"https://www.cet-taiwan.org/sites/default/files/u448/0916_%E9%AB%98%E9%9B%84%E5%BF%97%E5%B7%A5%E8%81%9A%E6%9C%83_%E5%AE%98%E7%B6%B2_1.png\" width=\"1920\"/> \u003c/p>\u003cp>在你心裡，地球公民的「山林行動」是什麼樣子？\u003cbr/>\u003cbr/>長期以來我們為天然林發聲、關注不當開發、監督山林政策；也許曾經你也是參與森林講座、小旅行或志工的一員，和我們一起理解台灣森林的處境與未來。\u003cbr/>\u003cbr/>今年，我們走進嘉義中埔的淺山地區，看到曾是一片廢棄的檳榔園，經過十五年的人為管理與自然演替後，出現豐富的植物樣貌，而且出現麝香貓、穿山甲等野生動物的蹤跡，成為非保護區且擁有生物多樣性的「檳榔森林」。\u003cbr/>\u003cbr/>這場志工聚會，邀請地球公民基金會董事長李根政，從《台灣山林百年紀》的歷史脈絡出發，分享台灣山林政策的演變，以及地球公民過去如何參與山林議題與倡議行動。也透過議題部主任呂翊齊，從近年「社區保育」的趨勢談起，並以中埔山林行動為例，和大家分享人與自然互助的山林行動。\u003cbr/>\u003cbr/>邀請喜愛台灣山林的你，一起認識地球公民從過去到現在的山林行動故事，透過中埔山林行動新開端，探索台灣淺山地區的社區保育實踐。\u003c/p>\u003cp>【活動資訊】\u003c/p>", "role": "", "exampleNote": ""}]}, {"id": "empty", "name": "用空白 p 拉開間距", "note": "空段落會多出一塊間距，貼到別的編輯器時常變成多餘空行。", "promptHint": "段落之間插入空白 p 來增加間距。", "articles": [{"title": "8/19【台北現場】十字路口的抉擇--突破台灣石化轉型困境 論壇", "url": "https://www.cet-taiwan.org/events/202607/4872", "date": ""}, {"title": "7/21 《變更之地》Ｘ《複層之森》電影放映+映後座談", "url": "https://www.cet-taiwan.org/events/202606/4862", "date": ""}, {"title": "【講座紀錄】 高雄場－6/13《變更之地》Ｘ《複層之森》電影放映+映後座談", "url": "https://www.cet-taiwan.org/events/202605/4855" --歐洲經驗分享", "url": "https://www.cet-taiwan.org/events/202409/4544", "date": ""}, {"title": "9/20【額滿】《種土》放映會索票申請-地球公民基金會包場", "url": "https://www.cet-taiwan.org/events/202409/4543", "date": ""}, {"title": "【講座紀錄】8/11變異的森林—台灣「外來入侵種」的現況、對策與行動", "url": "https://www.cet-taiwan.org/events/202406/4510", "date": ""}, {"title": "【額滿】8/10 親子繪本分享－好大好大的垃圾島", "url": "https://www.cet-taiwan.org/events/202407/4518", "date": ""}, {"title": "「看見」--高雄石化氣爆十週年聯展", "url": "https://www.cet-taiwan.org/events/202407/4515", "date": ""}, {"title": "【講座紀錄】建築、社區要低碳，不吹冷氣不煮飯？節能、光電來幫忙！", "url": "https://www.cet-taiwan.org/events/202312/4419", "date": ""}, {"title": "【講座紀錄】2023/12/19種下永續未來", "url": "https://www.cet-taiwan.org/events/202311/4396", "date": ""}, {"title": "【講座紀錄】11/18 屋頂光電怎麼蓋？好處 、安全都兼顧！", "url": "https://www.cet-taiwan.org/events/202310/4374", "date": ""}], "examples": [{"title": "8/19【台北現場】十字路口的抉擇--突破台灣石化轉型困境 論壇", "url": "https://www.cet-taiwan.org/events/202607/4872", "date": "", "html": "\u003cp>石化產業影響民生與區域發展，其帶來的環境污染與健康風險更備受關注。從五輕、六輕、國光石化到新三輕的擴建案，石化產業的合理規模與發展方向，一直都是引發社會爭議的焦點。\u003cbr/> .\u003cbr/> 行政院於 2024 年 5 月核定中油的「煉化轉型產業投資升級計畫」，規劃進行四輕更新，將乙烯年產能從 35 萬噸大幅提升至最多 120 萬噸。然而，2025 年台灣乙烯的產能利用率已降到 65%以下，此時大幅擴充產能之必要性如何說服社會？\u003cbr/> .\u003cbr/> 面對 2050 淨零碳排的挑戰及中國石化產能過剩的情勢，鄰近國家如日、韓都已逐漸調整石化產業轉型策略，例如整併乙烯產能、業務重組、轉向高附加價值的特用化學品研發等，部分企業則展開電加熱裂解爐的試驗計畫。 但國內兩大石化龍頭對於原料乙烯生產，台塑未來將改採乙烷進料，而中油則在「減碳旗艦行動計畫」中，以使用再生能源及負碳技術為主。兩大公司的「自主減量計畫」多屬既有製程的改善，未能展現更具前瞻性的轉型策略。 \u003cbr/> .\u003cbr/> 在淨零碳排與國際地緣政治的情勢下，石化產業已走到不得不轉型的十字路口，政府、企業與社會如何面對，是否能化危機為轉機？\u003cbr/> 本場論壇邀請大家共同面對台灣石化產業轉型的各種困境，呼籲各界展開對話並共同尋求出路。 \u003c/p>\u003cp> \u003c/p>\u003cp>\u003cstrong>【講座資訊】\u003c/strong>\u003cbr/> 時間：2026/8/19（三）14:00-17:00\u003cbr/> 地點：臺北市非政府組織（NGO）會館 演講室（臺北市中正區青島東路8號）\u003cbr/> 形式：\u003cspan>\u003cstrong>只有現場\u003c/strong>\u003c/span>\u003cbr/> 主持：\u003c/p>", "role": "", "exampleNote": ""}, {"title": "7/21 《變更之地》Ｘ《複層之森》電影放映+映後座談", "url": "https://www.cet-taiwan.org/events/202606/4862", "date": "", "html": "\u003cp>當不同時代的政策與價值交織，森林 鎮。\u003c/p>", "role": "圖說", "exampleNote": ""}, {"title": "8/2【台東現場】是發展還是掠奪？花東開發的海市蜃樓", "url": "https://www.cet-taiwan.org/events/202607/4870", "date": "", "html": "\u003cp>\u003cimg alt=\"\" height=\"455\" loading=\"lazy\" src=\"https://www.cet-taiwan.org/sites/cet-taiwan.org/files/u431/20260802edm.JPG\" width=\"680\"/>\u003cbr/>地球公民花東辦公室設立十幾年來，見證許多財團到來，在有壯麗海景的海岸買了地，規劃建設豪華遊樂設施、高級飯店。他們描繪海岸線將變成吸引蜂湧人潮而來的渡假勝地，在地將因帶來的人潮及錢潮成為一個觀光新市鎮。\u003c/p>", "role": "圖說", "exampleNote": ""}]}, {"id": "span", "name": "span 圖說", "note": "圖說包在 span。前面常常還有 br。", "promptHint": "圖說包在 span。img 與 span 之間加一個 br。", "articles": [{"title": "4/28【花蓮現場志工聚會】那片海，那個村莊，終將成為回憶嗎？出賣牙買加紀錄片放映", "url": "https://www.cet-taiwan.org/events/202504/4629", "date": ""}], "examples": [{"title": "4/28【花蓮現場志工聚會】那片海，那個村莊，終將成為回憶嗎？出賣牙買加紀錄片放映", "url": "https://www.cet-taiwan.org/events/202504/4629", "date": "", "html": "\u003cp>\u003cstrong>\u003cimg alt=\"\" height=\"720\" loading=\"lazy\" src=\"https://www.cet-taiwan.org/sites/cet-taiwan.org/files/u431/0428%E5%BF%97%E5%B7%A5%E8%81%9A%E6%9C%83.png\" width=\"1280\"/>\u003c/strong>\u003cbr/>\u003cstrong>你聽過《出賣牙買加》這部紀錄片嗎？\u003c/strong>\u003cbr/>當一棟棟高級飯店在牙買加海岸邊蓋起來，帶來了看似繁榮的觀光「發展」，但同時也改變牙買加居民的生活、土地使用方式及文化。\u003cbr/>\u003cbr/>\u003cstrong>這聽起來是不是有點熟悉？\u003c/strong>\u003cbr/>花東，因為有山、有海、有風、有光，自然美景吸引無數觀光客抵達此。大型資本的目光也投向這片土地。從七星潭的七家飯店，到台東建和、下檳榔等各式渡假村計劃，這些開發案正悄然改變著我們對於土地的想像。\u003cbr/>\u003cbr/>地震過後觀光人潮雪崩式下滑，部分飯店於國定假日住房率剩至不滿五成。在這樣低迷的觀光現況下，為何仍有業者選擇積極擴張、投資開發新的飯店與度假設施？花蓮真的缺飯店嗎？觀光作為花蓮發展的一條軸線，我們該怎麼想像？\u003c/p>", "role": "圖說", "exampleNote": ""}]}, {"id": "text", "name": "圖後面直接接文字", "note": "沒有 br，也沒有 span，圖說容易和圖片黏在同一行。", "promptHint": "圖說直接接在 img 後面，不加 br，也不要用 span。", "articles": [{"title": "7/21 《變更之地》Ｘ《複層之森》電影放映+映後座談", "url": "https://www.cet-taiwan.org/events/202606/4862", "date": ""}, {"title": "2/10【花蓮現場】當掩埋場又又又又燃燒：談花蓮的空污科普與防護", "url": "https://www.cet-taiwan.org/events/202601/4787", "date": ""}, {"title": "10/18【台北現場+線上】與黑熊為鄰：走進台灣的人熊衝突第一線", "url": "https://www.cet-taiwan.org/events/2 > \u003c/tr> \u003ctr> \u003ctd>15:20-15:35\u003c/td> \u003ctd colspan=\"2\" rowspan=\"1\">休息\u003c/td> \u003c/tr> \u003ctr> \u003ctd>15:35-16:55\u003c/td> \u003ctd>綜合座談\u003c/td> \u003ctd> \u003cp>主持：邱花妹 副教授｜地球公民基金會董事\u003c/p> \u003cp> 經濟部代表（邀請中）\u003cbr/> 環境部代表（邀請中）\u003cbr/> 台灣中油公司（邀請中）\u003c/p> \u003cp>詹順貴 律師｜本全律師事務所\u003cbr/> 許博任 副執行長｜環境權保障基金會\u003cbr/> 趙家緯 總監｜台灣氣候行動網絡\u003cbr/> 王敏玲 執行長｜地球公民基金會\u003c/p> \u003c/td> \u003c/tr> \u003ctr> \u003ctd>16:55-17:00\u003c/td> \u003ctd>結語\u003c/td> \u003ctd>主持人：王敏玲 執行長｜地球公民基金會\u003c/td> \u003c/tr> \u003c/tbody> \u003c/table>", "role": "表格", "exampleNote": ""}, {"title": "6/27【台北現場+線上】氣候變遷調適：災害治理自然解方 (NbS) 的實踐與思辨 論壇", "url": "https://www.cet-taiwan.org/events/202605/4857", "date": "", "html": "\u003ctable> \u003ctbody> \u003ctr> \u003ctd> \u003cp>\u003cstrong>時間\u003c/strong>\u003c/p> \u003c/td> \u003ctd> \u003cp>\u003cstrong>單元主題\u003c/strong>\u003c/p> \u003c/td> \u003ctd> \u003cp>\u003cstrong>主講人\u003c/strong>\u003c/p> \u003c/td> \u003c/tr> \u003ctr> \u003ctd> \u003cp>13:30-13:50\u003c/p> \u003c/td> \u003ctd> \u003cp>何謂自然解方、為何自然解方\u003c/p> \u003c/td> \u003ctd> \u003cp>李玲玲｜臺大生態學與演化生物學研究所退休教授\u003c/p> \u003c/td> \u003c/tr> \u003ctr> \u003ctd> \u003cp>13:50-14:50\u003c/p> \u003c/td> \u003ctd> \u003cp>災害治理的自然解方\u003c/p> \u003c/td> \u003ctd> \u003cp>廖桂賢｜台灣河溪網協會理事長\u003c/p> \u003c/td> \u003c/tr> \u003ctr> \u003ctd> \u003cp>14:50-15:00\u003c/p> \u003c/td> \u003ctd> \u003cp>中場休息與自由交流\u003c/p> \u003c/td> \u003ctd> \u003cp>-\u003c/p> \u003c/td> \u003c/tr> \u003ctr> \u003ctd> \u003cp>15:00-15:30\u003c/p> \u003c/td> \u003ctd> \u003cp>馬太鞍溪治理挑戰與觀察\u003c/p> \u003c/td> \u003ctd> \u003cp>梁聖岳｜地球公民基金會專員\u003c/p> \u003c/td> \u003c/tr> \u003ctr> \u003ctd> \u003cp>15:30-16:00\u003c/p> \u003c/td> \u003ctd> \u003cp>國內 NbS 政策發展與路徑\u003c/p> \u003c/td> \u003ctd> \u003cp>鄒明軒｜台灣河溪網協會秘書長\u003c/p> \u003c/td> \u003c/tr> \u003ctr> \u003ctd> \u003cp>16:00-17:00\u003c/p> \u003c/td> \u003ctd> \u003cp>綜合討論\u003c/p> \u003c/td> \u003ctd> \u003cp>主持：呂翊齊｜地球公民基金會議題部主任\u003c/p> \u003c/td> \u003c/tr> \u003c/tbody> \u003c/table>", "role": "表格", "exampleNote": ""}]}]}]}</script>
  <script>
    const guide = JSON.parse(document.getElementById("guide-data").textContent);
    const ui = guide.ui || {};
    const storeKey = ui.storeKey || "cet-story-style-v1";
    const noteKey = storeKey + "-note";
    if (ui.title) {
      document.title = ui.title;
      document.getElementById("page-title").textContent = ui.title;
    }
    if (ui.lede) document.getElementById("page-lede").textContent = ui.lede;
    if (ui.notePlaceholder) document.getElementById("decision-note").placeholder = ui.notePlaceholder;
    const state = {
      typeId: guide.types[0].id,
      variantId: {},
      exampleIndex: {},
      decisions: {},
      note: ""
    };

    try {
      state.decisions = JSON.parse(localStorage.getItem(storeKey) || "{}");
      state.note = localStorage.getItem(noteKey) || "";
    } catch (err) {
      state.decisions = {};
    }

    const findings = guide.findings || [];

    function typeById(id) {
      return guide.types.find((item) => item.id === id) || guide.types[0];
    }

    function variantById(type, id) {
      return type.variants.find((item) => item.id === id) || type.variants[0];
    }

    function save() {
      localStorage.setItem(storeKey, JSON.stringify(state.decisions));
      localStorage.setItem(noteKey, state.note);
    }

    function readHash() {
      const raw = decodeURIComponent(location.hash.replace(/^#/, ""));
      if (!raw || raw === "decide") return;
      const [typeId, variantId] = raw.split("/");
      if (typeById(typeId).id !== typeId && !guide.types.some((item) => item.id === typeId)) return;
      if (guide.types.some((item) => item.id === typeId)) {
        state.typeId = typeId;
        if (variantId && typeById(typeId).variants.some((item) => item.id === variantId)) {
          state.variantId[typeId] = variantId;
        }
      }
    }

    function writeHash() {
      const variantId = state.variantId[state.typeId];
      const next = variantId ? `#${state.typeId}/${variantId}` : `#${state.typeId}`;
      if (location.hash !== next) history.replaceState(null, "", next);
    }

    function currentVariant(type) {
      const chosen = state.variantId[type.id] || state.decisions[type.id];
      return variantById(type, chosen);
    }

    function escapeHtml(text) {
      return String(text)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;");
    }

    function renderFindings() {
      const scopeNote = ui.scopeNote || "";
      document.getElementById("scope-line").textContent =
        `範圍：${guide.source}，共 ${guide.articleCount} 篇（${guide.dateFrom} 到 ${guide.dateTo}）。${scopeNote}`;
      document.getElementById("findings").innerHTML = findings.map((text) =>
        `<div class="col-md-4"><p class="finding mb-0">${text}</p></div>`
      ).join("");
    }

    function renderNav() {
      document.getElementById("type-nav").innerHTML = guide.types.map((type) => {
        const active = type.id === state.typeId ? "active" : "";
        const pressed = type.id === state.typeId ? "true" : "false";
        const mark = state.decisions[type.id] ? '<span class="count-pill">已選</span>' : "";
        return `<button type="button" class="nav-link ${active}" role="tab" aria-selected="${pressed}" data-type="${type.id}">${escapeHtml(type.name)} ${mark}</button>`;
      }).join("");
    }

    function renderPanel() {
      const type = typeById(state.typeId);
      const variant = currentVariant(type);
      state.variantId[type.id] = variant.id;
      const exampleIndex = state.exampleIndex[`${type.id}:${variant.id}`] || 0;
      const example = variant.examples[exampleIndex] || null;
      const share = Math.round((variant.articles.length / guide.articleCount) * 100);
      const countLabel = type.exclusive
        ? `${variant.articles.length} / ${guide.articleCount} 篇（${share}%）`
        : `${variant.articles.length} 篇出現過這個寫法`;
      const adopted = state.decisions[type.id] === variant.id;
      const tabs = type.variants.map((item) => {
        const on = item.id === variant.id ? "active" : "";
        const chosen = state.decisions[type.id] === item.id ? " ✓" : "";
        return `<button type="button" class="nav-link variant-tab ${on}" data-variant="${item.id}">${escapeHtml(item.name)}${chosen}<span class="d-block small">${item.articles.length} 篇</span></button>`;
      }).join("");
      const exampleButtons = variant.examples.map((item, index) => {
        const on = index === exampleIndex ? "btn-success" : "btn-outline-success";
        const label = item.role ? `範例 ${index + 1}・${item.role}` : `範例 ${index + 1}`;
        return `<button type="button" class="btn ${on}" data-example="${index}">${escapeHtml(label)}</button>`;
      }).join("");
      const preview = example
        ? example.html
        : "<p>這個寫法沒有可預覽的片段。</p>";
      const note = example && example.exampleNote ? `<p class="small text-secondary mb-2">${escapeHtml(example.exampleNote)}</p>` : "";
      const sourceLink = example
        ? `<a class="btn btn-outline-success" href="${escapeHtml(example.url)}" target="_blank" rel="noopener noreferrer">打開原頁看正式站效果</a>`
        : "";
      const code = example ? example.html : "";
      const articles = variant.articles.slice(0, 8).map(articleLink).join("");
      const rest = variant.articles.slice(8);
      const restHtml = rest.length
        ? `<details class="mt-2"><summary>其餘 ${rest.length} 篇</summary><ul class="mt-2 mb-0">${rest.map(articleLink).join("")}</ul></details>`
        : "";
      const official = type.officialHtml
        ? `<div class="mt-3"><p class="fw-bold mb-2">官方範本實際片段</p><div class="article-preview border rounded p-3">${type.officialHtml}</div></div>`
        : "";

      document.getElementById("type-panel").innerHTML = `
        <p class="eyebrow mb-2">${escapeHtml(type.field)}</p>
        <h2 class="h3">${escapeHtml(type.name)}</h2>
        <p>${escapeHtml(type.summary)}</p>
        <p class="mb-3">${escapeHtml(type.official)}${guide.templateUrl ? ` <a href="${escapeHtml(guide.templateUrl)}" target="_blank" rel="noopener noreferrer">打開官方範本</a>` : ""}</p>
        ${official}
        <div class="nav nav-pills flex-nowrap overflow-auto gap-2 py-3" role="tablist" aria-label="寫法">${tabs}</div>
        <p class="mb-2"><span class="count-pill">${countLabel}</span></p>
        <p>${escapeHtml(variant.note)}</p>
        <div class="d-flex flex-wrap gap-2 mb-3" aria-label="這個寫法的範例">${exampleButtons}</div>
        ${note}
        <h3 class="h6">實際效果</h3>
        <div class="article-preview border rounded p-3 mb-3">${preview}</div>
        <div class="d-flex flex-wrap gap-2 mb-4">
          ${sourceLink}
          <button type="button" class="btn ${adopted ? "btn-success" : "btn-dark"}" id="adopt-btn">${adopted ? "已採用這個寫法" : "採用這個寫法"}</button>
          <a class="btn btn-link" href="#decide">到下面產生 prompt</a>
        </div>
        <h3 class="h6">使用這個寫法的文章</h3>
        <ul class="mb-3">${articles || "<li>沒有對應文章</li>"}</ul>
        ${restHtml}
        <h3 class="h6 mt-3">HTML</h3>
        <pre class="source-code mb-0">${escapeHtml(code)}</pre>
      `;
      writeHash();
    }

    function articleLink(article) {
      const date = article.date ? `（${escapeHtml(article.date)}）` : "";
      return `<li class="mb-1"><a href="${escapeHtml(article.url)}" target="_blank" rel="noopener noreferrer">${escapeHtml(article.title)}</a>${date}</li>`;
    }

    function renderDecisions() {
      document.getElementById("decision-list").innerHTML = guide.types.map((type) => {
        const chosen = type.variants.find((item) => item.id === state.decisions[type.id]);
        const label = chosen ? chosen.name : "尚未選擇";
        return `<p class="mb-1"><a href="#${type.id}/${chosen ? chosen.id : type.variants[0].id}">${escapeHtml(type.name)}</a>：${escapeHtml(label)}</p>`;
      }).join("");
      document.getElementById("decision-note").value = state.note;
      document.getElementById("prompt-box").value = buildPrompt();
    }

    function buildPrompt() {
      const lines = (guide.promptIntro || []).slice();
      lines.push("");
      lines.push(`對照範圍是 ${guide.source}，共 ${guide.articleCount} 篇。${guide.templateUrl ? "官方撰寫範本：" + guide.templateUrl : ""}`);
      lines.push("範本已規定：章節用 h2、h3，條列用 ul 或 ol，項目內換行才用 br（shift+enter），引言用 blockquote，正文一段一個 p。不要改字級、字色、字體，中文不要斜體，不要左右對齊，不要用空白段落撐距離。");
      lines.push("");
      lines.push("這次同事選定的寫法如下。若某項寫「尚未決定」，維持範本，不要自創第三種寫法。");
      guide.types.forEach((type) => {
        const chosen = type.variants.find((item) => item.id === state.decisions[type.id]);
        lines.push("");
        lines.push(`## ${type.name}（${type.field}）`);
        if (!chosen) {
          lines.push("尚未決定。");
          lines.push("可選寫法：" + type.variants.map((item) => item.name).join("、"));
          return;
        }
        const sample = chosen.examples[0];
        lines.push(`採用：${chosen.name}`);
        lines.push(chosen.promptHint);
        if (sample) lines.push(`範例原頁：${sample.url}`);
        const rejected = type.variants.filter((item) => item.id !== chosen.id).map((item) => item.name);
        if (rejected.length) lines.push("不要混用：" + rejected.join("、"));
      });
      if (state.note.trim()) {
        lines.push("");
        lines.push("## 補充決定");
        lines.push(state.note.trim());
      }
      return lines.join("\n");
    }

    document.getElementById("type-nav").addEventListener("click", (event) => {
      const button = event.target.closest("[data-type]");
      if (!button) return;
      state.typeId = button.dataset.type;
      renderNav();
      renderPanel();
    });

    document.getElementById("type-panel").addEventListener("click", (event) => {
      const variantBtn = event.target.closest("[data-variant]");
      if (variantBtn) {
        state.variantId[state.typeId] = variantBtn.dataset.variant;
        state.exampleIndex[`${state.typeId}:${variantBtn.dataset.variant}`] = 0;
        renderPanel();
        return;
      }
      const exampleBtn = event.target.closest("[data-example]");
      if (exampleBtn) {
        const type = typeById(state.typeId);
        const variant = currentVariant(type);
        state.exampleIndex[`${type.id}:${variant.id}`] = Number(exampleBtn.dataset.example);
        renderPanel();
        return;
      }
      if (event.target.id === "adopt-btn") {
        const type = typeById(state.typeId);
        state.decisions[type.id] = currentVariant(type).id;
        save();
        renderNav();
        renderPanel();
        renderDecisions();
      }
    });

    document.getElementById("decision-note").addEventListener("input", (event) => {
      state.note = event.target.value;
      save();
      document.getElementById("prompt-box").value = buildPrompt();
    });

    document.getElementById("copy-prompt").addEventListener("click", async () => {
      const text = document.getElementById("prompt-box").value;
      const status = document.getElementById("copy-status");
      try {
        await navigator.clipboard.writeText(text);
        status.textContent = "已複製。可以直接貼給之後上稿的 AI。";
      } catch (err) {
        document.getElementById("prompt-box").focus();
        document.getElementById("prompt-box").select();
        status.textContent = "瀏覽器沒有開放剪貼簿，請在文字框裡全選後複製。";
      }
    });

    window.addEventListener("hashchange", () => {
      readHash();
      renderNav();
      renderPanel();
    });

    readHash();
    renderFindings();
    renderNav();
    renderPanel();
    renderDecisions();
  </script>
</body>
</html>
