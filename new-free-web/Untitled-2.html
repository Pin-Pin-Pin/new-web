<script type="text/javascript">
    var IMAGE_BASE = '/sites/cet-taiwan.org/files/u422/';
    var shareTopicsMq = window.matchMedia('(min-width: 768px)');
    var shareTopicsMode = null;
    var shareTabScrollInited = false;

    function escapeHtml(text) {
        return String(text)
            .replace(/&/g, '&amp;')
            .replace(/</g, '&lt;')
            .replace(/>/g, '&gt;')
            .replace(/"/g, '&quot;');
    }

    function buildTopicPictureHtml(image, loading) {
        var mobileSlug = '20260723-topic-' + image.topicId;
        var desktopSlug = '20260730-topic-' + image.topicId;
        var mobileWebp380 = IMAGE_BASE + mobileSlug + '-380.webp';
        var mobileWebp760 = IMAGE_BASE + mobileSlug + '-760.webp';
        var mobileJpg380 = IMAGE_BASE + mobileSlug + '-380.jpg';
        var mobileJpg760 = IMAGE_BASE + mobileSlug + '-760.jpg';
        var desktopWebp450 = IMAGE_BASE + desktopSlug + '-450.webp';
        var desktopWebp850 = IMAGE_BASE + desktopSlug + '-850.webp';
        var desktopJpg450 = IMAGE_BASE + desktopSlug + '-450.jpg';
        var desktopJpg850 = IMAGE_BASE + desktopSlug + '-850.jpg';
        var desktopSizes = '379px';
        var mobileSizes = '(min-width: 768px) min(680px, calc(100vw - 160px)), min(478px, calc(100vw - 48px))';
        // Accordion panels are display:none when collapsed — skip lazy there.
        var loadingAttr = loading === 'lazy' ? ' loading="lazy"' : '';

        return (
            '<picture>' +
                '<source media="(min-width: 992px)" type="image/webp" srcset="' + desktopWebp450 + ' 450w, ' + desktopWebp850 + ' 850w" sizes="' + desktopSizes + '">' +
                '<source media="(min-width: 992px)" type="image/jpeg" srcset="' + desktopJpg450 + ' 450w, ' + desktopJpg850 + ' 850w" sizes="' + desktopSizes + '">' +
                '<source type="image/webp" srcset="' + mobileWebp380 + ' 380w, ' + mobileWebp760 + ' 760w" sizes="' + mobileSizes + '">' +
                '<img' +
                    ' src="' + mobileJpg380 + '"' +
                    ' srcset="' + mobileJpg380 + ' 380w, ' + mobileJpg760 + ' 760w"' +
                    ' sizes="' + mobileSizes + '"' +
                    ' width="4" height="3"' +
                    ' alt="' + escapeHtml(image.alt) + '"' +
                    loadingAttr +
                    ' decoding="async"' +
                '>' +
            '</picture>'
        );
    }

    function buildSectionTextHtml(text) {
        var paragraphs = Array.isArray(text) ? text : (text ? [text] : []);

        return paragraphs.map(function (paragraph) {
            return '<p>' + escapeHtml(paragraph) + '</p>';
        }).join('');
    }

    function topicImage(topicId, alt) {
        return {
            topicId: topicId,
            alt: alt
        };
    }

    var shareTopicData = [
        {
            title: '倡議如何改變社會',

                { title: '講題二｜改變社會：從理念到行動', text: ['環境議題與公共政策息息相關。地球公民如何透過倡議、政策對話、公共教育與社群互動，讓環境議題被更多人看見並重視？','環境倡議不只是抗議或請願。在這場講座中，我們將分享許多過去結合研究、溝通與策略的行動，說明我們如何將環境意識轉化為實際的公共影響。'] }
            ],
            image: topicImage(1, '地球公民的員工參與政府會議')
        },
        {
            title: '校園與空污',
            sections: [
                { title: '講題一｜工業區旁的風險', text: ['在台灣，鄰近工業區的學童長期暴露於空氣污染之下，健康風險遠高於一般民眾。鋼鐵與石化產業排放的污染物不僅影響呼吸系統，更可能造成長期慢性健康問題。','我們將以高雄工業區鄰近學校為案例，解析學童空污暴露的現況與風險，並說明環境治理與政策倡議的重要性，邀請社會一同重視兒童環境權，為下一代健康把關。'] },
                { title: '講題二｜在地行動與防護指南', text: ['除了整體空氣改善，個人與社區行動同樣關鍵。講座中分享可行的防護措施、日常生活防護策略，以及市民如何參與在地倡議行動。','透過地球公民基金會十年來的空污監測與政策倡議經驗，參與者能學習如何從自身與社區出發，降低空污對健康的影響，共同打造永續的生活環境。'] }
            ],
            image: topicImage(2, '一名學童舉著我要乾淨空氣的手舉牌，地球公民的員工拿著麥克風向台下介紹空污問題')
        },
        {
            title: '極端氣候與環境治理',
            sections: [
                { title: '講題一｜極端氣候下的任務清單', text: '在極端氣候頻繁發生的現在，環境變得更具風險及脆弱。辨識清楚環境資訊，並與周遭的夥伴形成互助的社群，我們才有機會建構更有能力應對未知風險的社會。' },
                { title: '講題二｜從馬太鞍流域看環境治理', text: '我們將從馬太鞍堰塞湖事件的實際案例，理解流域的現況、自然環境如何跟城市發展互動互相影響，以及回到自己生活的地方，面對下一次可能來臨的災害，可以如何建立更具能力的社群。' }
            ],
            image: topicImage(3, '貨車穿過淹水的馬路')
        },
        {
            title: '永續發展',
            sections: [
                { title: '講題｜發展，只有一種可能嗎？', text: ['只要大型的道路建設、飯店蓋下去，地方就能迎來真正的繁榮嗎？','所謂的發展與幸福，真的只有經濟成長這個單一標準嗎？','地球公民從2010年在花東設立辦公室以來，參與了無數大型道路、觀光開發案，陪伴地方檢視開發帶來的環境影響及社會衝擊。','在這個講題中，我們將從第一線的倡議經驗出發，結合歷史脈絡、法律制度與國內外案例，帶領大家重新審視大型開發案為土地與社會帶來的劇烈變動。','邀請大家一起打破「經濟開發」與「環境保護」的二元對立，探討一條真正適合台灣、兼顧世代正義的永續發展之路。'] }
            ],
            image: topicImage(4, '一群民眾在美麗灣飯店前的海灘上手牽著手')
        }
    ];

    function buildTopicSectionsHtml(sections) {
        return sections.map(function (section) {
            return (
                '<div class="content-tab-block">' +
                    '<h3 style="color:var(--black)">' + escapeHtml(section.title) + '</h3>' +
                    buildSectionTextHtml(section.text) +
                '</div>'
            );
        }).join('');
    }

    function buildTopicCardHtml(item, loading) {
        var topicMod = ' content-tab-img--topic-' + item.image.topicId;

        return (
            '<div class="content-tab-card">' +
                '<div class="content-tab-img' + topicMod + '">' + buildTopicPictureHtml(item.image, loading) + '</div>' +
                '<div class="content-tab-text" style="color:var(--black);">' + buildTopicSectionsHtml(item.sections) + '</div>' +
            '</div>'
        );
    }

    function renderShareTopicsTabs() {
        var nav = document.getElementById('shareTab');
        var panels = document.getElementById('shareTabContent');
        if (!nav || !panels) return;

        nav.innerHTML = shareTopicData.map(function (item, index) {
            var isActive = index === 0;
            return (
                '<li class="nav-item" role="presentation">' +
                    '<button type="button" class="nav-link' + (isActive ? ' active' : '') + '" id="share-tab-' + index + '" data-bs-toggle="tab" data-bs-target="#share-panel-' + index + '" role="tab" aria-controls="share-panel-' + index + '" aria-selected="' + isActive + '" tabindex="' + (isActive ? '0' : '-1') + '">' + escapeHtml(item.title) + '</button>' +
                '</li>'
            );
        }).join('');

        panels.innerHTML = shareTopicData.map(function (item, index) {
            var isActive = index === 0;
            return (
                '<div class="tab-pane' + (isActive ? ' active' : '') + '" role="tabpanel" id="share-panel-' + index + '" aria-labelledby="share-tab-' + index + '" aria-hidden="' + (isActive ? 'false' : 'true') + '">' +
                    buildTopicCardHtml(item, 'lazy') +
                '</div>'
            );
        }).join('');
    }

    function renderShareTopicsAccordion() {
        var accordion = document.getElementById('shareTopicsAccordion');
        if (!accordion) return;

        accordion.innerHTML = shareTopicData.map(function (item, index) {
            var id = index + 1;
            return (
                '<div class="accordion-item">' +
                    '<h3 class="accordion-header" id="share-heading-' + id + '">' +
                        '<button id="share-acc-btn-' + id + '" aria-controls="share-collapse-' + id + '" aria-expanded="false" class="collapsed p" data-bs-target="#share-collapse-' + id + '" data-bs-toggle="collapse" type="button"><span class="faq-question-label">' + escapeHtml(item.title) + '</span></button>' +
                    '</h3>' +
                    '<div aria-labelledby="share-acc-btn-' + id + '" class="accordion-collapse collapse" data-bs-parent="#shareTopicsAccordion" id="share-collapse-' + id + '">' +
                        '<div class="accordion-body">' + buildTopicCardHtml(item) + '</div>' +
                    '</div>' +
                '</div>'
            );
        }).join('');
    }

    function initShareTabScroll() {
        var wrap = document.querySelector('.share-topics-tabs .content-tabs-wrap');
        var nav = document.getElementById('shareTab');
        if (!wrap || !nav) return;

        function updateScrollState() {
            var maxScroll = nav.scrollWidth - nav.clientWidth;
            var scrollable = maxScroll > 4;

            wrap.classList.toggle('is-scrollable', scrollable);
            wrap.classList.toggle('is-scrolled-left', nav.scrollLeft > 4);
            wrap.classList.toggle('is-scrolled-end', nav.scrollLeft >= maxScroll - 4);
        }

        function scrollActiveTabIntoView() {
            var activeTab = nav.querySelector('.nav-link.active');
            if (activeTab) {
                activeTab.scrollIntoView({ inline: 'nearest', block: 'nearest', behavior: 'smooth' });
            }
        }

        function syncPanelAriaHidden() {
            var panels = document.querySelectorAll('#shareTabContent .tab-pane');
            panels.forEach(function (panel) {
                panel.setAttribute('aria-hidden', panel.classList.contains('active') ? 'false' : 'true');
            });
        }

        if (!shareTabScrollInited) {
            shareTabScrollInited = true;
            nav.addEventListener('scroll', updateScrollState, { passive: true });
            nav.addEventListener('shown.bs.tab', function () {
                syncPanelAriaHidden();
                scrollActiveTabIntoView();
            });
            window.addEventListener('resize', updateScrollState);
        }

        updateScrollState();
    }

    function clearShareTopicsTabs() {
        var nav = document.getElementById('shareTab');
        var panels = document.getElementById('shareTabContent');
        if (nav) nav.innerHTML = '';
        if (panels) panels.innerHTML = '';
    }

    function clearShareTopicsAccordion() {
        var accordion = document.getElementById('shareTopicsAccordion');
        if (accordion) accordion.innerHTML = '';
    }

    function syncShareTopicsView() {
        var mode = shareTopicsMq.matches ? 'tabs' : 'accordion';
        if (mode === shareTopicsMode) return;
        shareTopicsMode = mode;

        if (mode === 'tabs') {
            clearShareTopicsAccordion();
            renderShareTopicsTabs();
            initShareTabScroll();
        } else {
            clearShareTopicsTabs();
            renderShareTopicsAccordion();
        }
    }

    syncShareTopicsView();
    if (typeof shareTopicsMq.addEventListener === 'function') {
        shareTopicsMq.addEventListener('change', syncShareTopicsView);
    } else if (typeof shareTopicsMq.addListener === 'function') {
        shareTopicsMq.addListener(syncShareTopicsView);
    }

    var faqData = [
        {
            question: '捐贈遺產有基本的金額門檻嗎？',
            content: [
                '預立遺囑或保單捐贈，都沒有金額門檻，任何心意都能化為守護台灣環境的力量。您可以依據自身狀況，在遺囑或保單中，指定捐贈特定金額或比例。'
            ]
        },
        {
            question: '請問地球公民基金會接受哪些類型的捐贈？',
            content: [
                '目前最常見且手續簡便的類型為「現金捐贈」與「保單捐贈」。若是房屋、土地等不動產，或是股票、基金等有價證券，因後續過戶與處分等行政程序較為繁瑣，建議您事先與我們的專員聯繫，以便共同討論出妥善的規劃。'
            ]
        },
        {
            question: '捐贈給基金會的遺產需要繳納遺產稅嗎？',

                '不需要。根據《遺產及贈與稅法》規定，將遺產捐贈給依法登記之公益財團法人（如：地球公民基金會），免課徵遺產稅，您的心意將能全部投入於本會的環境保護工作中。同理，如您決定將繼承的全部或部分遺產捐贈給地球公民，該部分的捐贈也一樣是免課徵遺產稅的。'
            ]
        },
        {
            question: '我可以指定將遺贈只用於特定的專案中嗎？',
            content: [
                '當我們收到您的心意時，可能已經在您預立遺囑的多年之後，屆時台灣面臨的環境挑戰可能已經不同。為了讓您的善款發揮最大效益，建議由基金會統籌利用及分配，將資源投入於當時最迫切且具影響力的環境倡議行動中。',
                '若您仍十分期待將善款投入在特定的議題或專案中，邀請您事先與我們的專員聯繫，以便共同討論出妥善的規劃。'
            ]
        },
        {
            question: '地球公民基金會可以擔任我的「遺囑執行人」嗎？',
            content: [
                '法律並未禁止法人擔任遺囑執行人，但基金會身為遺產受益人，若同時擔任執行人恐有利益衝突之疑慮，建議您另尋中立第三方（如：專業律師、會計師或值得信任的親友）擔任遺囑執行人。'
            ]
        },
        {
            question: '我該如何將地球公民基金會設定為保單捐贈的對象？',
            content: [
                '只要聯絡您的保險公司，指定「財團法人地球公民基金會」作為您的保險金受益人即可，也能同時告知保險公司受益順位及捐贈比例。如保險公司要求您提供本會的資訊或相關文件，歡迎與我們的專員聯繫，我們將協助您處理。'
            ]
        }
    ];
    
    function renderFaq() {
        var accordion = document.getElementById('accordionExample');
        if (!accordion) return;
    
        accordion.innerHTML = faqData.map(function (item, index) {
            var id = index + 1;
            var bodyHtml = item.content.map(function (text) {
                return '<p>' + escapeHtml(text) + '</p>';
            }).join('');
    
            return (
                '<div class="accordion-item">' +
                    '<h3 class="accordion-header" id="heading-' + id + '">' +
                        '<button id="faq-btn-' + id + '" aria-controls="collapse-' + id + '" aria-expanded="false" class="collapsed p" data-bs-target="#collapse-' + id + '" data-bs-toggle="collapse" type="button"><span class="faq-question-label">' + escapeHtml(item.question) + '</span></button>' +
                    '</h3>' +
                    '<div aria-labelledby="faq-btn-' + id + '" class="accordion-collapse collapse" data-bs-parent="#accordionExample" id="collapse-' + id + '">' +
                        '<div class="accordion-body">' + bodyHtml + '</div>' +
                    '</div>' +
                '</div>'
            );
        }).join('');
    }
    
    renderFaq();
    </script>
