                    <h2 class="h3">將環境現場帶入日常，用對話開啟改變。</h2>
                    <div class="page-top-text-p">
                        <p>地球公民超過二十年的時間位在台灣環境倡議的第一線。有感於行動的現場，有賴關心環境的大眾力量共同理解與共鳴。</p>
                        <p>透過講座與對話，我們期盼期盼促成具備實質意義的社會對話。無論是高中與大學社團、積極推廣議題的教育工作者，或是關注環境的企業與社區，我們都非常期待與您交流。</p>
