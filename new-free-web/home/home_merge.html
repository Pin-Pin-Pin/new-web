<body>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@700&display=swap" rel="stylesheet">
<style type="text/css">
/* new-free-web/home/home_scoped.css */
/* === 來自 share.css（home 頁實際用到） === */
:root {
    --brand-dark-primary: #55716C;
    --brand-black: #2D2D2D;
    --brand-white: #FAFAFA;
    --brand-background-green: #E5EAE3;
}

#main *,
#main *::before,
#main *::after {
    box-sizing: border-box;
}

#main body {
    margin: 0;
    color: var(--brand-black);
    font-family: "Noto Sans TC", sans-serif;
}

#main h1,
#main h2,
#main h3,
#main h4,
#main h5,
#main h6 {
    margin-top: 0;
}

#main p {
    margin-top: 0;
}

#main section,
#main .section {
    padding: 64px 24px; /* 左右最小邊緣距 24 */
}

#main .container {
    display: flex;
    width: 100%;
    max-width: 100%; /* <576：同 BS／neti 滿寬 */
    margin-left: auto;
    margin-right: auto;
    padding-left: 0;
    padding-right: 0;
}

@media (min-width: 576px) {
    #main .container {
        max-width: 540px; /* 576–767：BS sm */
    }
}

@media (min-width: 768px) {
    #main .container {
        max-width: 720px; /* 768–991 */
    }
}

@media (min-width: 992px) {
    #main .container {
        max-width: 960px; /* 992–1199 */
    }
}

@media (min-width: 1200px) {
    #main .container {
        max-width: 984px; /* ≥1200 */
    }
}

#main h2,
#main .h2 {
    font-family: "Noto Sans TC", sans-serif;
    font-size: 1.75rem;
    font-style: normal;
    font-weight: 300;
    line-height: normal;
}

#main h3,
#main .h3 {
    font-family: "Noto Sans TC", sans-serif;
    font-size: 1.25rem;
    font-style: normal;
    font-weight: 500;
    line-height: normal;
}

#main p,
#main .p,
#main li {
    font-family: "Noto Sans TC", sans-serif;
    font-size: 1rem;
    font-style: normal;
    font-weight: 400;
    line-height: 1.5;
}

#main p:last-child,
#main li:last-child,
#main ol:last-child,
#main ul:last-child {
    margin-bottom: 0;
}

#main img {
    display: block;
    max-width: 100%;
    height: auto;
}

/* === 原本 home.css（已合併覆寫） === */
#main .result{
    background-color:var(--brand-background-green);
}
#main .result .container {
    background-color:var(--brand-white);
    padding: 24px 40px;
    flex-direction: column;
    gap: 24px;
}

#main .result h2 {
    text-align: center;
    color: var(--brand-dark-primary);
    margin-bottom: 0;
    font-weight: 700;
    font-size: 1rem;
    line-height: 1.5;
}

#main .result .content-container {
    display: grid;
    grid-template-columns: 1fr;
    gap: 40px;
}

#main .result h3 {
    font-weight: 700;
    line-height: 1.4;
    color: var(--brand-dark-primary);
    margin-bottom: 0;
}

#main .result .content-item {
    display: flex;
    flex-direction: column;
    justify-content: start;
    align-items: center;
}

#main .result .content-item-icon {
    width: 120px;
    height: 120px;
    margin-bottom: 16px;
}

#main .result .content-item img {
    width: 100%;
    height: 100%;
    display: block;
}

@media (min-width: 768px) {
    #main .result .content-container {
        grid-template-columns: repeat(2, 1fr);
        gap: 24px;
    }

    #main .result .content-item-icon {
        margin-bottom: 8px;
    }
}

@media (min-width: 1200px) {
    #main .result .content-container {
        grid-template-columns: repeat(4, 1fr);
        column-gap: 0;
    }
}


/* share-css/fix.css */
.path-node:not(.node--type-landing) #main.container {
    max-width: none;
    padding: 0;
}

/* 取消 Bootstrap .row 預設 */
#main > .row {
    margin-left: 0;
    margin-right: 0;
    --bs-gutter-x: 0;
    --bs-gutter-y: 0;
}

/* 一併取消 #content 上 .col 的左右 padding */
#content.col {
    padding-left: 0;
    padding-right: 0;
}
#main section.content-inner.section{
    padding: 0;
}

#main h3, #main h2 {
    width: 100%;
    border: none;
}
#main .node__content{
    margin-top: 0;
}
.text-formatted h2, .text-formatted h3, .ck.ck-content h2, .ck.ck-content h3 {
    width: fit-content;
    margin-block: 0;
}
        
</style>
<section class="result">
        <div class="container">
            <h2>與台灣社會一起創造改變！</h2>
            <div class="content-container">
                <div class="content-item">
                    <div class="content-item-icon">
                        <img src="/sites/cet-taiwan.org/files/u422/20260702-home-icon1.svg" alt="" width="120" height="120">
                    </div>
                    <h3>推動 211,000 位公民</h3>
                    <p>關注礦業法規修訂</p>
                </div>
                <div class="content-item">
                    <div class="content-item-icon">
                        <img src="/sites/cet-taiwan.org/files/u422/20260702-home-icon2.svg" alt="" width="120" height="120">
                    </div>
                    <h3>號召 7,000 人次</h3>
                    <p>參與農地工廠監測與紀錄</p>
                </div>
                <div class="content-item">
                    <div class="content-item-icon">
                        <img src="/sites/cet-taiwan.org/files/u422/20260702-home-icon3.svg" alt="" width="120" height="120">
                    </div>
                    <h3>凝聚 4,262,451 份民意</h3>
                    <p>共同實踐非核家園願景</p>
                </div>
                <div class="content-item">
                    <div class="content-item-icon">
                        <img src="/sites/cet-taiwan.org/files/u422/20260702-home-icon4.svg" alt="" width="120" height="120">
                    </div>
                    <h3>守護 2 兆預算資源</h3>
                    <p>創造人本交通規劃的空間</p>
                </div>
            </div>

        </div>
    </section>
</body>
