      <p>在上方某個寫法按「採用這個寫法」。每一種類型選一個。產生的文字可以直接貼給之後負責上稿的 AI。</p>
      <div id="decision-list" class="mb-3"></div>
      <label for="decision-note" class="form-label">想另外交代的話</label>

      <div class="d-flex flex-wrap gap-2 mb-3">

        <a class="btn btn-outline-secondary" href="#decide">回到這個區塊</a>
      </div>
      <label for="prompt-box" class="form-label">給 AI 的統一上稿 prompt</label>
      <textarea id="prompt-box" class="form-control prompt-box" readonly></textarea>
      <p id="copy-status" class="mt-2 mb-0 text-secondary" role="status"></p>
    </section>
  </main>

  <footer class="container py-4 text-secondary">
    <p class="mb-0">預覽使用 Noto Sans TC，並把段落、清單、換行的間距拉開，方便比較 br、p、ul 的差別。正式站的 CSS 不會完全一樣，請用「打開原頁」看上線效果。</p>

審查完成不等於安全無虞　 34團體籲擴大專業、公開資訊、落實民主參與", "url": "https://www.cet-taiwan.org/news/202609/100176", "date": "2026/09/29", "html": "\u003cp>\u003cimg alt=\"20260929-000.jpg\" height=\"100%\" loading=\"lazy\" src=\"https://www.cet-taiwan.org/sites/default/files/u355/20260929-000.jpg\" width=\"100%\"/> \u003cspan>核三廠兩座反應爐位於恆春半島，與周邊聚落及生活地景相鄰。（圖／地球公民基金會）\u003c/span>\u003c/p>\u003cp>核能安全委員會於2026年9月24日公布核三再運轉計畫審查完成。從核三所在地恆春、屏東、高雄一路到台北，共34個民間團體、工會、企業及民意代表服務處共同發表聲明，強調核三是否重啟不只是核工技術問題，後續審查與決策必須納入地質、氣候、複合式災害等跨領域專業，也應讓可能承擔事故風險地區的居民實質參與。全國廢核行動平台另針對核安會的資訊發布方式提出質疑，指出核安會選在9/24四天連假前夕晚間18時19分發布消息，難免引發閃避新聞與社會監督的疑慮，應公開說明。\u003c/p>\u003cp>核三廠再運轉計畫審查完成後，台電將據此展開後續人員訓練與補充、設備檢查測試，並針對核三廠重要結構、系統與組件進行自主安全檢查；另須辦理整體老化評估、老化管理計畫、時限老化分析、輻射相關議題查核、耐震安全評估，以及終期安全分析報告與運轉技術規範增修等技術工作。\u003c/p>", "role": "", "exampleNote": ""}, {"title": "廢核平台成立公投反方辦事處　電視辯論破解核電謠言", "url": "https://www.cet-taiwan.org/news/202609/100175", "date": "2026/09/24", "html": "\u003cp>\u003cimg alt=\"20260924-002_0.webp\" height=\"100%\" loading=\"lazy\" src=\"https://www.cet-taiwan.org/sites/default/files/u355/20260924-002_0.webp\" width=\"100%\"/> \u003cspan>全國廢核行動平台於「不實核電謠言」布條打上紅色叉叉，宣示將參與公投電視辯論迎戰謠言。（圖／地球公民基金會）\u003c/span>\u003c/p>\u003cp>立法院在野黨在 8 年內發動第 4 次核能公投，即第 22 號公投：「你是否支持政府使用『核電』振興經濟，以廢除『非核家園』的能源政策？」以「核電振興經濟」等空洞口號操作選戰，將能源議題再次拉入政治對決的泥淖。全國廢核行動平台今宣布將成立第 22 號公投之「反方辦事處」，力拚於 9 月 30 日前募得 1,200 份連署書，推派專業代表站上電視辯論台正面迎戰不實的核電謠言，並回應近期在野黨陣營不實的核電言論，防堵錯誤資訊誤導大眾。\u003c/p>\u003cp>記者會上，全國廢核行動平台於「不實核電謠言」的布條上打上巨大的紅色叉叉，宣示將參與公投電視辯論迎戰謠言，以嚴謹的事實查核與科學數據守護台灣能源未來的決心，邀請全國人民參與「反方辦事處」連署支持。\u003c/p>", "role": "", "exampleNote": ""}, {"title": "落實三零「零排放、零廢棄、零事故」，新材料循環產業園區應建立工業新典範", "url": "https://www.cet-taiwan.org/news/202609/100174", "date": "2026/09/24", "html": "\u003cp>\u003cimg alt=\"20260924-001_0.webp\" height=\"100%\" loading=\"lazy\" src=\"https://www.cet-taiwan.org/sites/default/files/u355/20260924-002.webp\" width=\"100%\"/>\u003cspan>大林蒲社區被煙囪包圍，承受鄰近工業區長年帶來的環境污染。（圖／地球公民基金會）\u003c/span>\u003c/p>\u003cp>今日（9月23日）環境部召開環境影響評估審查委員會第55次會議，審查「新材料循環產業園區」開發案，本園區近260公頃，開發所在地大林蒲（沿海六里社區--鳳源里、鳳興里、鳳林里、鳳森里、龍鳳里、鳳鳴里）。地球公民基金會呼籲，既然本園區從一開始就標榜循環經濟，便應該秉持「零排放、零廢棄、零事故」原則，建立循環園區的工業新典範，嚴格篩選、審查園區進駐之產業與廠商，周全規劃廠區物質流的循環，讓污染、碳排、廢棄物等降至最低，並有充分的資訊揭露及社會參與，如此，才符合高雄市政府早先的承諾，同時不枉大林蒲居民的犧牲。\u003c/p>\u003cp>\u003cimg alt=\"20260924-001_0.webp\" height=\"100%\" loading=\"lazy\" src=\"https://www.cet-taiwan.org/sites/default/files/u355/20260924-004.webp\" width=\"100%\"/>\u003cspan>高雄小港大林蒲聚落周邊示意圖。（圖／地球公民基金會）\u003c/span>\u003c/p>", "role": "", "exampleNote": ""}]}, {"id": "empty", "name": "用空白 p 拉開間距", "note": "空段落會多出一塊間距，貼到別的編輯器時常變成多餘空行。", "promptHint": "段落之間插入空白 p 來增加間距。", "articles": [{"title": "全球淨零交作業 台灣三項不及格─台灣NDC3.0民間檢核記者會", "url": "https://www.cet-taiwan.org/news/202509/4744", "date": "2025/09/09"}, {"title": "反對重啟核電 全國廢核行動平台送交連署書--呼籲經濟部長審慎回應勿背離非核政策", "url": "https://www.cet-taiwan.org/news/202505/4669", "date": "2025/05/16"}, {"title": "「反對核電重啟，拒絕草率修法」晚會", "url": "https://www.cet-taiwan.org/news/202505/4642", "date": "2025/05/13"}, {"title": "民團嚴正抗議立委不應草率修法讓核電延役--國民黨放水核安、核災風險由全民承擔？", "url": "https://www.cet-taiwan.org/news/202504/4619", "date": "2025/04/01"}, {"title": "電價合理調整，能源轉型才走得遠", "url": "https://www.cet-taiwan.org/news/202503/4618", "date": "2025/03/28"}, {"title": "節能減碳不該成為政治鬥爭犧牲品！抗議國民黨提案刪除家電節能補助與屋頂光電補助、損害全民利益", "url": "https://www.cet-taiwan.org/news/202501/4600", "date": "2025/01/17"}, {"title": "碳費不比茶葉蛋，環保團體強烈遺憾！優惠費率寵壞排碳巨嬰", "url": "https://www.cet-taiwan.org/news/202410/4553", "date": "2024/10/07"}, {"title": "空品標準加嚴不到位 全民呼吸好空氣再拖四年", "url": "https://www.cet-taiwan.org/news/202407/4529", "date": "2024/07/23"}, {"title": "國民黨應撤回延役草案 優先面對核廢處置", "url": "https://www.cet-taiwan.org/news/202407/4521", "date": "2024/07/10"}, {"title": "呼籲農業部開啟社會對話，建立以農民為主體的農業綠能", "url": "https://www.cet-taiwan.org/news/202406/4533", "date": "2024/06/21"}, {"title": "滿口環境保護，卻將山林開膛破肚？——嚴正呼籲立即撤回三項草案", "url": "https://www.cet-taiwan.org/news/202405/4493", "date": "2024/05/20"}, {"title": "民主是環境保護的基石，不容開倒車！", "url": "https://www.cet-taiwan.org/news/202405/4491", "date": "2024/05/19"}], "examples": [{"title": "全球淨零交作業 台灣三項不及格─台灣NDC3.0民間檢核記者會", "url": "https://www.cet-taiwan.org/news/202509/4744", "date": "2025/09/09", "html": "\u003cp>\u003cu>\u003cstrong>環境權保障基金會研究員湯琳翔\u003c/strong>\u003c/u>認為，NDC3.0應對2035年的碳定價做出更具體的調升承諾，以對國內外展現減碳決心。台灣已於今年實施碳費制度，未來也在規劃實施總量管制碳交易，但目前碳費一般費率僅收一公噸300元，再加上優惠費率、免徵額度、高碳洩漏風險等制度七折八扣，加速淨零轉型的推力有限。根據綠色金融體系網絡（Network for Greening the Financial System, NGFS）所做評估，要達成2050淨零排放，2035年的碳價須達到每噸300美金(約9000元台幣)，而國內學者王寶貫、蕭代基等於2023年所作預估，也建議2035年的台灣碳價應達到每噸4576元。而新加坡於NDC中具體承諾在2026年將碳稅從目前每噸25新幣調升到45元新幣，並預計在2030年調升至50到80元新幣，成為亞洲最高水準的碳稅，展現其減碳決心，故建議台灣的NDC也應該具體對2035年的碳定價提出調升承諾，加速推動產業減碳。\u003c/p>\u003cp> \u003c/p>\u003cp>\u003cimg alt=\"20250909-006.jpg\" src=\"https://www.cet-taiwan.org/sites/cet-taiwan.org/files/u400/20250909-006.jpg\"/>\u003cspan>環境權保障基金會研究員湯琳翔 (圖/ 台灣行動氣候聯盟)\u003c/span>\u003c/p>", "role": "", "exampleNote": ""}, {"title": "反對重啟核電 全國廢核行動平台送交連署書--呼籲經濟部長審慎回應勿背離非核政策", "url": "https://www.cet-taiwan.org/news/202505/4669", "date": "2025/05/16", "html": "\u003cp>此外，全國廢核行動也呼籲經濟部應聚焦於核電除役後的安全管理、核廢料處置與能源轉型等當務之急。重啟老舊核電將使社會再次陷入核電爭議與對立，虛擲時間，耽誤能源轉型進度，當前全球已進入再生能源加速發展的關鍵階段，台灣不應落後，更應強化電網韌性與節能技術，才能真正實現永續、安全、民主的未來。\u003c/p>\u003cp> \u003c/p>\u003cp>為何反對危險老舊核電延役？老舊核電有以下風險：\u003c/p>", "role": "", "exampleNote": ""}, {"title": "「反對核電重啟，拒絕草率修法」晚會", "url": "https://www.cet-taiwan.org/news/202505/4642", "date": "2025/05/13", "html": "\u003cp>此外，中國已具備導彈精準打擊能力，如東風-17導彈誤差僅10公尺，足以直接摧毀反應器設施。若發生核災，中共可能犧牲屏東南部，換取佔領台灣其他地區的戰略利益。賴中強痛批中華民國核能學會刻意誤導公眾、淡化風險，呼籲政府及立委應堅守核三廠如期除役，避免國安成為核電延役的犧牲品。\u003c/p>\u003cp> \u003c/p>\u003cp>晚會出席名單：媽媽氣候行動聯盟楊順美秘書長、音樂人楊舒雅、立法委員陳培瑜、立法委員郭昱晴、立法委員林宜瑾、立法委員伍麗華、立法委員范雲、台北市議員苗博雅、雙和罷團代表Kevin、反核青年李若慈、本全法律事務所長詹順貴律師、台灣環境保護聯盟謝志誠會長、野薑花公民協會理事王守誠、音樂人吳志寧、主婦聯盟環境保護基金會董事長林玉珮、經濟民主連合智庫召集人賴中強等人。\u003c/p>", "role": "", "exampleNote": ""}]}, {"id": "br", "name": "p 裡面用 br 換行", "note": "同一段裡換行，行距比段落緊。適合地址或項目內換行，不適合拿來切換正文段落。", "promptHint": "同一段裡要換行時使用 br，不要為了換行而新開一個 p。", "articles": [{"title": "別讓海審會淪為空轉程序！呼籲依法不予許可滿地富開發　守護比西里岸、珊瑚礁與海岸永續", "url": "https://www.cet-taiwan.org/news/202607/4876", "date": "2026/07/24"}, {"title": "後勁反五輕運動40年音樂晚會--後勁堅持反五輕，為高雄帶來好空氣、產業轉型", "url": "https://www.cet-taiwan.org/news/202606/4859", "date": "2026/06/01"}, {"title": "11/1「為氣候而走  打造韌性台灣」遊行開跑記者會", "url": "https://www.cet-taiwan.org/news/202510/4751", "date": "2025/10/13"}, {"title": "空污資訊公開、強化法制，守護校園空氣品質", "url": "https://www.cet-taiwan.org/news/202509/4745", "date": "2025/09/11"}, {"title": "核三重啟公投「不同意」屏東晚會", "url": "https://www.cet-taiwan.org/news/202508/4728", "date": "2025/08/16"}, {"title": "老舊核三重啟公投，屏東人不同意！", "url": "https://www.cet-taiwan.org/news/202507/4707", "date": "2025/07/03"}, {"title": "氣候績效死當，股東權益完蛋—台塑石化氣候績效評估報告發布", "url": "https://www.cet-taiwan.org/news/202505/4679", "date": "2025/05/29"}, {"title": "草率修法毀核安，藍白亂搞全民擔——全民風險成政客籌碼？民團譴責在野黨無視核安", "url": "https://www.cet-taiwan.org/news/202505/4668", "date": "2025/05/08"}, {"title": "美顏濾鏡關掉了!站站達標才及格", "url": "https://www.cet-taiwan.org/news/202502/4601", "date": "2025/02/06"}, {"title": "核三如期除役 保障人民安全—老舊核電風險 延役不切實際", "url": "https://www.cet-taiwan.org/news/202407/4531", "date": "2024/07/26"}, {"title": "​​427反核佔領行動十週年，為反核電延役再上街頭怒吼​", "url": "https://www.cet-taiwan.org/news/202404/4482", "date": "2024/04/29"}, {"title": "反對危險老舊核電延役  427反核佔領十週年再上街頭", "url": "https://www.cet-taiwan.org/news/202404/4461", "date": "2024/04/10"}], "examples": [{"title": "別讓海審會淪為空轉程序！呼籲依法不予許可滿地富開發　守護比西里岸、珊瑚礁與海岸永續", "url": "https://www.cet-taiwan.org/news/202607/4876", "date": "2026/07/24", "html": "\u003cp>\u003cimg alt=\"20260724_001.jpg\" src=\"https://www.cet-taiwan.org/sites/cet-taiwan.org/files/u353/20260724_001.jpg\"/>\u003cbr/> \u003cspan>2022年8月滿地富召開部落說明會，部落居民、聲援原民組織及環團則在現場表達意見訴求，最後部落青年高舉標語並大喊「Palasawaden！滿地富，撤回！」。（邱佳旻攝）\u003c/span>\u003c/p>\u003cp>滿地富國際開發股份有限公司（以下簡稱滿地富公司）成立至今30年（請參閱附件一、大事記），從來沒為台東、比西里岸部落帶來任何發展機會，卻已造成部落對立。自2021年起已經連續6年將「滿地富遊樂區開發計畫」（以下簡稱滿地富）送入內政部海岸管理審議會（以下簡稱海審會）審查企圖闖關，但不變的是開發單位維持高達10.5公頃的開發面積，預計興建200間房間，並以歧視在地族群文化與發展的計畫書件，更沒有迴避敏感的珊瑚礁與海洋生態系。\u003c/p>\u003cp>由於書件品質低落、滿地富公司未依《公司法》運作以及海審制度缺乏明確性，導致滿地富一審再審，本次審查已是海審會第6次審議本案，期間海審委員已經更換3屆、也安排2次現勘，滿地富宛如幽魂徘徊在比西里岸土地與內政部國家公園署海審會之上。\u003c/p>", "role": "", "exampleNote": ""}, {"title": "後勁反五輕運動40年音樂晚會--後勁堅持反五輕，為高雄帶來好空氣、產業轉型", "url": "https://www.cet-taiwan.org/news/202606/4859", "date": "2026/06/01", "html": "\u003cp>\u003cimg alt=\"後勁反五輕40年音樂晚會於5_30登場(何俊彥攝)\" src=\"https://www.cet-taiwan.org/sites/cet-taiwan.org/files/u355/20260601-006.webp\"/>\u003cbr/> \u003cspan>後勁反五輕40年音樂晚會於5月30日登場。(何俊彥攝)\u003c/span>\u003c/p>\u003cp>後勁社會福利基金會與後勁廟產管理委員會，於今日（5/30）在鳳屏宮舉辦「反五輕40年紀念音樂晚會」，重現2015年關廠前夕的倒數晚會場景，向後勁反五輕的運動前輩致敬，並感謝社會各界相挺支持。當年的倒數，是對污染工廠的終結期盼；而今日的重現，則在提醒我們，這段由民間發起、為土地而戰的歷程，不該被忘記。 \u003c/p>\u003cp>過去的中油高雄廠，曾是全台面積最大的污染場址，如今在後勁居民的堅持，以及各方的協力下，已成功轉型。除台積電的先進製程廠進駐，高雄市政府亦承諾將規劃生態綠廊，將讓此地成為「生態綠廊內的科學園區」，為在地居民改善居住環境。 \u003c/p>", "role": "", "exampleNote": ""}, {"title": "11/1「為氣候而走  打造韌性台灣」遊行開跑記者會", "url": "https://www.cet-taiwan.org/news/202510/4751", "date": "2025/10/13", "html": "\u003cp>今年台灣首次與國際同步提出2035年氣候承諾，也就是國家自定貢獻目標（NDC3.0），宣示氣候行動成為國家優先政策。然而，當前的減碳目標未符合淨零路徑，也缺乏針對能源、運輸、工業等部門的明確策略與治理機制，都將削弱政策成效與社會信任。\u003cbr/> \u003cbr/> 崔愫欣強調，為了不讓地球透支，將這筆巨大的「碳債」轉嫁給未來世代，因此我們必須團結起來共同呼籲「守護升溫不超過1.5°C的世界」，這不只是技術或數字目標，而是為了確保人類社會與生態安全延續的最低底線。象徵著我們要在本世代積極減碳、淘汰化石燃料、推動公正轉型，確保地球仍是能讓孩子安心成長、萬物共存的家園。\u003c/p>", "role": "", "exampleNote": ""}]}]}, {"id": "heading", "name": "內文小標", "field": "#body", "exclusive": false, "summary": "同一篇可以同時有好幾種小標，所以篇數加總可能超過總篇數。這裡比的是用 h2、h3，還是用加粗段落、【】段落來當小標。", "official": "範本依序使用 h2、h3、h4，不建議為了做小標去改字級、字色或字體。", "officialHtml": "", "variants": [{"id": "h2", "name": "h2", "note": "內文大標。官方範本的第一層是 h2。", "promptHint": "內文章節使用 h2。", "articles": [{"title": "核三再運轉計畫審查完成不等於安全無虞　 34團體籲擴大專業、公開資訊、落實民主參與", "url": "https://www.cet-taiwan.org/news/202609/100176", "date": "2026/09/29"}, {"title": "廢核平台成立公投反方辦事處　電視辯論破解核電謠言", "url": "https://www.cet-taiwan.org/news/202609/100175", "date": "2026/09/24"}, {"title": "落實三零「零排放、零廢棄、零事故」，新材料循環產業園區應建立工業新典範", "url": "https://www.cet-taiwan.org/news/202609/100174", "date": "2026/09/24 n.org/news/202404/4464", "date": "2024/04/15"}, {"title": "反對危險老舊核電延役  427反核佔領十週年再上街頭", "url": "https://www.cet-taiwan.org/news/202404/4461", "date": "2024/04/10"}, {"title": "核電除役不可逆、新北市民才平安", "url": "https://www.cet-taiwan.org/news/202403/4451", "date": "2024/03/19"}], "examples": [{"title": "屋頂光電少六成 ，四年努力不如建商兩天遊說/拒絕半套光電，年底歸還公民完整新制", "url": "https://www.cet-taiwan.org/news/202608/4888", "date": "2026/08/05", "html": "\u003col> \u003cli>拒絕半套光電，今年12/1前完整全面實施：政府應將「G-3類組（辦公、服務類）」與「H類組（住宅類）」兩大類納回適用範圍，確保今年12/1前全面實施，還給公民完整新制。\u003c/li> \u003cli>公開政策退縮決策轉彎過程，接受社會檢驗：行政院應公布決策時間軸、會議紀錄、與會部會、意見及影響評估，說明決策層級、事證與法規依據，並交代是否依法重新預告，避免少數利益黑箱左右公共政策。\u003c/li> \u003cli>全面公開各類建築光電潛能，建立客觀對話基礎：政府應主動揭露本標準適用範圍內，A類至H類建築之光電潛力占比及相關資訊，建構各縣市屋頂光電典範案例，促進全民參與公民電廠機制。 \u003c/li> \u003cli>充實配套機制，建立中央與地方協調平台：中央應主動建構與地方政府之溝通協調平台，針對產權釐清、維護管理及地方法規競合等議題，展開實質研商與法規調和，完備屋光新制配套措施，早日落實政策。\u003c/li> \u003c/ol>", "role": "一般條列", "exampleNote": ""}, {"title": "台積恐耗全台２成電　應與民間共築「減碳協作平台」", "url": "https://www.cet-taiwan.org/news/202605/4856", "date": "2026/05/27", "html": "\u003col> \u003cli>再生能源承諾：南科管理局及主要進駐廠商台積電應於本案落實科學園區政策環評對再生能源之承諾，即「積體電路先進製程廠商於自建廠房量產後，每年取得前一年度實際用電量之25%再生能源、2040年取得45%再生能源及2050年取得100%再生能源」。該承諾實已大幅落後於台積電於永續報告書具體承諾之「2030年全公司生產營運據點60%用電量為再生能源」，但本案環說書仍僅有提及2050年取得100%實際用電量的再生能源，其他政策環評提及的階段性再生能源目標全被忽略。台積電已達成國外廠區使用100%再生能源，但國內廠區目前僅使用6.2%，應更積極協助台灣再生能源發展，我們認為本案最少應承諾達成政策環評低標用電量25%之目標，為台灣增加至少56.75億度再生能源，方能符合台積電去年宣布將依科學基礎減量目標倡議（The Science Based Targets Initiative, SBTi）實踐的減量路徑。\u003cbr/> \u003c/li> \u003cli>能源效率承諾：台積電於永續報告書中訂定2030年提升能源使用效率目標，包括「相同製程技術量產5年後，生產能效提升1倍」。本案環說書卻對於能源使用效率毫無要求，我們呼籲台積電應參考自己於永續報告書提出的目標，具體於環評承諾中加入提升能源使用效率之目標。\u003cbr/> \u003c/li> \u003cli>建立溫室氣體減量協作平台：根據環評書件推估，本案營運期間總溫室氣體排放量高達每年 2,139 萬噸二氧化碳當量（CO2e），其中製程直接排放（範疇一）為 1,322 萬噸，外購電力間接排放（範疇二）為 817 萬噸。面對如此驚人的溫室氣體與碳排增量，若電力供應不儘速邁向減碳、減污，將衝擊區域環境與居民健康。\u003c/li> \u003c/ol>", "role": "一般條列", "exampleNote": ""}]}, {"id": "br", "name": "同一個 p，用 br 分行", "note": "多筆內容放在同一個 p，中間用 br。視覺像清單，但沒有清單語意。", "promptHint": "多筆資料放在同一個 p，每一筆之間用 br。", "articles": [{"title": "老舊核三不延役，反對藍白亂修法", "url": "https://www.cet-taiwan.org/news/202504/4630", "date": "2025/04/23"}, {"title": "反對立院不顧老舊核電風險 草率修法為核電延役解套", "url": "https://www.cet-taiwan.org/news/202407/4520", "date": "2024/07/09"}, {"title": "9微克，護健康！環境部應加嚴空氣品質標準、修改AQI", "url": "https://www.cet-taiwan.org/news/202405/4495", "date": "2024/05/23"}, {"title": "民主是環境保護的基石，不容開倒車！", "url": "https://www.cet-taiwan.org/news/202405/4491", "date": "2024/05/19"}], "examples": [{"title": "民主是環境保護的基石，不容開倒車！", "url": "https://www.cet-taiwan.org/news/202405/4491", "date": "2024/05/19", "html": "\u003cp>在5月17日立法院院會審議的過程中，發生的重大問題包括：\u003cbr/> 一、法案資訊未公開，成為民眾黨立委黃國昌口中的「最高機密」，內容未經社會各界討論，立委們進行表決時亦未宣讀條文，使全國人民無從檢視、監督。\u003cbr/> 二、立法院審議過程跳過必要之委員會、召委協商、院長協商等可以逐條討論的程序，沒收法案的實質討論。\u003cbr/> 三、國民黨籍立法院院長韓國瑜以無記名方式「舉手表決」，使公民對投票之立委無從課責，更在過程中以自創的「反表決」強行審查，讓立法院議事規則淪為笑話。\u003cbr/> 上述問題，違反程序正義之嚴重程度，已經遠超2014年的服貿審查事件，是赤裸裸地在國會殿堂，踐踏台灣民主。\u003c/p>", "role": "一般條列", "exampleNote": ""}, {"title": "老舊核三不延役，反對藍白亂修法", "url": "https://www.cet-taiwan.org/news/202504/4630", "date": "2025/04/23", "html": "\u003cp>備註二、台南、高雄、屏東「反對老舊核電廠延役」縣市長、民意代表連署名單\u003c/p>\u003cp>縣市首長：高雄市長陳其邁、屏東縣長周春米\u003c/p>\u003cp>立法委員：黃捷、李昆澤、邱議瑩、賴瑞隆、許智傑、邱志偉、李柏毅、陳亭妃、林宜瑾、郭國文、王定宇、賴惠員、徐富癸、莊瑞雄、鍾佳濱、（2025/4/25新增：林岱樺）\u003c/p>", "role": "註釋", "exampleNote": ""}, {"title": "9微克，護健康！環境部應加嚴空氣品質標準、修改AQI", "url": "https://www.cet-taiwan.org/news/202405/4495", "date": "2024/05/23", "html": "\u003cp>參考資料：\u003c/p>\u003cp>20240424 European Parliament Press Releases–\u003ca href=\"https://www.europarl.europa.eu/news/en/press-room/20240419IPR20587/air-pollution-parliament-adopts-revised-law-to-improve-air-quality\">Air pollution: Parliament adopts revised law to improve air quality\u003c/a>\u003c/p>\u003cp>20240207 EPA Press Office –\u003ca href=\"https://www.epa.gov/newsreleases/epa-finalizes-stronger-standards-harmful-soot-pollution-significantly-increasing\">EPA finalizes stronger standards for harmful soot pollution, significantly increasing health and clean air protection iwan.org/news/202403/4455", "date": "2024/03/29"}], "examples": [{"title": "核三再運轉計畫審查完成不等於安全無虞　 34團體籲擴大專業、公開資訊、落實民主參與", "url": "https://www.cet-taiwan.org/news/202609/100176", "date": "2026/09/29", "html": "\u003cp>\u003cstrong>一、擴大核三後續審查的專業組成，並完整公開審查資訊\u003c/strong>\u003cbr/>後續安全審查應納入的地質、地震、氣候、複合式災害、緊急醫療、交通、公共衛生與地方公共安全專業，避免核安重大決策侷限於既有核能與工程專業。並應公開審查委員及專家的完整名單、專業背景、遴選方式與利益迴避資訊，使社會得以檢驗審查專業是否完整且具獨立性。\u003c/p>\u003cp>\u003cstrong>二、建立跨部會及地方政府共同參與的決策機制\u003c/strong>\u003cbr/>核三重啟涉及環境、能源、消防、災害應變、交通及地方治理，環境部、經濟部（含能源署、地礦中心）、內政部（含消防署）、交通部（含公路局、中央氣象署）、衛福部，以及可能受事故影響的地方政府，都應正式納入風險評估與決策程序，並對其決策負起相應責任。\u003c/p>\u003cp>\u003cstrong>三、未取得完整資訊公開，不應以全國公投作為核三重啟之政治授權\u003c/strong>\u003cbr/>地質、老化、耐震、經濟成本、核廢料、環境影響及事故應變等資訊尚未完整以前，年底核能公投不得被解讀為核三安全無虞或重啟核三的社會共識，更不得成為推進核三廠再運轉執照核發的政治壓力。政府亦不應預設核三必然重啟，或以既定政治時程影響安全審查。\u003c/p>", "role": "一般條列", "exampleNote": ""}, {"title": "空品標準加嚴不到位 全民呼吸好空氣再拖四年", "url": "https://www.cet-taiwan.org/news/202407/4529", "date": "2024/07/23", "html": "\u003cp>（資料來源：環境部，地球公民基金會製表）\u003c/p>\u003cp>國衛院依多年實證研究結果，早在2018年建議PM2.5年平均值標準訂為10μg/m3、24小時值標準25μg/m3；近一年歐洲議會及美國也啟動標準，或未來改善目標的修訂，其中美國參考了許多公衛研究及科學證據加嚴PM2.5年平均值標準為9μg/m3，PM2.5對台灣人的健康傷害不會比較輕，我們認為環境部對於PM2.5年平均值標準之修正應比照美國。此外PM2.524小時值標準自2012年訂定以來從未調整，於本次修正應參考WHO過度4目標（表二）及國衛院建議，加嚴為25μg/m3。\u003c/p>", "role": "參考資料", "exampleNote": ""}]}, {"id": "heading", "name": "h2 或 h3 當區標", "note": "區名做成真的小標，下面才是內容。", "promptHint": "區名使用 h3，下面的多筆資料再用選定的清單寫法。", "articles": [{"title": "部分立委停止帶頭踐踏國土秩序　國土計畫不該因少數縣市延宕上路", "url": "https://www.cet-taiwan.org/news/202411/4571", "date": "2024/11/21"}], "examples": [{"title": "部分立委停止帶頭踐踏國土秩序　國土計畫不該因少數縣市延宕上路", "url": "https://www.cet-taiwan.org/news/202411/4571", "date": "2024/11/21", "html": "\u003ch3>【備註】各縣市報部進度\u003c/h3>\u003ctable> \u003ctbody> \u003ctr> \u003ctd>\u003cstrong>已報內政部 (14)\u003c/strong>\u003c/td> \u003ctd>臺北市、臺南市、高雄市、宜蘭縣、新竹縣、嘉義縣、屏東縣、基隆市、澎湖縣、金門縣、花蓮縣、嘉義市、新竹市、連江縣\u003c/td> \u003c/tr> \u003ctr> \u003ctd>\u003cstrong>有計畫報內政部 (6)\u003c/strong>\u003c/td> \u003ctd>新北市、臺中市、苗栗縣、彰化縣、台東縣、桃園市\u 假村」第一次程序審查，確認本案主管機關由台東縣政府轉移為中央環保署。\u003c/td> \u003c/tr> \u003ctr> \u003ctd>2023年4月\u003c/td> \u003ctd>開發單位ATT集團於東河鄉公所舉行「台東縣南都蘭段休閒渡度假村」第三次說明會。\u003c/td> \u003c/tr> \u003ctr> \u003ctd>2024年6月\u003c/td> \u003ctd>環境部召開「台東縣南都蘭段休閒渡假村」第一次環評初審，審查結論補件再審。\u003c/td> \u003c/tr> \u003ctr> \u003ctd>2024年8月\u003c/td> \u003ctd>聯合報踢爆ATT集團於花蓮七星潭以切割面積，規避環評之方式開發渡假村，總計切割為7案，總面積將近20公頃，房間數約3500間。\u003c/td> \u003c/tr> \u003ctr> \u003ctd>2024年11月\u003c/td> \u003ctd>環境部召開「台東縣南都蘭段休閒渡假村」第二次環評初審，審\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>", "role": "表格", "exampleNote": ""}, {"title": "呼籲賴政府守住政策承諾 屋頂光電新制8月1日如期全面實施", "url": "https://www.cet-taiwan.org/news/202607/4883", "date": "2026/07/31", "html": "\u003ctable> \u003ctbody> \u003ctr> \u003ctd> \u003cp>項目\u003c/p> \u003c/td> \u003ctd colspan=\"3\"> \u003cp>民間團體估計\u003c/p> \u003c/td> \u003ctd colspan=\"3\"> \u003cp>內政部估計\u003c/p> \u003c/td> \u003c/tr> \u003ctr> \u003ctd> \u003cp>適用範圍\u003c/p> \u003c/td> \u003ctd colspan=\"6\"> \u003cp>1,000平方公尺（約300坪）\u003c/p> \u003c/td> \u003c/tr> \u003ctr> \u003ctd> \u003c/td> \u003ctd> \u003cp>ABCDFGH（註一）\u003c/p> \u003c/td> \u003ctd> \u003cp>住宅(H)\u003c/p> \u003c/td> \u003ctd> \u003cp>不含住宅(ABCDEFG)\u003c/p> \u003c/td> \u003ctd> \u003cp>ABCDFGH\u003c/p> \u003c/td> \u003ctd> \u003cp>住宅(H)\u003c/p> \u003c/td> \u003ctd> \u003cp>不含住宅(ABCDEFG)\u003c/p> \u003c/td> \u003c/tr> \u003ctr> \u003ctd> \u003cp>年增裝置容量(註二)\u003c/p> \u003c/td> \u003ctd> \u003cp>374.7 MW\u003c/p> \u003c/td> \u003ctd> \u003cp>225.3 MW\u003c/p> \u003c/td> \u003ctd> \u003cp>149.4 MW\u003c/p> \u003c/td> \u003ctd> \u003cp>660 MW\u003c/p> \u003c/td> \u003ctd> \u003cp>52 MW\u003c/p> \u003c/td> \u003ctd> \u003cp>608 MW\u003c/p> \u003c/td> \u003c/tr> \u003ctr> \u003ctd> \u003cp>綠電年產量\u003c/p> \u003c/td> \u003ctd> \u003cp>4.68億度\u003c/p> \u003c/td> \u003ctd> \u003cp>2.81億度\u003c/p> \u003c/td> \u003ctd> \u003cp>1.87億度\u003c/p> \u003c/td> \u003ctd> \u003cp>8.25億度\u003c/p> \u003c/td> \u003ctd> \u003cp>0.65億度\u003c/p> \u003c/td> \u003ctd> \u003cp>7.6億度\u   <script>
    const guide = JSON.parse(document.getElementById("guide-data").textContent);
    const ui = guide.ui || {};
    const storeKey = ui.storeKey || "cet-story-style-v1";
    const noteKey = storeKey + "-note";
    if (ui.title) {
      document.title = ui.title;
      document.getElementById("page-title").textContent = ui.title;
    }
    if (ui.lede) document.getElementById("page-lede").textContent = ui.lede;
    if (ui.notePlaceholder) document.getElementById("decision-note").placeholder = ui.notePlaceholder;
    const state = {
      typeId: guide.types[0].id,
      variantId: {},
      exampleIndex: {},
      decisions: {},
      note: ""
    };

    try {
      state.decisions = JSON.parse(localStorage.getItem(storeKey) || "{}");
      state.note = localStorage.getItem(noteKey) || "";
    } catch (err) {
      state.decisions = {};
    }

    const findings = guide.findings || [];

    function typeById(id) {
      return guide.types.find((item) => item.id === id) || guide.types[0];
    }

    function variantById(type, id) {
      return type.variants.find((item) => item.id === id) || type.variants[0];
    }

    function save() {
      localStorage.setItem(storeKey, JSON.stringify(state.decisions));
      localStorage.setItem(noteKey, state.note);
    }

    function readHash() {
      const raw = decodeURIComponent(location.hash.replace(/^#/, ""));
      if (!raw || raw === "decide") return;
      const [typeId, variantId] = raw.split("/");
      if (typeById(typeId).id !== typeId && !guide.types.some((item) => item.id === typeId)) return;
      if (guide.types.some((item) => item.id === typeId)) {
        state.typeId = typeId;
        if (variantId && typeById(typeId).variants.some((item) => item.id === variantId)) {
          state.variantId[typeId] = variantId;
        }
      }
    }

    function writeHash() {
      const variantId = state.variantId[state.typeId];
      const next = variantId ? `#${state.typeId}/${variantId}` : `#${state.typeId}`;
      if (location.hash !== next) history.replaceState(null, "", next);
    }

    function currentVariant(type) {
      const chosen = state.variantId[type.id] || state.decisions[type.id];
      return variantById(type, chosen);
    }

    function escapeHtml(text) {
      return String(text)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;");
    }

    function renderFindings() {
      const scopeNote = ui.scopeNote || "";
      document.getElementById("scope-line").textContent =
        `範圍：${guide.source}，共 ${guide.articleCount} 篇（${guide.dateFrom} 到 ${guide.dateTo}）。${scopeNote}`;
      document.getElementById("findings").innerHTML = findings.map((text) =>
        `<div class="col-md-4"><p class="finding mb-0">${text}</p></div>`
      ).join("");
    }

    function renderNav() {
      document.getElementById("type-nav").innerHTML = guide.types.map((type) => {
        const active = type.id === state.typeId ? "active" : "";
        const pressed = type.id === state.typeId ? "true" : "false";
        const mark = state.decisions[type.id] ? '<span class="count-pill">已選</span>' : "";
        return `<button type="button" class="nav-link ${active}" role="tab" aria-selected="${pressed}" data-type="${type.id}">${escapeHtml(type.name)} ${mark}</button>`;
      }).join("");
    }

    function renderPanel() {
      const type = typeById(state.typeId);
      const variant = currentVariant(type);
      state.variantId[type.id] = variant.id;
      const exampleIndex = state.exampleIndex[`${type.id}:${variant.id}`] || 0;
      const example = variant.examples[exampleIndex] || null;
      const share = Math.round((variant.articles.length / guide.articleCount) * 100);
      const countLabel = type.exclusive
        ? `${variant.articles.length} / ${guide.articleCount} 篇（${share}%）`
        : `${variant.articles.length} 篇出現過這個寫法`;
      const adopted = state.decisions[type.id] === variant.id;
      const tabs = type.variants.map((item) => {
        const on = item.id === variant.id ? "active" : "";
        const chosen = state.decisions[type.id] === item.id ? " ✓" : "";
        return `<button type="button" class="nav-link variant-tab ${on}" data-variant="${item.id}">${escapeHtml(item.name)}${chosen}<span class="d-block small">${item.articles.length} 篇</span></button>`;
      }).join("");
      const exampleButtons = variant.examples.map((item, index) => {
        const on = index === exampleIndex ? "btn-success" : "btn-outline-success";
        const label = item.role ? `範例 ${index + 1}・${item.role}` : `範例 ${index + 1}`;
        return `<button type="button" class="btn ${on}" data-example="${index}">${escapeHtml(label)}</button>`;
      }).join("");
      const preview = example
        ? example.html
        : "<p>這個寫法沒有可預覽的片段。</p>";
      const note = example && example.exampleNote ? `<p class="small text-secondary mb-2">${escapeHtml(example.exampleNote)}</p>` : "";
      const sourceLink = example
        ? `<a class="btn btn-outline-success" href="${escapeHtml(example.url)}" target="_blank" rel="noopener noreferrer">打開原頁看正式站效果</a>`
        : "";
      const code = example ? example.html : "";
      const articles = variant.articles.slice(0, 8).map(articleLink).join("");
      const rest = variant.articles.slice(8);
      const restHtml = rest.length
        ? `<details class="mt-2"><summary>其餘 ${rest.length} 篇</summary><ul class="mt-2 mb-0">${rest.map(articleLink).join("")}</ul></details>`
        : "";
      const official = type.officialHtml
        ? `<div class="mt-3"><p class="fw-bold mb-2">官方範本實際片段</p><div class="article-preview border rounded p-3">${type.officialHtml}</div></div>`
        : "";

      document.getElementById("type-panel").innerHTML = `
        <p class="eyebrow mb-2">${escapeHtml(type.field)}</p>
        <h2 class="h3">${escapeHtml(type.name)}</h2>
        <p>${escapeHtml(type.summary)}</p>
        <p class="mb-3">${escapeHtml(type.official)}${guide.templateUrl ? ` <a href="${escapeHtml(guide.templateUrl)}" target="_blank" rel="noopener noreferrer">打開官方範本</a>` : ""}</p>
        ${official}
        <div class="nav nav-pills flex-nowrap overflow-auto gap-2 py-3" role="tablist" aria-label="寫法">${tabs}</div>
        <p class="mb-2"><span class="count-pill">${countLabel}</span></p>
        <p>${escapeHtml(variant.note)}</p>
        <div class="d-flex flex-wrap gap-2 mb-3" aria-label="這個寫法的範例">${exampleButtons}</div>
        ${note}
        <h3 class="h6">實際效果</h3>
        <div class="article-preview border rounded p-3 mb-3">${preview}</div>
        <div class="d-flex flex-wrap gap-2 mb-4">
          ${sourceLink}
          <button type="button" class="btn ${adopted ? "btn-success" : "btn-dark"}" id="adopt-btn">${adopted ? "已採用這個寫法" : "採用這個寫法"}</button>
          <a class="btn btn-link" href="#decide">到下面產生 prompt</a>
        </div>
        <h3 class="h6">使用這個寫法的文章</h3>
        <ul class="mb-3">${articles || "<li>沒有對應文章</li>"}</ul>
        ${restHtml}
        <h3 class="h6 mt-3">HTML</h3>
        <pre class="source-code mb-0">${escapeHtml(code)}</pre>
      `;
      writeHash();
    }

    function articleLink(article) {
      const date = article.date ? `（${escapeHtml(article.date)}）` : "";
      return `<li class="mb-1"><a href="${escapeHtml(article.url)}" target="_blank" rel="noopener noreferrer">${escapeHtml(article.title)}</a>${date}</li>`;
    }

    function renderDecisions() {
      document.getElementById("decision-list").innerHTML = guide.types.map((type) => {
        const chosen = type.variants.find((item) => item.id === state.decisions[type.id]);
        const label = chosen ? chosen.name : "尚未選擇";
        return `<p class="mb-1"><a href="#${type.id}/${chosen ? chosen.id : type.variants[0].id}">${escapeHtml(type.name)}</a>：${escapeHtml(label)}</p>`;
      }).join("");
      document.getElementById("decision-note").value = state.note;
      document.getElementById("prompt-box").value = buildPrompt();
    }

    function buildPrompt() {
      const lines = (guide.promptIntro || []).slice();
      lines.push("");
      lines.push(`對照範圍是 ${guide.source}，共 ${guide.articleCount} 篇。${guide.templateUrl ? "官方撰寫範本：" + guide.templateUrl : ""}`);
      lines.push("範本已規定：章節用 h2、h3，條列用 ul 或 ol，項目內換行才用 br（shift+enter），引言用 blockquote，正文一段一個 p。不要改字級、字色、字體，中文不要斜體，不要左右對齊，不要用空白段落撐距離。");
      lines.push("");
      lines.push("這次同事選定的寫法如下。若某項寫「尚未決定」，維持範本，不要自創第三種寫法。");
      guide.types.forEach((type) => {
        const chosen = type.variants.find((item) => item.id === state.decisions[type.id]);
        lines.push("");
        lines.push(`## ${type.name}（${type.field}）`);
        if (!chosen) {
          lines.push("尚未決定。");
          lines.push("可選寫法：" + type.variants.map((item) => item.name).join("、"));
          return;
        }
        const sample = chosen.examples[0];
        lines.push(`採用：${chosen.name}`);
        lines.push(chosen.promptHint);
        if (sample) lines.push(`範例原頁：${sample.url}`);
        const rejected = type.variants.filter((item) => item.id !== chosen.id).map((item) => item.name);
        if (rejected.length) lines.push("不要混用：" + rejected.join("、"));
      });
      if (state.note.trim()) {
        lines.push("");
        lines.push("## 補充決定");
        lines.push(state.note.trim());
      }
      return lines.join("\n");
    }

    document.getElementById("type-nav").addEventListener("click", (event) => {
      const button = event.target.closest("[data-type]");
      if (!button) return;
      state.typeId = button.dataset.type;
      renderNav();
      renderPanel();
    });

    document.getElementById("type-panel").addEventListener("click", (event) => {
      const variantBtn = event.target.closest("[data-variant]");
      if (variantBtn) {
        state.variantId[state.typeId] = variantBtn.dataset.variant;
        state.exampleIndex[`${state.typeId}:${variantBtn.dataset.variant}`] = 0;
        renderPanel();
        return;
      }
      const exampleBtn = event.target.closest("[data-example]");
      if (exampleBtn) {
        const type = typeById(state.typeId);
        const variant = currentVariant(type);
        state.exampleIndex[`${type.id}:${variant.id}`] = Number(exampleBtn.dataset.example);
        renderPanel();
        return;
      }
      if (event.target.id === "adopt-btn") {
        const type = typeById(state.typeId);
        state.decisions[type.id] = currentVariant(type).id;
        save();
        renderNav();
        renderPanel();
        renderDecisions();
      }
    });

    document.getElementById("decision-note").addEventListener("input", (event) => {
      state.note = event.target.value;
      save();
      document.getElementById("prompt-box").value = buildPrompt();
    });

    document.getElementById("copy-prompt").addEventListener("click", async () => {
      const text = document.getElementById("prompt-box").value;
      const status = document.getElementById("copy-status");
      try {
        await navigator.clipboard.writeText(text);
        status.textContent = "已複製。可以直接貼給之後上稿的 AI。";
      } catch (err) {
        document.getElementById("prompt-box").focus();
        document.getElementById("prompt-box").select();
        status.textContent = "瀏覽器沒有開放剪貼簿，請在文字框裡全選後複製。";
      }
    });

    window.addEventListener("hashchange", () => {
      readHash();
      renderNav();
      renderPanel();
    });

    readHash();
    renderFindings();
    renderNav();
    renderPanel();
    renderDecisions();
  </script>
</body>
</html>
