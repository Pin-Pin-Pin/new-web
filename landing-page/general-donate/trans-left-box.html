<style type="text/css">
.logo-img {
    display: none;
}

}

}
#main #intro_text #top-slogan {

}
#main #intro_text #cet-top-logo {
    width: 160px;

    }

<div class="trans-left-box">
    <picture>

            sizes="(min-width: 992px) 450px, 330px"

        <source
