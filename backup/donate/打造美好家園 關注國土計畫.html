									<p paraeid="{bee42ac3-9c21-435a-ac3f-80096bf5c4cc}{14}" paraid="1709921402"><span style="color:#ffffff;"><span style="font-size:18px;">經過民間與官方長達23年的推動，國土計畫法終於在2015年底通過。<br />
										<br />
										​​​​​​​地球公民期待透過細緻的社會討論對話，政策配套，從全國到各縣市可以做好國土計畫，讓土地利用有合理秩序，不再隨意變更。達成國土保育、農業和城鄉共榮發展。&nbsp;</span></span></p>
									<p paraeid="{bee42ac3-9c21-435a-ac3f-80096bf5c4cc}{38}" paraid="191260321"><span style="color:#ffffff;"><span style="font-size: 18px;">讓美麗山林海岸不亂開發，珍貴農地停止亂蓋工廠，生產和居住空間有區別，生活品質和糧食安全提昇，後代子孫安居樂業。&nbsp;</span></span></p>
									<p paraeid="{bee42ac3-9c21-435a-ac3f-80096bf5c4cc}{48}" paraid="77416548"><span style="color:#ffffff;"><span style="font-size: 18px;">這是影響到每個人的大事，不能只交給政府，需要人民積極的參與。&nbsp;</span></span></p></div></div></div></div>
